body:
  text: 嗣法門人通問等編拈古舉僧問百丈如何是奇特事丈云獨坐大雄峰僧禮拜丈便打師拈云百丈和尚可謂寰中獨據振閫外之威權此僧亦一員上將到此只得拍拍聽令爭奈棒頭有眼明如日實是真金不渾沙豈非奇特之事須向奇特人前拈出即今還有人撥著麼快來與我木上座相見如無老僧今日失利舉僧問藥山平田淺草塵鹿成群如何射得塵中塵山云看箭僧便放身倒山云侍者拖出這死漢僧便起走山云弄泥團漢有什麼數師拈云好一枝箭爭奈其人未敢承當若是箇丈夫漢開襟俯受不勞藥山放出後箭而今還有勝敵驚群者麼且道如何射得塵中塵喝一喝舉僧問投子如何是一大事因緣子云尹司空與老僧開堂碧巖云人道投子實頭不妨忒煞淳朴山僧即不然有問如何是一大事因緣只對他道弄潮須是弄潮人師拈云二老宿舉揚一大事因緣本無優劣作麼生是投子實頭處設若有人問磬山如何是一大事因緣但向他道朝看雲片片暮聽水潺潺舉舍利弗一日入城見月上女出城舍利弗問云什麼處去女云如舍利弗恁麼去舍利弗云我方入城汝方出城何言如舍利弗恁麼去女云諸佛弟子當住何處弗云諸佛弟子當住大涅槃女云諸佛弟子既住大涅槃我如舍利弗恁麼去師拈云當時舍利弗只知善放而不善收若月上女可謂腳跟穩當行無所行去無所去大解脫中了無拘住雖然要且未知向上事在若是山僧作舍利弗待伊道如舍利弗恁麼去則不必落草一把拉入城來看他作何伎倆待伊擬口撒手便行云不同我恁麼去饒伊有超佛越祖之弘為也不奈你何這箇公案古今判斷不少具眼者請試辨看舉高亭參德山隔江問訊山以手招之高亭忽然開悟乃橫趨而去後開法嗣德山徑山云高亭橫趨而去許伊是箇伶俐衲僧若要法嗣德山則未可何故猶與德山隔江在師拈云徑山老漢是謂一抬一捺且賊過後張弓今時人在知識門下三二十年既不隔江合作麼生路遙知馬力日久見人心舉僧問趙州寂寂無依時如何州云老僧在你背後師拈云這僧挨到者箇田地意圖就手安閒卻被趙州腦後一槌七穿八穴而今還見趙州在背後麼或云趙州則不見但見磬山在面前向他道你那裏得見磬山來將拄杖一時趁出舉無業國師云若一毫頭凡聖情念未盡不免入驢胎馬腹裏去白雲端和尚云設使一毫頭凡聖情念淨盡亦未免入驢胎馬腹裏去師拈云未盡淨盡磬山今日一時拈卻諸人還見一毫頭麼喝一喝云切忌鑽龜打瓦舉南院上堂云赤肉團上壁立千仞時有僧問赤肉團上壁立千仞豈不是和尚道院云是僧便掀倒禪床院云你看這瞎漢亂做僧擬議院便打趁出師拈云這僧欲成九仞之山未進一簣之土當時待南院和尚道你看這瞎漢亂做不若一不做二不休總然南院打殺也不得趁你出院即今還有人於壁立千仞處與這僧出氣麼舉外道問佛不問有言不問無言世尊良久外道讚云世尊大慈大悲開我迷雲令我得入外道去後阿難問佛外道有何所證而言得入世尊云如世良馬見鞭影而行雪竇云邪正不分過山鞭影大慧云邪正兩分正由鞭影師拈云二大老恰在鞭影裏批判且道離卻鞭影一句作麼生道良久云三十年後此語大行舉洞山頌云貪嗔癡太無知賴我今朝識得伊行便打坐便捶分付心王子細推無量劫來不解脫問汝三人知不知師拈云古人與麼道磬山則不然貪瞋癡自無為迷悟分明不在伊行無住坐無拘憑在心王不用推無量劫來真解脫何有三人知不知舉雲門上堂拈拄杖云凡夫實謂之有二乘析謂之無緣覺謂之幻有菩薩當體即空衲僧家見拄杖喚作拄杖行但行坐但坐不得動著師拈云雲門老人法令雖嚴可謂官不容針私通車馬何故行但行坐但坐不得動著雖然惺惺底人動著亦得不動著亦得動著不動著亦得未惺惺底人動著不得不動著不得動著不動著總不得且道利害在什麼處舉僧問趙州十二時中如何用心州云你被十二時使老僧使得十二時師拈云這僧當時問處直頭趙老答處依實但不能令人言下薦取今日有人問磬山十二時如何用心即向他道你在什麼處見十二時來莫被十二時使即今還有人十二時用心麼試將來看舉舍利弗問天女汝何不轉卻女身女云我從十二年來求女人相了不可得當何所轉即時天女以神通力變舍利弗如天女乃自化身如舍利弗而問云何不轉卻女身舍利弗云我今不知何轉而變為女身師拈云舍利弗當時好心不得好報諸方盡道被天女轉卻女身據山僧見處當時天女莫道轉得舍利弗一人直饒你轉得大地男子為女身總是自家女身脫不得在何故既云十二年來求女人相了不可得你那裏得見舍利弗轉女身來明眼者試看舉天衣和尚示衆云百骸俱潰散一物鎮長靈百骸潰散皆歸土一物長靈甚處安南堂禪師云一物長靈甚處安長空雲散碧天寬蓮宮佛剎花無數眨起眉毛仔細看師拈云眨起眉毛仔細看天堂地獄任君安百骸未散當先取莫待臨時撒手難舉肇法師道天地同根萬物一體師拈云座主那裏得這消息灼然天何言哉萬象懸懸地何言哉森羅鮮鮮陰陽言哉時之傳傳空谷言哉應之綿綿咄秖如衲僧分上合作麼生一鉢千家飯水邊林下閒舉南泉歸宗麻谷三人同去見忠國師至中途南泉就地畫一圓相云道得則去歸宗坐圓相裏麻谷作女人拜泉云恁麼則不去也師拈云三大老雖同條生不同條死各各有箇出身之路然三人中有一人堪為師法若人擇得出許你具參學眼舉僧問汾陽如何是祖師西來意陽云青絹扇子足風涼師拈云汾陽老人如黃葉止兒啼不妨太易設或有人問磬山如何是祖師西來意向他道水流千派月山鎖一溪雲舉僧問香林如何是衲僧衣下事林云臘月火燒山師拈云臘月燒山衲衣下事有何干千峰雪覆冷坐破這蒲團若人更不會分明也大難舉臨濟與普化一日同往施主齊濟問毛吞巨海芥納須彌為復是神通妙用為復是法爾如然化踢倒飯床濟云太粗生化云這裏是甚麼所在說粗說細濟休去來日又同施主家齊濟復問今日供養何似昨日化又踢倒飯床濟云太粗生化云瞎漢佛法說甚粗細濟吐舌師拈云看這二老宿大機大用一者具擒龍之手一者得陷虎之機可謂作家相見且道誰是陷虎誰是擒龍擇法眼試辨取舉昔有秀才問長沙某曾看千佛名經百千諸佛但見其名未審居何國土沙召秀才才應諾沙云黃鶴樓崔皓題後秀才還曾題否云不曾題沙云得閒題取一篇好師拈云長沙雖得殺人刀活人劍曲垂善巧不無龍頭蛇尾使人不能當下擔荷若是山僧則不然待伊應諾時高聲云居何國土免致葛藤舉三祖信心銘極小同大忘絶境界師拈云拄杖子吞卻十方虛空剎那間流出無邊香水海還是忘絶境界中來非忘絶境界中來若道是忘絶境界中來合喫衲僧痛棒非忘絶境界中來且參祖師信心銘三十年才好與拄杖子相見復舉極大同小不見邊表師拈云須彌山走出蟭螟眼裏須臾之頃見徹三千大千界且道見邊表中來不見邊表中來若不見邊表中來猶未可與衲僧拄杖子相見若見邊表中來如何合得祖師信心銘去參舉臨濟道一喝分賓主照用一時行碧巖和尚喝一喝云且道是賓是主是照是用還委悉麼千峰勢到嶽邊止萬派聲歸海上消師亦喝一喝拈云且道非賓非主非照非用還委悉麼獅子窟中無異獸象王群內絶狐蹤舉懶瓚和尚云吾有一言絶慮忘緣巧說不得只要心傳師拈云吾有一言不待忘緣拈來便得作麼心傳衆中有人出來道既不必心傳諸祖心心相印所為何事但云低聲低聲達磨大師來也舉傅大士云終日焚香擇火不知身是道場師拈云終日焚香擇火不知焚香擇火者是誰舉僧問長沙作麼生轉得山河大地歸自己去沙云作麼生轉得自己歸山河大地去圓悟和尚云得人一牛還人一馬師拈云饒你轉得山河大地歸自己去卻是埋沒己靈亦饒你轉得自己歸山河大地去猶是背覺合塵總不恁麼且道轉是不轉是試定當看舉僧問石門年窮歲盡時如何門云東村王老夜燒錢僧復問開先暹和尚年窮歲盡時如何暹云依舊孟春猶寒師云有人問磬山年窮歲盡時如何對他道一爐紅焰暖騰騰舉修山主頌云欲識解脫道諸法不相到眼耳絶見聞聲色鬧浩浩佛果和尚云聲不到耳色不到眼聲色交參萬法成現且道還踏著解脫道也無不省這箇意修行徒辛苦師云欲識解脫道諸法本不鬧眼耳絶見聞聲色玄浩浩復拈云喚什麼作聲色舉僧問石鞏生死到來如何回避鞏云這的無生死師拈云識得要回避生死者許你透生死復顧視大衆咄云也沒交涉佛果和尚云還識這的麼俊鶻捎空去懵鳥泊籬頭舉僧問雲門佛法如水中月否門云清波無透路僧云和尚從何得問云再問復何來僧云便恁麼去時如何門云重疊關山路師拈云這僧不無萬古碧潭再三撈摝之意爭奈雲門有翻天覆地之能可惜末後進伊不得且道這一步又如何進始得舉臨濟兩堂首座齊下喝僧問臨濟還有賓主也無濟云賓主歷然師拈云以鏡照鏡面面皆正蓮花出水香流遠蘭谷風飄氣宇清舉翠巖示衆云一夏與兄弟東語西話看翠巖眉毛在麼師拈云翠巖面皮三寸厚雖然也是屈己從人不無大人去就且道即今還見磬山眉毛麼亦是三寸厚舉僧問五祖一大藏教是箇切腳未審切那箇腳祖云八囉娘師拈云電光裏穿針舉雲門示衆云你若實未得箇入頭處三世諸佛在你腳跟下一大藏教在你舌頭上且向葛藤處會取師拈云你若實得箇入頭處三世諸佛在你腳跟下一大藏教在你舌頭上休向葛藤裏會取且道與古人是同是別舉前寶壽問後寶壽父母未生前那箇是本來面目後寶壽罔措一日在市見二人相爭有一人相勸云你得恁麼無面目壽遂大悟師拈云得恁麼無面目噫錦繡叢中撞著白雲堆裏活埋洞見本地風光面目依然長在舉南泉示衆云王老師自小養得一頭水牯欲擬向溪東牧不免食他國王水草欲擬向溪西牧亦不免食他國王水草不如隨分納些些總不見得師拈云把住則坐臥空園放行則雲山萬里混塵俗而不流超潔白而無住縱橫自在左右逢源何須道擬向東擬向西而不自由也且喜隨分納些些雖然切忌動著動著則三十棒舉溈山普請次值板鳴有一僧拍手呵呵大笑歸去溈山云奇哉此是觀音入理之門至晚問其僧適來你見箇什麼道理僧云朝來未喫飯聞板聲歡喜溈山云賺殺人師拈云百姓日用而不知故君子之道鮮矣鏡清道當時溈山有此一僧鼓山道當時溈山無此一僧且道是賞伊是罰伊舉趙州到百丈丈問從什麼處來州云南泉來丈云南泉有何言句示人州云有時道未得之人亦須峭然去丈叱之州容愕然丈云大好峭然州便作舞而出師拈云古之所謂趙州者生而知之卻到百丈門下猶為鈍置再撥而轉何不當時待伊叱時呵呵大笑拂袖而出總然百丈有後語也來不及然今已得未得且置如何是峭然一句試道看舉明招在婺州智者寺為第一座尋常不受淨水主事云不識觸淨淨水也不肯受招下禪床拈起淨瓶云這箇是觸是淨主無語招乃撲破淨瓶師拈云明招徹底為人無絲毫委曲爭奈主者未是其人不無賓主傷和耳若磬山作明招待主無語時輕輕對云莫道不識觸淨好留茲淨瓶以付識者舉紫璘供奉擬注思益經忠國師乃問大德凡注經須會佛意始得供奉云若不會佛意爭解注得經國師令侍者盛一碗水著七粒米在水中碗面安一隻筋乃問云這箇是什麼義供奉無語國師云老僧意尚不會豈況佛意不能注得經師云我本師幻有老人云莫謂紫璘供奉不識此意即如佛來也不解國師所設是何意也山僧一見便會得元來總是一箇非難意師拈云可惜供奉未能會國師之意某甲則不然待國師置水碗在面前一腳踢翻國師總有無窮妙意也阻他注經不得我幻有老人若在便道汝雖會國師意未會老僧意在也知某甲罪過舉賓頭盧尊者因阿育王問承聞尊者親見佛來是否尊者以手策起眉良久云會麼王云不會者云阿耨達池龍王請佛齊吾是時亦預其數師拈云當時育王見尊者策起眉毛何不道箇真見佛來速禮三拜免使尊者後來一絡索語卻道不會然尊者見育王道不會何不當時高聲云大王不會最親切如是則育王直下見得亦未可知不枉見如不見逢如不逢者也雖然老僧恁麼說話也是抱椿搖櫓呵呵休舉肅宗帝一日問忠國師云師在曹溪得何法忠云陛下還見空中一片雲麼帝云見忠云釘釘著懸空著師拈云且喜忠國師說法不涉離微不落理路以虛空為口吞吐白雲可謂一時光曜乾坤然肅宗帝若得轉身吐氣看他這一片雲又如何收卷且道轉身一句作麼生道良久云一堂風冷淡千古意分明舉曹山行腳時問烏石觀禪師如何是毗盧法身主觀云不道曹舉似洞山山云好箇話頭只缺進語何不更去問為甚不道曹乃去進語觀云若言我不道即啞卻我口若言我道即禿卻我舌曹歸舉似洞山山深肯之師拈云這三大老雖挾同毗盧頂上行其間不無優劣只如洞山雖識機宜恰是箇扶小兒入市教他語話曹山雖遵命師承且隨人腳跟烏石老漢也是方便不少且道山僧恁麼說話是肯伊不肯伊若道肯伊如何恁麼說若道不肯伊又如何恁麼說會得許你具一隻眼舉僧問仰山法身還解說法也無山云我說不得別有一人說得僧云說得底人在甚處山乃推出枕子溈山聞乃云寂子用劍刃上事師拈云仰山也是藏身露影要瞞這僧即得要瞞磬山未在若是山僧作這僧待云別有一人說得揕住云莫不是這老賊麼縱然手快教伊推枕不出雖然不知溈山老漢道箇劍刃上事又作麼生商量咄休將死鼠為真玉莫把山雞當鳳凰舉洞山一日問雲居甚處去來居云踏山來洞云阿那箇山可住居云阿那箇山不可住洞云與麼則國內總被闍黎占卻也居云不然洞云與麼則子得箇入路居云無路洞云若無路爭得與老僧相見居云若有路即與和尚隔生也洞云此子已後千人萬人把不住師拈云今時人要覓箇山子住且看雲居踏山樣子若不如斯出門便是草漫漫雖然不是洞山老漢也勘驗他不出可謂作家相見如珠走盤盤走珠縱橫無礙豈比迷頭認影敲冰索火緣木求魚者同日語哉今日有人踏山來我且問你有路來無路來若有路來要且不合雲居老人謂無路來又不合洞山和尚若有路無路磬山道箇俱隔如是作麼生合得古人去試道看舉玄沙一日見三人新到遂自去打普請鼓三下卻歸方丈新到具威儀了亦去打普請鼓三下卻入僧堂久住來白沙云新到輕欺和尚沙云打鐘集衆勘過大衆集新到不赴沙令侍者去喚新到才到法堂卻向侍者背上拍一下云和尚喚你侍者至沙處新到便歸堂久住乃問和尚何不勘新到沙云我與你勘了也師拈云大衆且看這新到具參方眼也未若道具參方眼玄沙卻云我與你勘了也若謂不具參方眼其公案見在何故當時若作玄沙待久住云和尚何不勘新到劈頭一拄杖免使後人疑著可不道有意氣時爭意氣不風流處也風流舉文殊菩薩問維摩居士我等各自說已云何是仁者所說不二法門師拈云這箇公案自毗耶離城以至震旦叢林商量不少無非都在聲色語默上摸索轉見沒交涉若要會得須向衆菩薩未啓口處識得根源方知衆菩薩說底即是老維摩不說底老維摩不說底即是衆菩薩說底才知維摩那時其聲如雷豈不見道龍象蹴踏非驢所堪即今還識得維摩老人根源麼良久云天共白雲曉水和明月流舉舍利弗問須菩提夢中說六波羅蜜與覺時是同是別須菩提云此義幽深吾不能說會中有箇彌勒大士可往而問之舍利弗遂問彌勒彌勒云誰為彌勒誰是彌勒者師拈云而今人嘗做得這箇夢來也未假做得這箇夢來始醒得舍利弗來由若未做得這箇夢來且究取須菩提深遠之旨若會得須菩提深遠之旨須識得彌勒佛云誰為彌勒誰是彌勒者到這裏總將箇龜毛索子一束束定置於無夢覺之地或有云那一箇又安置在什麼處喝一喝云依稀似曲才堪聽卻被風吹別調中舉古者道這一片田地分付來多時也我立地待你搆去法眼云這一片田地分付來多時也我坐待你搆去師拈云且看古人諄諄恁麼為人既云這一片田地分付來多時也又道搆去作麼磬山今日雪上加霜驀將拄杖卓下云莫不是這一片麼噫也是揠苗兒舉玄沙到蒲田縣衆以百戲迎之次日沙遂問小塘長老昨日許多喧鬧向甚麼處去塘提起袈裟角示之沙云料掉沒交涉師拈云山僧即不然或有人問昨日許多喧鬧向什麼處去只對他道今日一出尤勝昨日他若道料掉沒交涉云我也知你是箇瞎漢還委麼竹密不妨流水過山高豈礙白雲飛舉遵布衲在藥山浴佛次山云你浴得這個還浴得那箇麼遵云把那箇來師拈云藥山傍通一線俯誘初機遵衲雖是當仁不讓一拶便了當時若作藥山待伊道把那箇來劈手奪杓子過來還他一杓惡水可不徹頭徹尾何故定水湛然滿浴此無垢人舉僧問雲門如何是清淨法身門云六不收道林和尚拈云只道得一半若問道林只對他道一不立乃頌云一不立六不收突然那更有蹤由無限青山留不住落花流水太悠悠師拈云還知二大老鼻孔落在什麼處然雖不負來機盡力道將來秪道得法身邊事且道如何是法身向上事豎起拂子云龍得水時添意氣虎逢山勢長威獰舉僧問歸宗如何是玄旨云無人能會僧云向者如何云有向即乖僧云不向者如何云誰求玄旨又云去無汝用心處僧云豈無方便門令學人得入云觀音妙智力能救世間苦僧云如何是觀音妙智力宗敲鼎蓋三下云還聞麼僧云聞云我何不聞僧無語宗以棒趁下師拈云可惜這老漢架艨艟泛大海隨其順逆不用翻蓬打槳宗師家須到恁麼田地始得不然總落左右邊句爭袪得學人疑滯雖然如此當時這僧是箇靈利底見伊道誰求玄旨何不云和尚好箇方便門速禮三拜若作歸宗待僧道豈無方便門云汝將前話作實法會耶待僧更進語便以棒趁下免致周遮磬山今日還有人識得這玄旨麼噁啼得血流無用處不如緘口過殘春舉三聖和尚參德山才展坐具山云住不用展炊單遮裏無殘羹餿飯與汝云賴遇無設有向甚麼處著山便打聖接住推倒向床上山大笑聖哭蒼天便下參堂堂中首座號踢天泰問行腳高士須得本道公公驗作麼生是本道公驗聖云道什麼座再問聖打一坐具云遮漆桶前後觸忤多少賢良座擬人事聖便過第二座人事師拈云德山老漢一條白棒按過天下衲僧撞著三聖猶較些子何不當時待伊道無著處云也是餿茶剩飯雖然強將手下無弱兵爭奈三聖氣吞宇宙力振江湖孰奈伊何首座當時亦待伊道觸忤多少賢良何不道某甲罪過且不失方情今時人要參方須具這眼目始得若不如是都是依草附木舉溈山問仰山甚處來仰云田中來溈云田中有多少人仰插鍬叉手而立溈云今日南山大有人刈茅仰拽鍬而去雪竇云諸方咸謂插鍬話奇特大似隨邪逐惡據雪竇見處仰山被溈山一問直得草繩自縛去死十分妙喜云仁者見之謂之仁智者見之謂之智百姓日用而不知故君子之道鮮矣師拈云妙喜老人出言吐氣忒殺風流儒雅雪竇龜鑑宗乘恰似壓良為賤今日磬山合作麼生商量不得顢頇放過還知麼幾度黑風吹大海未曾聞道釣舟傾舉龍濟問僧甚處來云翠巖來曰翠巖有何言句示徒云嘗道出門逢彌勒入門見釋迦曰與麼道又爭得僧便問和尚又如何曰出門逢阿誰入門見什麼僧於言下有省師拈云這僧雖然有省只會得龍濟底未會得翠巖底若會得翠巖底許你全具眼舉石頭和尚問僧從甚麼處來僧云江西來云見馬大師麼云見頭乃指一橛柴云馬師何似這箇僧無對卻回舉似馬大師馬云汝見橛柴大小云沒量大馬云汝甚有力僧云何也馬云汝從南嶽負一橛柴來豈不是有力師拈云深見古人千里同風在一箇鼻孔裏出氣何曾分疆立界魔魅人家男女這僧當時是箇漢子待石頭道何似這箇輕輕對道不別即禮謝可不減師之德乎適回馬大師處舉似及道汝見橛柴大小何不道某甲見非兩端恁麼則不負師恩亦不孤他人指點然雖如是二大老如按牛頭吃草相似可惜慈悲太切舉洞山示衆云兄弟初秋夏末東去西去直須向萬里無寸草處去始得又云只如萬里無寸草處作麼生去後有僧舉似石霜霜云出門便是草磬山則不然兄弟夏末秋初南行北往直須腳踏實地去始得若不如斯未出門時亦是草漫漫不見妙喜道師子一滴乳迸散十斛驢乳舉僧問石霜咫尺之間為甚不睹師顏霜云我道遍界不曾藏僧後問雪峰遍界不曾藏意旨如何峰云甚麼處不是石霜僧回舉似石霜霜云這老漢著甚麼死急師拈云古人一期方便秖欲求人不覺拖泥帶水當時磬山若作石霜待伊道咫尺之間不睹師顏何不攔頭一拄杖教伊性快去豈容流到雪峰枝上生枝蔓上引蔓還曾悟也未不見玄沙云山頭老漢蹉過也舉僧訪翠巖值不在遂看主事主云參見和尚也未云未主指狗子云上人要見和尚但禮拜這狗子僧無語後翠巖歸聞得乃云作麼生免得與麼無語雲門云欲觀其師先觀弟子師拈云這僧非惟不曾見翠巖要且不曾相見主事可惜淺水無魚徒勞下釣當時若作這僧待院主指拜這狗子遂高聲云若不識和尚洎合錯禮這狗子拂袖便行雖然如是今日或有主事者出來道和尚莫教壞人家男女只對他道這狗子聻舉僧問趙州如何是趙州州云東門西門南門北門師拈云這僧覿面相呈致箇問頭也甚奇怪若道未會爭敢入虎窟裏捋虎鬚若道會爭肯恁麼休去當時趙州有定乾坤手段爍破四天下眼目還他本分鉗鎚教他入又入不得出又出不得可謂雙奪雙收到此還有人轉得身吐得氣入得趙州門出得趙州門者麼試道看舉真歇了禪師問僧云你死後燒作灰撒卻了向甚麼處去僧便喝真云好一喝祇是不得翻款僧又喝真云公案未圓更喝始得僧無語師云可惜當時這僧無末後句若有末後句也不奈伊何真老雖是洞上兒孫宛有濟翁門下作略我當時若作此僧何不道喝則不無恐和尚作喝會待伊打云這死漢便喝拂袖而出舉雪峰示衆云南山有一條鱉鼻蛇汝等諸人切須好看長慶云今日堂中大有人喪身失命僧舉似玄沙沙云須是稜兄始得雖然如此我即不恁麼僧云和尚作麼生玄沙云用南山作麼雲門以拄杖攛向向雪峰面前作怕勢師拈云雪峰老漢恁麼示衆拈一句語如握太阿劍擊塗毒鼓聞之擬之咸皆喪身失命誰敢當鋒到這裏還容得情識卜度麼恁麼也不得不恁麼也不得恁麼不恁麼總不得當時若非二三大老卓犖超群廓徹圓明知見唱和宗乘敷揚要旨則孤負雪老這一條活蛇弄殺在象骨巖前誰能知他落處所以道打鼓弄琵琶相逢兩作家電光影裏穿針未為快手若是這般事須是這般人始得若非這般人如何搆得這般事山僧今日且不將拄杖粧龍作蛇亦無玄沙語句鉤引但只恁麼與衆同食同衣同坐同臥不出尋常大衆還見麼格外不須重審問尋常一句作麼生舉龐居士辭藥山山命十禪客相送至門首居士指空中雪云好雪片片不落別處時有全禪客云落在什麼處士打一掌全云居士也不得草草士云汝恁麼稱禪客閻老子未放你在全云居士作麼生士又打一掌云眼見如盲口說如啞雪竇別云初問處但握雪團便打師拈云老龐參證於馬祖石頭二大老已得心空及第到處遇人不妨作家相見著著自有出身之路所以全禪客不奈伊何當時若作全禪客待伊道好雪片片不落別處遂接住云不落別處且置你道在什麼處來待依擬口還他一掌教這老漢別有生涯難行此令雖然且道山僧這一掌與老龐打同也異也與雪竇打同也異也試說看舉羅山和尚問石霜起滅不停時如何霜云直須寒灰枯木去一念萬年去函蓋相應去全清絶點去山不契卻往巖頭處如前問巖頭喝云是誰起滅山於此有省師拈云今時人論道石霜說道理所以令羅山不悟巖頭不說道理令他悟去恁麼商量如掉棒打月料掉沒交涉殊不知當時這僧若不得石霜老漢雪上加霜逼拶將來那能巖頭處領略得去縱然會得巖頭老人底若未曾體究得石霜和尚底爭解脫得起滅不停時也所以道靈光獨耀迥脫根塵體露真常不拘文字心性無染本自圓成但離妄緣即如如佛若不如是敢保你認賊為子在今時人還會得二大老異口同音麼良久云一片白雲橫谷口幾多歸鳥盡迷巢舉雲巖掃地次道吾云太區區生巖云須知有不區區者吾云恁麼則有第二月也巖豎起掃帚云這是第幾月吾便休師拈云可見古人日用事無別才被人拶著便乃覿面相呈了無餘事雲巖道吾雖同出其門到這裏也不肯放過要且得人一牛還人一馬雖然如斯若作道吾待雲巖豎起掃帚云這是第幾月但云恰似管教他這把掃帚無地放在舉天平和尚行腳時參西院嘗云莫道會佛法覓箇舉話人也無一日西院遙見召曰從漪平舉頭院云錯平行三兩步院又云錯平近前院云適來這兩錯是西院錯是上座錯平云從漪錯院云錯平休去師拈云衲僧行腳切不得草草才有些些省處便開大口須要自己揣摩十二時中還曾穩當不心境一如不腳踏實地不如紅爐飛片雪不可見天平行腳時自滿道會禪傍若無人驀然撞著西院一拶下兩箇錯字便把一肚子禪道一點也用不著當時若作天平待西院道適來這兩錯是西院錯上座錯何不高聲還他道箇錯管教西院自然不作故眼相看直到後來住院謂衆云我當初行腳時被業風吹到思明長老處連下兩錯更留我過夏待共我商量我不道恁麼時錯我發足向南方去時早知道錯了也看他恁麼示衆正所謂行年五十而知四十九年之非雖然如是也是貧兒思舊債磬山今日亦下箇錯且道這個錯與西院同耶別耶與天平同耶別耶諸人試辨看有麼有麼復云錯舉雲門大師云光不透脫有兩般病一切處不明面前有物是一透得一切法空隱隱地有箇物相似亦是光不透脫又法身亦有兩般病得到法身為法執不忘己見猶存墮在法身邊是一直饒透得放過即不可子細簡點將來有什麼氣息亦是病師拈云病多諳藥性得瘥始傳方雲門大師曾在乾峰和尚處患過這病來已透脫得所以要醫大地衆生箇箇透脫去雖則慈悲之故也是好肉剜瘡不見淨名云彼自無瘡勿傷之也雖然如是諸人還曾打過這病也未若未打過不妨雲門葛藤裏透脫去所以道過得荊棘林才是好手腳直饒透過這病露出這光為甚麼雲門道仔細簡點將來亦是病到這田地須知有向上一著在若不知向上一著有甚麼氣息亦是病珍重舉魯祖凡見僧來便面壁南泉聞云我尋常向他道空劫已前承當佛未出世時會取尚不得一箇半箇他恁麼驢年去師拈云古今多少尊宿未免向魯祖釣竿頭土插嘴起模畫樣或抑或揚或提或唱何曾摸索得魯祖腳跟麼殊不知魯祖恁麼接人亦是曲垂方便若有箇性燥底向他未面壁時一覷覷破還他這老漢不坐在含元殿裏相見即今還有人知他落處麼少林壁觀無多旨不是神光也大難舉風穴在郢州衙內上堂云祖師心印狀似鐵牛之機去即印住住即印破只如不去不住印即是不印即是時有盧陂長老出問云某甲有鐵牛之機請師不搭印穴云慣釣鯨鯢澄巨浸卻嗟蛙踄𩥇泥沙陂佇思穴喝云長老何不進語陂擬議穴打一拂子云還記得話頭麼試舉看陂擬開口穴又打一拂子牧主云佛法與王法一般穴云見箇甚麼牧云當斷不斷反招其亂穴便下座師拈云決戰者不顧其首盧陂也是一員猛將敢向前來奪令施行爭奈風穴久戰作家陳勢排定到此無門可入無路可出逼拶得來前不搆村後不迭店若非披三玄戈甲七事隨身孰能如是作略乎雖然恁麼當時不得牧主怎生收煞可謂見機而作今或有人出來云牧主道當斷不斷反招其亂在風穴也在盧陂也山僧劈脊便棒也怪豫不得舉雪竇禪師在莊數僧立次雪問維摩云步步是道場這裏何似山裏衆下語皆不契自代云只恐和尚不肯師拈云磬山當時若在會直教這老漢舉足無立地處道什麼肯不肯這裏是什麼所在咦舉佛眼禪師一日垂示從東過西顧衆云是是復從西過東顧衆云不是不是遂歸位立云適來猶記得師拈云這老漢看他自起自倒可惜當時衆中無人作禮三拜舉佛眼禪師遊蓮華峰至半山亭有僧後到云和尚還在這裏眼云我到了來也僧無語自代云也是齊後鐘師拈云磬山當時若作這僧敢教佛眼老漢立地待他道我到了來也但云和尚且住待某亦到來
