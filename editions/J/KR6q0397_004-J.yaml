body:
  text: 嗣法門人通問等編荊溪磬山語錄之二示眾師云截徑一路見在目前正道玄微意超言外物物就手事理藏鋒諸人還知落處麼不見當時汾陽老人採菊謂眾曰金花布地玉蕊承天杲日當空乾坤朗耀雲騰致雨露結為霜不傷物義道將一句來還有道得底麼若道不得眼中有屑直須出卻始得師云其時不肖遠孫若在但云覓火和煙得擔泉帶月歸他道風穴云若立一塵國家興盛野老嚬蹙不立一塵國家喪亡野老安貼於此明去闍黎無分全是老僧師云縱奪由你不得壓良為賤爭奈賓中有主於此不明老僧即是闍黎師云殺活聽憑且不得自起自倒爭奈主中有賓闍黎與老僧亦能悟卻天下人亦能瞎卻天下人師云全放由你也不得作憨爭奈賓中賓在要知闍黎與老僧麼拊其兩膝曰這裏是闍黎這裏是老僧師云全收由你切不得教壞人家男女爭奈主中主在且問諸上座老僧與闍黎是同是別若道是同去上座自上座老僧自老僧若道是別去又道老僧即是闍黎師云分亦憑你不分亦憑你驀拈拄杖云只是不得忘卻這箇諸人又作麼生會若能於此明得去一句中有三玄三要賓主歷然平生事辦參尋事畢師云諸人還識得這一句麼卓拄杖喝一喝云諸人還見徹三玄麼以拄杖點空心喝云諸人還要會三要麼以拄杖於空畫喝云所以永嘉大師道粉骨碎身未足酬一句了然超百億老僧舉到這裏一件要緊事不得與諸人再打葛藤左右顧視云看看汾陽老人來也不待作禮速歸方丈示眾舉楚石禪師上堂通身是眼為什麼覷不見通身是耳為什麼聽不聞通身是口為什麼說不到通身是心為什麼鑒不出報恩有道聰明神咒布施諸人去也師云且道通身既然是眼那裏得見耳來通身既然是耳那裏得見口來通身既然是心那裏得見眼耳身口來諸人到這裏須自簡點看磬山說得是報恩即不是報恩說得是磬山即不是雖然直饒你覷得聽得說得鑒得已落第二頭了也復云參除夜小參僧問昨日萬山松今朝千嶺雪一色本同真俄爾成差別如何不是差別法師云當爐不避火僧云古人烹露地牛與眾分歲今日磬山以何分歲師云舉意便知有僧禮拜云恁麼則謝恩無盡師便喝僧拂袖歸眾又僧問燈燈續燄祖祖聯芳濟上一宗至今猶在未審阿誰分中事師高聲云道甚麼僧便喝師便打僧又喝師亦喝僧禮拜歸眾師乃云老漢居山三十年未曾輕舉到人間只因諸子尋蹤跡不肯糢糊放過關大眾今夜大盡佛法無剩祖印全提要行正令若向壁立萬仞處腦後一槌百尺竿頭時腳跟下鏟適纔二上座不顧危亡得失抑揚酬唱諸人還知麼若也未知不可影影逴逴依依稀稀多知多見埋沒自己一段大事老僧說到這裏忽記得雲門大師道盡乾坤大地無有纖毫過患只為轉物不見一法猶是半提若到這裏更須知有全提時節且道那箇是全提時節不見臨濟大師道大凡演唱宗乘一句中須具三玄門一玄門須具三要有權有實有照有用今時有等杜撰長老以玄為權以要為實定言前為照後為用咄你還曾夢見我臨濟大師汗臭氣麼他明明向你道有時先照後用有時先用後照有時照用同時有時照用不同時先照後用有人在先用後照有法在照用同時驅耕夫之牛奪饑人之食敲骨打髓痛下針錐照用不同時有問有答立主立賓合水和泥應機接物若是過量人向未舉時撩起便行猶較些子所以汾陽老人云三玄三要事難分得意忘言道易親一句明明該萬象重陽九日菊花新此頌正治這般病所謂醍醐上味為世所珍遇此等人翻成毒藥諸人還知落處麼若知落處便知磬山落處若知磬山落處便知古人落處若識得古人落處便知杜撰錯處老僧今晚有箇頌子白拈手段在當場不是英靈孰敢當裂石崩崖休側耳奔雷掣電豈容商小根魔子何堪諭無智狂徒益轉茫今日老人親說破從教千古不磨揚喝一喝且道依時及節一句又作麼生道良久云殘燈小案臘方盡爆竹一聲春已回卓拄杖云珍重歲旦示眾林皋問玉綻梅花分幾樹和風陣陣送香來新年頭佛法即不問如何是三寶堂前祝聖底句師云天長地久進云恁麼則垂衣王化裏打鼓樂昇平師云誰是知音者進云官不容針私通車馬時如何師云試道看進云白毫宛轉交光相青髻盤螺滿月輝如何是佛師以拂子打圓相進云玉軸未分三獸別金函纔展大車歸如何是法師據座而坐進云七尺單前知默坐一瓢方外任閒遊如何是僧師云且過一邊著進云三寶已蒙師指示宗乘的旨是何宣師以腳踢云一腳踢過進云旃檀林內曾遊戲踏轉崑崙作象騎如何是向上為人句師云日月齊明進云歸猿攀得枝頭月去鳥衝開石上雲師云少賣弄僧禮拜歸眾師祝云皇圖永固帝道遐昌佛日增輝法輪常轉作麼生是轉法輪底句適纔這些問答你道還報得皇恩佛恩也無知麼喝一喝不見臨濟大師道我有時奪人不奪境有時奪境不奪人有時人境俱奪有時人境俱不奪且道老僧這一喝是奪人耶奪境耶是人境俱奪耶人境俱不奪耶若道奪人人人鼻孔撩天若道奪境物物融通亨泰若道人境俱奪爭奈滿面春風若道人境俱不奪老僧且拈向一邊如何是奪人奪人則不問如何是奪境奪境則不問如何是人境俱奪人境俱奪則不問且道人境不奪一句作麼生道良久以拂子作書勢云歲朝把筆百事大吉以拂子拋向後便出法堂示眾舉泰首座到洞山值吃果子洞山云有一物上拄天下拄地黑律漆常在動用中動用中收不得未審過在什麼處泰云過在動用中洞山令人掇退果桌佛果圓悟云天下衲僧盡道泰首座箭鋒不相拄所以遭洞山貶剝後來溈山真如道此果子莫道泰首座不得喫三世諸佛也不敢正眼覷著宗師家正令當行十方坐斷有定乾坤句辨龍蛇眼不妨難趁當時若是英靈衲子解捋虎鬚待他道過在什麼處便拈起果子云和尚畢竟喚作甚麼待他擬議劈面便擲師云二大老一人雖扶弱且未得果子喫在一人雖太甚而有過人之志亦未得果子喫磬山則不然待洞山道過在什麼處但云有過無過且置隨聲拈起云和尚先得了也便喫可不有意氣時添意氣不風流處也風流示眾舉琅琊和尚問舉和尚近離甚處舉云兩浙船來陸來云船來船在什麼處云步下不涉程途一句作麼生道舉以坐具摵一摵云杜撰長老如麻似粟便拂袖而出瑯琊問侍者此是甚麼人云舉上座琅琊遂親下旦過堂問莫是舉上座麼莫怪適來相觸忤舉便喝復問長老何時到汾陽琊云某時到舉云我在浙江早聞你名元來見解只如此何得名播寰宇琅琊遂作禮云慧覺罪過師云大眾凡看古今公案先須得句而後知義義句昭然意趣深解若脫略言句其義不全得失難辨其間擒縱殺活抑揚收放何從而得之也老僧閱古尊宿集舉和尚錄中刪去以坐具摵一摵慧覺罪過句豈非集者自失一隻眼也且妙喜分明道賓則始終賓主則始終主二大士驀劄相逢主賓互換直下發明臨濟心髓苟非徹證向上巴鼻具出常情正眼未免作得失論量今日眾中莫有為琅琊出氣者麼眾無語師遂高聲唱頌云虎踞龍蟠展大機當陽著著不思議就中各顯藏鋒句惹得時人取次疑示眾舉玄沙云諸方老宿盡道接物利生或遇三種病人來作麼生接患盲者拈槌豎拂他又不見患聾者語言三昧他又不聞患啞者教伊說又說不得且作麼生接若接此人不得佛法無靈驗有僧請益雲門門云你禮拜著僧禮拜起門以拄杖挃僧退後門云你不是患盲復喚近前僧近前門云你不是患聾乃豎起拄杖云還會麼僧云不會門云你不是患啞其僧於此悟去師拈云玄沙老人可謂善說未能善接雲門大師如此接人也只接得無三種病底漢果實有三種病人來又如何接若到磬山門下來也不難何故如患盲者來高聲向他道個瞎若患聾者來劈脊便棒若患啞者來便以拂子打圓相示之今日還有三種病底麼良久云如無老僧今日失利示眾拈拄杖云老僧有時拈拄杖子不作拄杖子用有時拈拄杖子作拄杖子用老僧有時以拄杖子行遍四天下擲向壁角落裏有時老僧丟下拄杖子獨自打頓去也諸人這裏見得便乃會得我臨濟大師底賓中主主中賓賓中賓主中主雖然切不得動著動著一字打你頭破腦裂莫言不道卓拄杖便歸方丈望日示眾師云剛纔過初一又是月半了也諸人作麼生會若也會得出來與老僧通箇消息眾無語師逐出堂左右顧云天晴日頭出示眾垂鉤四海只釣獰龍獨步大方為尋知己賓中有主豈肯倚戶傍門主中有賓不用撒沙撒土賓主互換縱奪交馳各各有坐斷之機著著有出身之路誰是恁麼人行恁麼事大眾看舉慈明和尚見泉大道來乃云片雲橫谷口道人何處來泉左右顧視云夜來何處火燒出古人墳明云未在更道泉作虎聲明以坐具一摵泉接住推明向禪床明卻作虎聲泉大笑云我見七十餘員善知識今日始遇作家師云你看他二大老驀劄相逢正所謂獅子遊行象王踞地全機出沒大用現前諸人還識得麼若也識得不假如之若何便請單刀直入其或未然盲龜跛鱉豈堪克紹老僧更有箇頌子諸人聽取二虎爭雄猛作威爪牙全露震崔嵬同音哮吼驚群獸千古傳聞似怒雷休眨眼電光回濟下兒孫烜赫兮不是等閒相共語漫將狐兔亂真規示眾舉巴陵云祖師道不是風動不是旛動既不是風旛向甚麼處著有人與祖師作主出來與巴陵相見雪竇云風動旛動既是風旛向什麼處著有人與巴陵作主出來與雪竇相見師拈云雪竇老漢也是依樣畫貓兒今日有人出來為伊作主山僧放伊三十棒佛誕日示眾師云今朝四月八處處叢林浴悉達人人盡道報佛恩惟是磬山心未洽試問諸人報恩一句作麼生道一僧出云橫按莫邪全正令太平寰宇斬癡頑師云也則道得一半進云請和尚全道師云一人有慶兆民賴之僧禮拜云謝和尚答話師云乾坤著眼看幾箇知恩者復舉隨州關子嶺無聞聰禪師有僧問云今朝四月八天下叢林皆慶佛誕未審如來何處降生聞於几上畫個圓相僧無語笑巖和尚代僧作禮云盡界普瞻師云今日有人問著老僧如來何處降生則向伊道休瞌睡復頌云古佛重興關子嶺拈花旨趣笑巖酬磬山今日無思算兀坐雲深白了頭示眾舉歸宗文禪師上堂云日往月來大盡小盡生死漸近大眾總是祖師門下客須知生死不相關且道歸宗與麼說話還有過也無良久云父母不聽不得出家師云這老漢前言不應後語既是祖師門下客又道箇父母不聽不得出家且作麼生會若道歸宗說得是磬山即不是又落在歸宗手裏若道磬山說得是歸宗即不是又落在磬山手裏諸人又如何透過復云且作麼生是諸人底父母試道看眾無語師云老僧與諸人頌出自家父母自家知認得分明不是伊暑往寒來經幾劫灼然寸步不曾離了知生死不相關擬議之間面隔山若是祖師門下客橫吹鐵笛汨羅灣示眾師云今朝四月半農家秧好看堪笑懶禪和一事無可斷開了兩片皮只是粥飯罐道眼不能明閻羅要打筭示眾舉玄沙禪師一日集眾將拄杖一時趁下卻回向侍者道我今日作得一解險入地獄如箭射者曰喜得和尚再復人身翠巖芝云大小玄沙前不搆村後不至店且作麼生道得出身之路道吾真云大小芝老只是偏枯若是道吾即不然玄沙侍者一人具一隻眼雲居舜云此語眾中舉得爛如泥且作麼生曾山僧道侍者不在言也玄沙也是荊棘裏求栴檀東禪觀云大小玄沙性命在侍者手裏師云觀此四大老批判有稱強處有扶弱處有評論處有見的處若有人簡點得出許他具雙眼圓明其或未然切忌作得失論量若作得失論量入地獄如箭射晚參師一日驀地入堂一喝眾駭然無語師周匝四顧而出次晚集眾云老僧昨晚立在萬仞崖頭命如懸絲為接汝等老僧今晚用婆婆禪亦要接汝等復喝一喝云且道今日這一喝與昨日這一喝是同耶是異耶不同耶不異耶汝等若會得出眾向前道來看老僧為你證據一僧出纔禮拜師劈脊便棒僧起師震聲云速道速道僧擬議師復打僧退步師卓拄杖云瞎漢乃云不見臨濟大師道我有時一喝如金剛王寶劍有時一喝如踞地師子有時一喝如探竿影草有時一喝不作一喝用師喝一喝云且道這一喝是金剛王寶劍耶是踞地師子耶是探竿影草耶是一喝不作一喝用聻若會得方作得我臨濟門下兒孫若會不得切忌亂統以拄杖旋風打散示眾師云北山人喫飯南山人種田不知具何義蓑笠笑煙巒風雨共施設雲月漫相瞻更有一般奇特事嘯殺峰頭野老猿示眾舉宗門有四種藏鋒初曰就理次曰就事至於理事俱藏則曰入就俱不涉理事則曰出就師云就理就事理事俱就則謂之藏可也理事俱不涉謂之藏未可也且道這一藏如何著得語諸人試道看眾無語師自代云三腳蝦蟆飛上天復示頌云氣吞佛祖定乾坤出就藏鋒斷命根昨夜泥牛曾哮吼今朝絕跡到荒村示眾師云今朝五月五騎卻艾虎街頭舞驀然撞著桃符神打落鍾馗手中小鬼鼓笑殺傍觀一箇人喫了菖蒲雄黃燒酒沿街吐且道磬山清眾又如何諸人試道一句看山茨進云穿衣喫飯隨時過嘯月吟風只自知箬庵進云寒衣送卻知時節蛇鬼潛形避莫邪師云一箇隨時意賞一箇諳節言行老僧亦有一句子無錢買粽子剛把貧來訴示眾舉馬祖令人馳書併醬三甕送與百丈丈令排向法堂前乃上堂眾纔集百丈以拄杖指醬甕云道得即不打破道不得即打破眾無語百丈便打破歸方丈師云老僧當時若在眾中管取大眾沾恩亦不使百丈失利待他道道得即不打破道不得即打破但出眾抗聲云喚典座來快抬將去雖然也作死馬醫也老僧更為諸人頌出堪嗟一眾是疑團打破從教仔細看若得磬山當座下林間貼貼地相安朔日師禮佛後登法堂大眾作禮畢師云磬山阿裏有兩箇小老虎昨日老僧被他截住卻在三家村裏躲過你們出出入入切須仔細隨顧左右云且喜不露爪牙便歸方丈示眾師云今時有一等不識好惡口稱為臨濟門下兒孫妄判先宗以死殺法定要把冬瓜印子印人不知我從上臨濟嫡脈作略奪饑人之食驅耕夫之牛何曾有實法繫累人耶不見廓侍者臨華嚴和尚上堂云大眾今日若是臨濟德山高亭大愚鳥窠船子兒孫不用如何若何便請單刀直入華嚴與汝證據廓出眾禮拜起便喝嚴亦喝廓又喝嚴亦喝廓禮拜起云大眾看這老漢一場敗闕又喝一喝拍手歸眾嚴下座歸方丈時風穴作維那上去問訊嚴云維那汝來也叵耐守廓適來把老僧扭捏一上待集眾打一頓趁出穴云趁他遲了也自是和尚言過他是臨濟下兒孫本分恁麼嚴方息怒穴下來舉似廓廓云你著甚來由勸這漢我未問前早要棒喫得我話行如今不打搭卻我這話也穴云雖然如是已遍天下也師云汝等還會得麼若會得便知我臨濟兒孫作略若不會老僧與諸人頌出頌云賓則賓兮主則主兩陣交鋒貴無住賓家作主主家賓卻被傍人冷眼覷咄咄咄臨濟兒孫真箇毒言中有響破重圍千古萬古遺相侷示眾舉古人道幽鳥語如簧柳垂金線長煙收山谷靜風送杏花香永日瀟然坐澄心萬慮忘欲言言不及林下好商量師云既言之不及又商量箇什麼若道有商量古人恁麼道若道無商量古人恁麼道諸人且作麼生良久云薰風自南來殿角生微涼示眾舉鄧峰永庵主問僧審奇云汝久不見何所為師著語云探竿影草奇云近見偉藏主有箇安樂處永云試舉似我奇因敘其所得著語云露永云汝是偉未是著語云明賞暗罰翻其窠臼奇莫測歸語偉著語云傳言送語漢偉大笑云汝非永不非也著語云面赤不如語直奇走質于積翠南禪師南亦大笑著語云君子千里同風永聞作偈云明暗相參殺活機大人境界普賢知同條生不同條死笑倒庵中老古錐覺範洪禪師云觀其語言想見當時法喜游戲之逸韻使永公施於今則其取詬辱必矣著語云範老可謂知言矣復云老僧觀諸大老如播弄摩尼珠各各見其本色光明透露爭奈奇公即珠何能得睹本色耶老僧已為諸人註破眾中還有不了者麼良久云更聽老僧一頌偉哉永哉說是說非兩口一舌就高作低積翠重巖走殺伊笑中何似刃相持復顧山茨云你還為這僧代得一轉語麼茨云請和尚問師云汝久不見何所為云只向道菴主那裏瞌睡來師云他便掌是如何云震聲一喝師云喝後如何云大地平沉師云也只道得一半云和尚又如何師云干戈永息茨禮拜一日因眾議論德山托缽因緣師乃云且住諸人還知趙州當時問南泉離四句絕百非請師道泉便歸方丈州云者老漢尋常口吧吧地不消一問諸人若識得南泉歸方丈便識得德山低頭處復喝云諸人會則便會傍家走甚麼瞎漢一時以拄杖趁散示眾舉雲門大師纔上堂云雪上加霜便下座師云你看這老漢通身是口只是不識身子藏在什麼處諸人下一轉語與雲門老人相見麼良久頌云韶陽領眾不辭勞金屑明明著眼稍到得文場擬題目手中失卻筆頭刀中秋月下示眾師云諸方叢叢簇簇這裏清清淡淡若向清清淡淡中會得便入叢叢簇簇不妨若向叢叢簇簇處會得直到清清淡淡始得只如不清清不淡淡不叢叢不簇簇又作麼生良久云天上一輪玉清光何處無復云諸行者人人真心獨朗比如秋月圓明迺因雲霧氤氳不得光明透露如人根塵相對便有三六一十八界纏縛不得自由何謂三六一十八界所謂六根六塵六識如眼耳鼻舌身意謂之六根色聲香味觸法謂之六塵既有六根六塵中間發起六識所謂眼識耳識鼻識舌識身識意識也眼與色對便有青黃赤白長短男女等相而起好惡心光不能透脫耳與聲對便有宮商清濁音韻言辭而起好惡心光不能透脫鼻與香對便有薰蕕穢馥腥羶等而起好惡心光不能透脫舌能嘗味便有甘肥鮮美酸鹹甜淡等而起好惡心光不能透脫身能覺觸便有軟煖細滑輕重等而起好惡心光不能透脫此五根所對謂之外塵惟意識分別思慮取捨謂之內塵所以內外相應起惑造業無暫停息如蠶作繭自縛自纏無有解脫之期諸行者若要了脫生死須是自家發起勇猛心參究勘破這一十八界本來空空蕩蕩無有一毫遮障處如今夜之月圓滿明徹若到這田地纔不徒入空門雖然更須知古人道心月孤圓光吞萬象光非照境境亦非存光境雙忘復是何物諸人又作麼生會不可虛度光陰百年易過歲不久留努力努力示眾舉灌谿參末山尼了然禪師山問上座今日離何處谿云路口山云何不蓋卻谿無語師代云當時老僧若作灌谿但云官塘大道谿時禮拜問如何是末山山云不露頂問如何是末山主山云非男女相谿乃喝云何不變去山云不是神不是鬼變箇甚麼師別云老僧若作末山亦與一喝道箇不是神不是鬼變箇甚麼令人不暢快谿無語作園頭三載師代云恁麼非男女相聻如此見得免復勞矣雖然如是可見古人腰包行腳為此大事不著人我相一言透不過甘自執務參究今人能如是乎然且衲僧氣概則不然男兒自有沖天志不向古人行處行示眾師云古人道得到寶山須採寶莫教空去再來難諸人且道寶山在什麼處莫是南天台北五臺耶莫是東洛伽西峨眉耶乃至今住磬山是耶老僧敢道未是在諸人作麼生會良久云不見道乾坤之內宇宙之間中有一寶秘在形山諸人採寶也未休教空去虛度光陰一僧云是寶非但和尚獨有人人皆有師即踏下一步云這是形山如何是寶僧云用得出便是師又踏下一步作聽勢云汝作麼生用僧亦退一步擬進語師便掌僧喝師抗聲云侍者將拄杖子來痛打一頓僧擬議師以袖驀面撲遂歸方丈示眾舉馬大師令智藏持書上徑山山接書開見一圓相於中下一點國師聞舉云欽師猶被馬師惑雪竇云徑山被惑且置若將呈似國師別作箇甚麼伎倆免被惑去有老宿云當時坐卻便休亦有道但與劃破若與麼只是不識羞敢謂天下老師各具金剛眼睛廣作神通變化還免得麼雪竇見處也要諸人共知只這馬師當時畫出早是自惑了也師云灼然宗師手段切須為人解黏去縛拔楔抽釘你看當時雪竇老人恁麼拈提公案作家宗師天然有在今時有等晚輩齷齷齪齪拈箇圓相出來示人未免傷鋒犯手不見雪竇道若與麼只是不識羞而今更不識羞在亂道圓相七佛之始既為七佛之始誰人畫出又道七佛各有言詮咄你還知釋迦老子當時對文殊師利云你道我四十九年曾說一字來否蓋為你不達源頭動著便成窠臼山僧也是路見不平要諸人與古人相見纔識得他漏逗處不入他圈繢去也不然一犬吠虛千猱啀實諸人還知麼玉女已歸霄漢去獃郎猶坐火爐邊極庵居士設齋請示眾問答不錄師卓拄杖云於此會得不涉程途其或未然且聽山僧葛藤了也復云凡夫謂之有二乘謂之無菩薩當體即空爾我衲僧家要行便行要止便止眾中有道得一句不涉多途者合受人天供養不見古人云供養百千諸佛不如供養一無心道人諸人且道無那箇心無是非心耶無善惡心耶無忻上而猒下心耶無一切心耶若恁麼會到磬山無吃棒分在今日雲陽賀居士設齋要老僧通箇消息一則與大眾結箇般若緣二則冀禧二子行金行玉老僧說到這裏又無法可說且看拄杖子頭上端坐大悲觀世音說道應以居士身得度者即現居士身而為說法應以童男童女身得度者即現童男童女身而為說法且道說什麼法偈云雲陽賀氏世植福從來代代受天祿今日當齋供佛僧祈保二子如金玉大眾珍重除夕小參師云自從拈得這烏藤踏遍清涼返故岑今住磬山十餘載未曾打著箇中人有麼有麼不見臨濟大師道我有時先照後用有時先用後照有時照用同時有時照用不同時師驀地一喝和聲打一拄杖云且道這是先照後用耶是先用後照耶是照用同時耶是照用不同時耶眾無語師云且放過一著大眾你道如何是箇中人莫是深山窮谷雲耕雨種草衣木食者是麼莫是千里迢迢四海參尋撥草瞻風者是麼莫是昭昭靈靈認著見聞覺知觸著動著者是麼莫是靜悄悄地終日蒲團細念纔生即便遏捺者是麼莫是錦繡叢中柳巷花街披一片掛一片以瓢乞食者是麼莫是寶華王座萬指圍繞嘴漉漉地說長道短者是麼若恁麼摶量老僧拄杖子未肯點頭在良久云年窮時盡且與你們商量古人道欲識佛性義當觀時節因緣時節若至其理自彰若喚作時節會則辜負老僧拄杖子若不喚作時節會又埋沒諸人自己大眾且道如何是其理自彰底句卓拄杖云一聲爆竹度殘年幾點梅花放春谷元旦示眾師云古人道今日新年頭昨日舊年尾識得本來人無憂亦無喜且道既是本來人要識得作麼諸人試道看眾無語師自代云眉橫鼻豎示眾舉趙州行腳時到一鄉院經旬日臨去辭院主主云何往州云臺山禮文殊去主云某甲有頌相送頌云何處青山不道場遙須策杖禮清涼雲中縱有金毛現正眼觀時非吉祥州乃問作麼生是正眼主無語師云可惜好箇頌子當時院主恰是畫龍底及至見了真龍現時舉手無措矣若是山僧作院主待老趙州道作麼生是正眼便云你還要第二杓惡水潑麼瑯琊覺道箇啼得血流無用處也是扶強不扶弱諸人試簡點看禹門院清明掃塔示眾遠近歸來拜祖庭法門大事緊須惺嚴持戒律心無垢把本窮玄道易親休順妄緣趣物外寧安寂靜樂身貧但依遺訓能開悟他日傳燈亦贅名四月八日師病起小參僧問當初四月八降生悉達未審今日降生箇什麼人師以拄杖豎起僧云世尊說法寶塔從地湧出和尚說法以何為證師卓拄杖一下僧云如何是全提正令師便喝僧云如何是獨振宗風師展兩足示之僧云不問第一第二第三玄如何是玄要奧旨師以拄杖橫按呵呵大笑僧云古今四月八是同耶不同耶師云提起坐具看問諸佛不入法界眾生不出法界未審釋迦老子從何處降生師以拄杖點地云從這裏生僧云忽遇雲門大師來時如何師云且教站過一邊僧禮拜師云何不再問僧云留與第二位師乃云病骨羸形氣力衰奈緣諸子又歸來強扶竹杖行庭際指點虛空道眼開以拄杖指云這是虛空那裏是道眼卓拄杖云這是道眼那裏是虛空若人單明虛空不開道眼如人有體而無足若人單明道眼不悟虛空如人有足而無體且問大眾超出虛空道眼一句作麼生道所以道淨法界身本無出沒大悲願力示現受生驀舉拄杖云釋迦老子在山僧拄杖頭上一手指天一手指地道天上天下唯吾獨尊當時有箇跛足阿師道我若見一棒打殺料與狗子吃貴圖天下太平這裏簡點將來也是無佛處稱尊據磬山則不然將此身心奉塵剎是則名為報佛恩遂擲拄杖趣殿禮佛休夏小參師云古風不墜全憑衲子扶持正眼圓明何勞知識煆煉山僧卑志隱跡巖房豈料諸仁者不遠千里而來共守寂寥同甘淡薄拋卻拄杖脫落草鞋放下蒲團諸緣坐斷直須盡底掀翻廓徹本來面目不見當時馬大師問藥山云汝在這裏多時本分事作麼生山云皮膚脫落盡唯有一真實祖云子之見處可謂協于心體布于四肢何不將三條篾束取肚皮隨處住山去山云某甲何人敢言住山祖云未有常行而不住未有常住而不行欲益無所益欲為無所為宜作舟航由是住山師云大眾你看古人到這田地猶不肯自就須知此事切不得草草若到得這田地不妨隨緣去住若不到這田地終是倚草附木有什麼用處更有一偈不學諸方料嘴禪奮然努力究心源頂門豁達通天眼方始迴流駕鐵船雖然如是這猶是功勳邊事且道不涉程途一句作麼生道卓拄杖云薰風自南來殿角生微涼示眾舉僧問佛果和尚如何是主中賓果云闍黎問處帶纖塵如何是賓中主果云山僧不免自道取如何是主中主果云坐斷舌頭無去取如何是賓中賓果云青山之外更愁人師云這僧既問主中賓何故佛果答他道闍黎問處帶纖塵此豈不是賓中句也問賓中主何故答他道山僧不免自道取此豈不是主中句也此二轉語若透得過便會得主賓互換之機答在問處方做得我臨濟門下兒孫識得佛果老人作略不同諸家答處老僧也要大家知今日拈出設若有人問老僧如何是主中賓信手拈來不是塵如何是賓中主撥草瞻風為誰爾如何是主中主茅堂獨坐無餘事如何是賓中賓走盡千山路不窮且道與古人是同是別端午小參僧問時逢端午百毒皆藏未審磬山塗毒鼓藏向什麼處師云還聞麼僧云為甚麼猶有聞而不死者師便喝僧云還有賓主也無師以拄杖畫一畫云這裏看僧云如何是賓中主師以柱杖點云下是誰僧云如何是主中賓師卓拄杖一下僧云如何是賓中賓師云腳下帶泥深僧云如何是主中主師收拄杖橫按僧云如何是主賓互換之機師便打乃云當陽顯露未免周遮覿面提持猶為委曲適纔這闍黎問四賓主老僧恁麼答他諸人還會得麼若也會得恁麼也得不恁麼也得恁麼不恁麼總得若也不會恁麼也不得不恁麼也不得恁麼不恁麼總不得于中還有向直截根源處道得一句者麼如無老僧為諸人按箇時節天行節令五月五他方已有龍舟舞磬山深處本寂寥也要乘時撾毒鼓千妖百怪盡潛藏放出林間一群虎雖然未備爪牙兒已是氣具吞牛勢萬仞崖頭撒手歸翻身踏破來時路還委麼頂門開道眼肘後掛神符示眾師云諸人既為臨濟門下兒孫當盡臨濟法道若不盡伊法道他日不堪為人師範法道者何祇如四賓主今時人雖識四賓主句但不悟看字落處便儱儱侗侗打發將去賓主糢糊而已老僧又氣衰力弱不能一一與諸人剖悉時有僧便問如何是賓看主師云入門須辨取問如何是主看賓師云不待形言語問如何是主看主師云兩眼對兩眼問如何是賓看賓師云二俱是瞎漢師復云離卻四賓主諸人道將一句來看良久云了復云老僧今日更與諸人頌出如何是賓看主踏破雲山千萬重歸來事事已從容竿頭獨坐垂絲者孰諳滄波泛莫窮如何是主看賓赤條條地顯家風不是無端霹靂空殺賊便能騎賊馬到頭輸卻僧中龍如何是主看主以鏡照鏡鏡奚容面面光含萬象空識得箇中消息子不尋枝葉落殘紅如何是賓看賓相逢盡是幻中人影現何曾識得真分付此時林下客莫教空帶眼中塵所以臨濟大師道山僧所舉皆是辨魔揀異知其邪正師喝一喝云珍重示眾舉九峰禪師問僧近離甚處僧云閩中峰云遠涉不易僧云不難動步便到峰云有不動步者麼僧云有峰云爭得到此間僧無對峰以拄杖趁下師云此僧將成九仞之山難進一簣之土磬山若作此僧更踏上一步云願和尚萬福諸人還下得一轉語麼若下得這轉語許你明窗下到處安閒若下不得動步皆錯試道看復示頌云千里雲山不憚勞何妨覿面轉途遙殷勤報與當場者莫待臨機無下稍示眾舉石門徹禪師因令初上座領眾來參徹問萬仞峰頭石牛吼穿雲渡水意如何初無對師云老僧若作初上座便云天曉清風拂輕袖夜來明月上高峰徹云山僧住持事大參堂去師著語云諾也知此事不易復云可見此事相續也大難徹後令僧下語或云久嚮和尚或云訪道尋師明的旨覺了根源顯異機徹云當時初上座若下得這語不將他作參學人師云不將他作參學人且道作甚麼人看若知得他落處磬山已作學人看如是還與古人同耶異耶試道看示眾師云向上一路把住牢關截斷眾流不通凡聖祇為誘引初機不無曲垂方便諸人還知麼不見當時有僧問臨濟大師如何是真佛真法真道乞垂開示濟云佛者心清淨是法者心光明是道者處處無礙淨光是三即一皆空而無實有如真正道人念念心不間斷自達磨大師從西土來只是覓箇不受惑底人後遇二祖一言便了始知從前虛用工夫山僧今日見處與佛祖不別若第一句中得堪與佛祖為師若第二句中得堪與人天為師若第三句中得自救不了有僧問如何是第一句濟云三要印開朱點窄未容擬議主賓分如何是第二句濟云妙解豈容無著問漚和爭負截流機如何是第三句濟云看取棚頭弄傀儡牽抽全藉裏頭人師云老僧今日不惜口業與諸人通箇消息僧問如何是第一句師云描也描不成畫也畫不就如何是第二句師云無風荷葉動決定有魚行如何是第三句師云雨打梨花蛺蝶飛復示頌云第一句聲前坐斷閒家具千聖從茲道眼開箇裏難容殺活智第二句言下分明須薦取人天一路未為奇光爍乾坤孰不懼第三句回頭轉腦尤鈍滯風塵狼藉不知歸止啼黃葉空教費到這裏諸人還薦得麼若薦得更須知慈明老人云第一句薦得和泥合水第二句薦得無繩自縛第三句薦得四稜著地又作麼生會若會得許你與佛祖為師若未會切須仔細莫學今時不識好惡錯下名言埋沒先聖珍重珍重解夏小參師云秋風飄飄秋葉蕭蕭涼颼颼地客路迢迢一條楖栗杖散漫以逍遙只與麼去又是隨群逐隊不與麼去切忌枯守寒巖正當恁麼時如何通消息拈拄杖云結也從這裏結山河大地情與無情一時結解也從這裏解森羅萬象人與非人一時解不結不解一句又如何道卓拄杖云幾年獨立千峰頂劃破飛雲不放高以拄杖一時趁散
