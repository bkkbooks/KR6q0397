body:
  text: 天隱和尚語錄序予不會佛法讀磬山語而歎石磬音嘹亮聾人耳更聞斯言不我欺也獨步大方風颯颯地盡大地人亡鋒結舌如鴆鳥落水魚鱉皆死是吾師正令頂門放光照四天下如衣穿瘦骨露屋破看星眠覺他人見煙知火猶隔一山在是吾師金剛眼推倒慈氏樓拆卻空王殿如向黑暗獄中敲枷打鎖餓鬼隊裏放火奪漿又如引人向萬丈懸崖一推命斷是吾師白拈手大用現前不存軌則拈頭作尾指實為虛有時點鐵成金有時點金成鐵如臨敵布陳改旗變勢分合無窮是吾師殺活劍有時海底生塵須彌鼓浪夜半日頭出日午打三更有時冬即言寒夏即言熱上來道箇不審下去道箇珍重觀根逗機如袖頭打領腋下剜襟是吾師相體裁有時如無孔笛氈拍板咬嚼不破是吾師鐵牛機有時如桃花浪裏七里灘頭拋綸擲餌是吾師鉤頭意有時如九鳥射盡三足猶存一箭墮地天下暗黑換骨洗腸重整頓通身是眼更須參是吾師竿頭步有時坐斷舌頭直得無出氣處說詩呈劍退三千里寧自碎身如微塵不敢瞎卻一僧眼是吾師生鐵牢關或疑今之談禪者幟赤白分請問磬山與諸方有何分別昔漢武帝以兵法教霍去病去病曰不在學古顧方略何如唐明皇示韓幹以御府圖幹曰不願觀也去病胸中有活法韓幹胸中有活馬磬山胸中有活玄要猛虎口邊拾得毒蛇頭上安排為一切抱椿搖艣人抽釘拔楔是吾師別有生涯昔鄭玄居家考索便從著述起念孔明身比管樂便從勳業起念叔子峴山墮淚便從名稱起念儀秦力攻揣摩便從勢和起念今諸方簇錦攢花搭東瓜印便從熱鬧門庭起念讀師語一過如脫衣卸甲素面相呈摩胸示人不遮不覆是吾師直心道場昔包敏道勸象山與晦翁各自著書以待天下後世之自擇象山正色厲聲曰且道天地間有箇朱元晦陸子靜便添得些子無了後便減得些子今諸方無明熾盛人我崢嶸如獰龍變水留一涔滴變為八萬四千繇旬海磬山空谷音非為好辨如逢磨大師歎六宗之陷牛跡我若不除永纏邪見又如世尊折伏外道使知義墮寧於有智人前斬首不於無智人前得勝是吾師老婆心切獨是吾師鼻孔未易摸索請以俟出格英靈之善讀師語者崇禎癸酉八月江上弟子黃毓祺和南識天隱和尚語錄總目卷之一湖州上柏山報恩禪院語錄卷之二湖州烏瞻山法濟禪院語錄卷之三荊谿磬山語錄之一卷之四荊谿磬山語錄之二卷之五荊谿磬山語錄之三卷之六拈古卷之七舉古別古卷之八徵古代古卷之九頌古卷之十頌古機緣卷之十一普說復問卷之十二書法語卷之十三法語偈頌卷之十四歌詩卷之十五雜著讚佛事行由林間或問另刻行世天隱和尚語錄總目終
