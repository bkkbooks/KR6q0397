body:
  text: 嗣法門人通問等編法語示山茨際徒憧憧往返三千里一望渺茫隔江水不緣箇事肯孜孜叵作尋常辜負汝鍛鍊十成有八九摸著鼻孔打失口從教此際得優游他年以作獅子吼如牛有欄不分外如鶴有翼高飛快正邪勘驗眼已明賤買決不肯賤賣世衰道微竭力掙良朋彼此挈發憤常懷佛祖底深恩必竟當與人徹困腳踏實地茅蓋頭懸崖撒手稱英豪不圖名聞虛浩浩倣傚昔人棲鳥巢若逢箇中真種草逼拶須持庫內刀斷卻命根盡底掃直教言下頓然超坐斷千峰寒徹色騎出崑崙陶鑄物三玄三要驀然提照用不來只一奪從上宗乘非造次不是時流沒意旨把住咽喉吐得氣全機大用主中主示箬庵問書記問子當年未脫俗先受老僧箇荼毒截髮捐妻入武林端為本分無私曲十八灘頭洗滌心一肩擔月歸荊谷秖緣毒氣種深來棒頭撥著笑亦哭屢年復受老鉗錘吐盡肝腸傾盡腹饑餐渴飲已自知鄭重藏鋒於穆穆出頭天外看時人潔操清孤真可掬不欲泛泛混常流確志深山住茅屋他年起我臨濟宗殺活縱橫開天目若人來問道如何笑指庭前幾莖竹示澹禪人一片白雲封谷口試問闍黎那裏走臨行舒紙要長篇信筆墨揮三兩斗立志須過磬山老莫學痿棲蘆鳥仰觀昔日一宿翁頓悟無生孰不曉末後一句把住關直待重來與你道果然是箇丈夫兒洞庭七十二峰俱推倒方纔好浙直從君且漫遊休負他年插一莖草示林玹琇徒省親母在澄江江上住為緣省覲出山去秋風飄飄秋水清幽鳥喃喃送離語丈夫不獨念劬勞要施十方普法雨森羅萬象盡沾恩情與無情咸歡愉佛祖命脈在汝躬蓋天蓋地僧中龍光吞日月開頂目他年必樹臨濟宗不比尋常人碌碌一刀未斷猶𦆟𦆟賓中有主從他穿過花柳巷中寂爾忘緣主中有賓自然透脫殺活機權大用現前知離知微識得本際玄虛達進達退把住道源總持魔強法弱在當世努力掀播自家底玄中玄要中要拈來說與鄉鄰道切莫輕忽出家兒出家自有僧中寶汝親見得箇中圓白髮也須剪卻了臨行助汝一長篇滿門度盡方纔好示普聞禪人敲空作響絕奇音四海澄清道普聞花發千峰添翠色風傳萬戶和陽春情存半點難趨湊妄立纖毫未是真透脫見聞知解路豈認驢前馬後人咄工夫極盡今時去今年不是舊年貧喝下翻身親轉得從今不向外頭尋提得祖師心印地浩浩洪波作晚津示誠侍者本分衲僧家言行唯真實一句虛頭語百年洗不徹平生吐肝膽教人徹見骨閒看松柏堅風霜雪愈嚴爍破乾坤眼光明照大千提持祖師印只在一毫端一毫端上現神通大地山河隨身轉走入藕絲孔裏去㘞地一聲無處躲翻身直上磬山來漫吃老僧這大棒示同雲禪人咄哉真面目直下親自見晝夜十二時如雷轟掣電動止非動止能轉能不轉若水也無力載舟卻是善識不可識識現亦非現現祇許老胡知不許老胡面吾無法雨施權示這方便示徹禪人徹頭徹尾性相不住觸著動著如大火聚點即不到即落躊躇秋蟲亂鳴無稽之語著著有源遮裏方許似鳥飛空全憑雙羽乘風而去行九萬里咄驀然一念便知歸識得吾家主中主示音禪人宗如山教如海吞吐須教心地快分明卓犖不須求坐斷乾坤得瀟灑上古家風歷歷然韶陽托出誰能解泥牛鬥入自無蹤隱山說破今藹藹山非山海非海撥轉機關無不在拈來便用自家底衣裏明珠奚勞丐光含萬象從本來著著現前了無礙示德中禪人德蘊于中內虛外隆無在不在自空合空宗乘踏破佛祖難和筆下風雷惟憑此箇參究工夫行住坐臥示覺義禪人要證自心覺了此義此義幽玄聲色難見色空聲寂無乎不現密密綿綿打成一片示宜禪人一口吸盡西江流橫拈拄杖倒騎牛靈機鱍鱍無拘束放去收來得自由咄山青水綠四大部洲踏破歸兮滿面羞識得報恩親切句坐斷千差底路頭休休不風流處也風流示智閒禪人大智閒閒守之無端小智間間行之為顛不行不守其用綿綿臨機無住方始得全本分一著休學磨磚打車打牛達性偏圓妙在其中玄之又玄法句無句如觀流泉道不可傳禪不可宣不負來意信筆成篇示永泰禪人萬仞崖頭翻身一擲踢破虛空再與你說示河南心一禪人不是河南便是河北這裏分明是真面目示無住禪人一腳踏遍天涯步步何曾離家虛空跐得粉碎心地方始開花坐亦如然行亦不差擬議之間路更賒有人問你報恩老春來無事臥煙霞示芥生禪人不是心兮不是物拶得虛空眼睛突十方世界一疑團白日青天取風骨雲收霧捲不肯休定教打破無生窟露出娘生面目來驀直之間咄咄咄示雪航講主嚴持戒律通達教乘頓悟心旨繼祖師燈若偏其一始終不稱普濟慈航隨根器應似水銀傾大小光瑩傑骨壯年須當徹證念爾遠來聊爾為贈示文節講主昔年有箇亮座主一見馬師心自許忙忙辭眾入西山人去尋伊不知處百般經論拋那邊獅子遊行無伴侶文禪今日見老僧不識能效亮公舉嗟嗟時下門庭衰直須猛烈發慧炬照破魔宮令膽寒作得吾家中流柱示紹講主拋卻三乘十二分特扣禪宗要徹困脊梁硬著鼻下垂不肯泛常流俗混貴圖續焰祖師燈人不我知終不慍剔起眉毛向上看丈夫自有沖天憤伶竮辛苦數十年今日微知在方寸示念恩上人四恩能報方為釋子直下分明不動唇齒言前薦得我不如你來索語言你不如我既然如是領取話頭參究本來以悟為期十二時中勤勤若此㘞地一聲偷心纔死再見老僧一鎚便是咄示任還生居士不是心不是佛不是物要把虛空跐出骨當人獨立萬層巔一念圓成似秋月風雲腳下任縱橫俯視人間真汩汩出頭天外看繇誰麒麟不臥獅子窟問渠得箇甚端倪恩大難酬憑此力咄他年再入磬山窩奪卻君持手中笏示心宇居士魚驚釣而深藏鳥脫籠而高飛詎暇啜食那肯停枝潛修歲月化龍去鍛煉功至乘鵬歸休瞌睡莫遲疑眨上眉毛凡聖祛眨眼轉來春夢過遍身吐出黃金泥那時要問禪與道你自東兮我自西咄示戒生居士萬法歸一一歸何處付與戒生須教提徹休將意解切忌妄說行住坐臥明明歷歷湛若太虛猶為繫橛類之不齊擬之不截混入塵中是非不別打破疑團一生事畢示定生居士生從何來死從何往明明提去那許近傍不明提去猶且似誑提與不提磬山有棒歷歷孤明悟迷一樣寒至徹骨梅花自放示慧生居士不是心不是佛不是物是什麼箇中摸索無邊闊提來提去不知名踏破虛空露出骨藕絲繫住毘盧身獨腳何曾走得行㘞地一聲親見得依然原是舊時人咦春風拂拂滿面生到此臨機活潑潑解脫須教大解脫依稀放下莫將來箇中若有纖毫在生死關頭打不開示五輯居士萬緣放下了不可住於空提起話頭來不可著於有應須密密參只麼綿綿究迷妄要明真認真亦成臼打破兩重關步步無前後一念絕中邊方悟本來有超然出世間不落瞿曇後偈頌和古德涅槃堂偈身居清淨涅槃堂箇裏無私不可傷磨練慧根似鋒刃嚴持戒律若冰霜劈開劫積塵緣累截斷當時愛見忙凡聖頓超言下悟因循不覺自家妨十方世界涅槃堂一念迷時又可傷那曉百年花上露安知萬事樹頭霜得閒且放片時靜何故無端逐日忙衣食隨緣休妄取饑寒兩字總無妨鐵人來到涅槃堂不覺心酸也慘傷暖氣漸消寒徹骨親情絕倒冷如霜多生結習須當受半世功名空自忙說與道人宜早省莫教撒手被伊妨三界茫茫真可傷那知自性涅槃堂剎那一世鏡中像俄爾幾年眉上霜愛念未除終自苦情緣難盡為他忙果然是箇奇男子趨破樊籠了不妨生生死死涅槃堂一度投胎一度傷脫骨不知堆幾嶽遺悲何止萬層霜都將年少身心樂未解時衰手腳忙一息不來誰代你空嗟恩愛為他妨生死輪迴實可傷誰能預想涅槃堂貪嗔自縛蠶成繭名利他求鴈帶霜善惡業因招苦樂陰陽報應始慌忙道人活計如何也看破空花便不妨碌碌浮生可痛傷茫茫直至涅槃堂情迷空捉水中月業障頻添石上霜意馬馳緣誰肯覺心猿逐境自奔忙老僧終日閒閒地總使無常也不妨病人噓嘆涅槃堂鐵打心腸必慘傷寂寂夜來空枕月惺惺明到一天霜良朋謾說誰知己親友提攜各自忙最苦未曾開道眼都緣世務被伊妨眼光落地涅槃堂素不交遊也感傷話到此間心冷水辭窮箇事骨寒霜未明心地空來去不達源頭甘著忙苦勸學人須勇猛跳出塵勞纔不妨哀哀聲聽涅槃堂豈不尋思己分傷多少青年先眼淚那堪老邁滿頭霜英雄難免無常苦明哲焉逃畢世忙且喜野人稍得力定教來去不相妨和古德居山因僧問我西來意住箇深山那記年芟草得雲涼赤腳擔茅蔽雨累雙肩閒來松下坐磐石渴就溪邊掬瀑泉更有一般堪羨處都盧拈向未生前和密雲師兄剎剎塵塵是道場淫房酒肆不拘方頂門廓徹通天眼匝地全彰見法王把住虛空當撲碎放行輪劫未為長堪嗟苦海無邊際任爾縱橫倒駕航徹底掀翻到古盤超然物外悟心寬大千沙界一毫現百億須彌箇裏含法法盡從伊建立頭頭原藉爾為端偶然點破於中事說與知音仔細看學道須當徹骨窮寸絲不挂露家風但能對境忘人我不假澄心當體空山色雨過添晚翠溪光霞接映朝紅乾坤許我林間老不逐風塵西復東不住陽兮不住陰了然如月照孤岑萬緣放下理先覺一念無私道可尋行履直教非內外應酬休逐在昇沉生平樂業何勞覓不昧原初一點心誕日示諸子衰年事事已無求嗟嘆光陰若水流苦楚如雲點空霽歡娛似雁過滄洲籬邊黃菊經霜老巖畔青松滴露秋誰道此生真夢幻夢回蝴蝶笑莊周因徒眾各呈其志示偈棄卻幽藍入市藍為人徹困起沉酣棒頭那許伊形巧喝下分明孰敢憨堪笑諸方陳舊話漫題短句破空譚老僧今日揚家醜要繼先宗始不慚諸子呈草拂示偈藂藂之莖覆地陰拂拂之清助老吟指東話西令人驚橫拈倒用從吾心有時遇箇知音者拋擲相投付與君咄而今暫把巖頭上垂釣煙波度幾春閱三峰五宗原題寄野人不識蔚山面遙聞哮吼如雷電拈出威音這箇圈擲向人前誰得薦擬之如聞荼毒鼓觸著似犯太阿劍頂門直透上重關超脫從前者白練示授徒住山獨宿孤峰辦道真箇中著著要相親須明格外驢蹄旨參透玄關鱉鼻音奪境奪人全照用分賓分主達權衡當陽直截單提印優缽花開大地春羨爾慇懃道念真一番相見一番新竿頭進步心空闊喝下知歸眼底清入室光含千嶂月披衣影帶萬峰雲機前這著能超脫果紹曹溪正法輪示林皋豫住淨雲淨雲深處可安居就裏藏鋒得自如門戶潑開須接納鉗錘鍛煉勘承虛宗乘了了曾淘汰已分明明任卷舒不是尋常泛然客莫教心意更躊躇示直方禪人住靜秋水澄澄秋月明孤峰獨去究宗乘楊岐一路能分曉少室單傳自了音四喝直教心領略三玄須是見超群臨行老漢無多語只為闍黎識重輕示聖淨禪人行盡山山路轉窮漫隨黃葉上高峰白雲影裏尋蹤跡端的誰知在箇中石磬不敲聲遍界無心觸處悟圓通相承再叩宗乘事笑點桃花一樹紅示太虛上人一點靈光徹太虛森羅萬象總非殊念繇境起心空現境自心生相即如心境兩忘迷解盡法塵不立悟還除堂堂大道無今古歷歷盤中自走珠示際徒歸省窮山一老叟抱病自忘憂賴有二三子因循過幾秋此行端省覲母戀在優游江水片帆近免教人倚樓示琇徒掩關虛空關不住天地本無門一把無鬚鎖深藏在玉林半肩擔祖印雙足踏靈雲入出原無礙休言定幾春懷琇侍者吾懷琇侍者見道夙根深兩載巾瓶事三春木石心頭頭自靈妙一一本天真繼我誰為後如斯得幾人贈嚴長惺老居士長坐惺惺地閒開不二門溪山原一體真幻本同心觸處隨宜用當機有淺深若存玄妙見猶著眼中塵次起明居士即此給孤園何勞建法筵五車書滿載三要體無偏夢幻虛堂寂真如覺性圓曹溪清正脈烏敢妄流傳參禪四偈參禪要透徹一毫不假力對境自無心忘緣體空寂這箇話頭圓大千無孔隙擬議欲承當生死何了日參禪不究竟都謂是心病根境未圓融色空徒自淨開眼皆見魔順情咸背聖若非真丈夫安能佩祖印參禪須真實究竟無可說叩已下疑情一片心鐵石真俗諦全超人我見頓息閒住空林中念念波羅蜜參禪明直指貴圖脫生死不許別思量豈容鑽故紙舉步鐵蛇橫瞬目金獅噬撒手萬仞崖方名出世士示恒證禪人孤負高流到此山電光影裏睹頹顏相逢本是無言語莫道無言當等閒箇中難得一知音肯向無聞聞處聞若是闍黎能聽聽他年別立一乾坤示深谷禪人瞻風撥草學無生坐臥經行深谷林今日飄然杖藜去六時須自要惺惺放汝歸兮暫息肩過江風月半秋天有人問著參禪事笑指玄言在目前示盡演靜主踏破千峰已罷參蕭然一室養耆年了知宗教無餘事收拾雙趺好住菴示嬾牛靜主雙徑寥寥十載餘松風幽鳥解相知金輪峰頂翻身轉踏斷溪聲一雨飛臥雲深處藏蹤跡水草咸餘懶外尋今古不傳些子妙溈山端的是知音示慈門座主操宗演教正當時一雨普施平等慈踏得悠悠雙徑斷方堪克紹作家兒示徒範一句話頭猶未徹草鞋踏破磬山前當機只許無開口默默慇懃仔細參示徒本父母未生前底事擬思量處隔千山直須拶破娘生面超出如來第一關抖擻精神做一番莫將心去放虛閒雖然這片舊田地幾度行來幾度難盡日閒閒無所求山中學道萬緣休偶然摸著撩天鼻任爾縱橫得自由示琇侍者芟染昨日為儒今日僧轉凡成聖不多能翻思昔日靈山老也是其年得越城示慧門禪人嚴持戒律行門深更欲研窮己分真拶到無形無相處管教大地盡陽春示法源上人法法從來有本源箇中無住亦無偏若能到得心空地始可隨流駕鐵船示常愚上人撥草瞻風自遠來雲山疊疊破莓苔老人這種平懷處分付闍黎仔細猜示蒼碧上人但能了得凡情事聖解何曾不現前這裏兩頭俱脫落青天喫棒始如然示慈引居士了知富貴若空花極樂原來是一家功德不拘隨處現塵塵剎剎布金沙示西坡居士身心清淨是真修萬別千差一念收願力直須深種得拈來事事總優游示研觀居士打掃心間無一物十方世界悟全空紅塵堆裏出隻手佛事門中處處隆示唐祈遠居士拶到心空未肯休直須大用應機酬大千提掇掌中現好引疏風撼鐵牛觸處隨宜須自看箇中那住一毫端從來不許偏空法著著分明在目前道在尋常日用中腳頭步步踏高峰玄關擊碎無金鎖信手拈來處處通跋涉溪山訪道真為尋知識討分明若能一念迴光照法法頭頭本現成秉受金剛志常持般若刀破疑無用力證果亦非遙夙乘悲願力外護得心堅看到忘緣處恒劫自如然寄吳迪美居士骨氣生來要正剛能行異路法中王太阿提起當頭截縱遇魔軍自肯降此道原來不屬修證無修處出常流是真精進天然懶不是尋常按鼻牛懺悔一門權是藥直須自信得良方業因夙積堆山嶽恰似雪消當太陽根本直須親見徹了然無事箇中人看來都是依稀者切忌提防在現行答子文居士曾聞斷臂乞心安少室峰前雪染看無限風光留不住野花流水正同歡林間手植樹成行無影枝頭吐妙香幽鳥喃喃啼禿舌也教喚醒客中忙誰道壺中別有家擬思量處隔天涯頂門開眼明如日可許空中著片花示方克駿居士此事無分忙與閒須教痛處轉加鞭一刀截斷塵緣路當下無生生了然箇裏分明本現成也須返照眼中睛嗒焉識破娘生面了了原無物可呈本無蹤跡與人尋可比深山花裏春多見客來枝上採誰知踏步又迷津不生一念已空空托出須彌一箇峰會得韶陽親切處磬山路路可相通示顧孟河居士幻影浮華總百年覺來都在剎那間誰能見惜春光早花柳叢中自得閒富貴榮華蝶夢空休教栩栩亂心宗紅塵堆裏能為主蓋色騎聲便不同于曾唯居士寫師像示偈乾坤盡在筆端頭流出山河興不休一念回光能返照大千沙界是浮漚千山萬水出毫端頃刻揮成復自看濃淡煙雲是誰力了知箇裏不曾安情與無情一念中未嘗舉筆處先空森羅萬象掌中物道在其間誰識儂大丈夫兒豈自乖本來成現不安排等閒識得賓中主不被紅塵裏活埋示孫居士禮法華經未禮之前薦得渠不勞更問古文殊蓮開劫外君能悟火宅之中本自如示醫士靈山會上大醫王濟世全憑一箇方信手拈來都是藥管教大地得清涼示張道者時師在病戒言氣衰力弱不能言賴有維摩一默傳但得不隨聲色轉自然相契老胡禪示眾月來相聚諸禪客幾箇心頭已悄然箇裏若存元字腳依然埋沒在塵緣話頭提得密綿綿只在忙閒動靜參㘞地一聲親見得大千沙界一毫端巖畔煙霞老古錐吟風笑月幾人知寄懷託舌溪聲遠說法那添眼上眉三獸匆匆用渡河無分深淺出凡波高懸佛日當空照也是徒勞雲影過新正即事警眾纔得新正幾日過流光倏忽莫蹉跎承虛接響終無用悟徹根源好大哥箇事相承不可賒擬思量處隔千差棒頭有眼明如日若是真金豈混沙性本圓明莫妄求千差萬別箇中流聲前色後無餘事空起許多閒念頭萬仞崖頭撒手來虛空撲碎絕疑猜當場得箇知音者可喜優曇一度開春日般若流光日日新上林花發劫前春枝頭黃鳥聲聲喚爭奈時人未曉音聲色堆頭劫外春桃紅柳綠逐時新道人獨坐明窗下撥古窮今自賞音客問師姓答偈幾欲藏身無處藏心如頑石道如常君今要識山僧面原是當年閔四郎次本師送進關偈附原偈老衲於今不坐關既無住也幸無閒何曾進又何曾出只在尋常天地間了知此際不容開物外無心到處閒心境廓然原不二也歸無念剎那間有生有滅隔重關無滅無生當處閒是誰生也是誰滅也歸無念剎那間突興一念是重關放下之時便等閒起滅不停誰滅滅也歸無念剎那間徹見虛空無閉關身心萬物自常閒從他出也從他入也歸無念剎那間一重撥去一重關弗若摩尼本自閒應物現形原不動也歸無念剎那間老漢從來把住關不容擬議落忙閒也知就裏婆心切總歸無念剎那間拈陽明先生良知偈良知即是獨知時知得知時知己知般若無知知遍界風清月白更由誰風清月白更由誰遍界靈知無別知觸目湛然無可說休認惺惺是有為次達觀大師夜行偈星夜經行時前後步互起前步若至地後步不能起後步若至地前步亦不起前後不至地乃能起不已即此諦觀之足何嘗至地足既不至地空水亦可履空水既可履神通孰不具月下閒經行步步須自起前步不至地後步不得起後步若止地前步亦不起前後不住地乃能步不已吾以是觀之足何嘗住地足既不住地空水履無履空水履無履神通箇箇具和憨大師居山偈自笑山中人懶散奚為趣問時兩頓粥困來一覺睡細草作蒲團碎衲為蓋被忘讀東魯書不識西來意三界空中花一真眼裏翳離卻聖凡情脫略前後際如雲過長空縱橫了無事得失不關心悟迷那能滯有為即無為無榮亦無累去住任優悠死生不二義打破這重關纔獲居山計答許九環居士偈君如毘耶叟說法獅子吼富貴了空花功名若墮缶兩兩不成雙三三一如九吾豈真文殊良緣亦非偶道本出常情德業持來久言言見諦真字字不失守欲步步不前聊賡韻以後推開不二門掣斷綱宗紐只用一默心杜絕群英口想依願力來一見如故友不弄雪峰蛇不喚子胡狗握手逍遙遊漫看溪山走踏斷古路頭已出這窠臼臥病一室中機用恁唧溜命徒問疾來香飯曾借否嘗聞象王鳴驚起泥牛吼狼忙撲帝鐘拋出破沙缶玄機落落來兼帶如如九萬化繇端倪混沌變奇偶物類咸幻然天地曷長久道即心目間德越離微守無形本無影有前始有後居士識綱宗老漢揭領紐浩浩風雷舌滔滔河海口一方已白眉千古成良友剔脫賴金僊俯視愍芻狗嗟嗟逐風塵碌碌如雲走已踏徹底源掀翻聖凡臼欽哉洞然明箇裏真唧溜篝燈誦瑤篇聊酬誰可否雲巖偈龍池一片雲化作巉巖石獨立萬層巔令人看奇絕幾欲飛去來清風笑無翊月出湖波光天連山影碧其間學道人逍遙定中出玄言留碩玟光陰宜自惜曾登彼岸來濁累頓超逸莫作雲巖看宇宙可一息答顧九疇太史色空四偈捏碎太虛空萬象絕行蹤靈明這一點火焰飛大鵬眼聽聲最好耳觀色自皎一念絕思量誰拙復誰巧色不自色色空不自空空乾坤一隻眼那辨是蛇龍月色和雲白松風帶露寒法空無背面仔細好生觀和青松禪師栽松偈帶雪以栽培春來長青草何年得乘陰我老他不老聞驢鳴偈忽聞驢子叫驚起當人笑萬別與千差非聲非色鬧和汪居士拽石偈殘劫遺來一怪石用盡檀那娘生力掀翻擲向無何鄉纔得方圓平坦直寬寬漫漫任雲遊卓卓巍巍正基得咥善財參處即此境樓閣門開見彌勒隨喜放生偈諸佛本是眾生性眾生即是諸佛體佛種從緣性即空生繇迷悟體無止故說三堅無為法修持定慧戒為始眾生能持未能持當隨放生利益喜如人欲行千萬里須從一步而起趾眾生相狀各不同護生之心心無二痛癢與我一般知寧不哀憐方便彼不息貪嗔異類生一念慈悲真佛子無邊蠢動悉含靈秖因活己令他死安忍欺靈損彼身滋我無明幻口體幻體浮脆誰得堅百年歡樂電光耳生死無常瞬息閒前路昇沉難保己改頭換面一迷心誰識我兮誰識你推己臨崖畏死心及物窮源安肯弛竊念多生父母親苦惱綣戀輪迴裏出溺水陸空行中萬死萬生烏停止復念化身菩薩眾智能托類相救濟寂然無苦無樂中現乎有苦有樂事凡夫五眼未圓明不覺那窺聖凡體解達性本具天真了然生佛無彼此頭頭返照平等觀物物一真法界耳須知一期果報完是因是果無差爾雲巖破衲修道人揮毫所書語如是山中四威儀偈山中行杖頭觸處凍雲深鐵鞋踏破千峰頂不用回頭戀碧𡾓山中住幾番寒暑侵不去風光自足四時天著意尋他無覓處山中坐幾度白雲空自過孤燈圓月照松房覺了死生之事大山中臥經年縮腳巖龕破夢裏常懷法濟人覺後依然貪懶惰和真淨老人雲居頌絕頂雲居北斗齊雲庵老漢最先提凡情莫測大機用纔露鋒芒已涉泥絕頂雲居北斗齊出頭天外始應提道人活計原無著好似青蓮出水泥絕頂雲居北斗齊虛空突出露全提群峰疊疊高低應無限人杖帶泥絕頂雲居北斗齊電光影裏以持提明超日月乾坤淨擬議將來三尺泥絕頂雲居北斗齊幾人到此箇中提雲收霧捲天空闊開眼緣何腳踏泥和普明禪師牧牛圖頌水雲渺渺亂聲哮密密尋蹤路更遙晝夜風霜不知處恐伊相犯別家苗未牧纔獲繩頭把鼻穿謾將痛處更加鞭也知鄉井迢迢遠拽轉頭來著力牽初謂不從他性遠驅馳寸步提持漫漫隨幾度黑風吹濕雨通身泥水總忘疲受制驀地忘機自轉頭悄然性氣已調柔山中水草了知足不用遲疑在外留迴首閒放林間與水邊橫騎短笛任悠然歸來一帶煙霞晚瀟灑歌謠不假牽馴伏出入無欄心自如擬思量處更猶拘滿懷風月人牛穩鞭索俱忘樂有餘無礙野岸溪灣花柳中一環山水翠林茸逍遙快活無求也軟草為氈睡興濃任運拶到忘懷混沌中千山一色絕相同風光不覺人牛處任運騰騰西復東相言不須收放得安閒脫略尋常顧盻間散步謾歸明月下踏翻從上兩重開獨照人牛處處竟無蹤新月孤懸萬象空借問歸源端的旨枯椿春到綠叢叢雙泯本來面目頌這箇本來面大千隨處見疑擬欲承當太虛生閃電追之不得停挽之以何轉逍遙出世間世間惟此善問渠渠不知咄渠渠又現堪嗟捉影人豈識伊真面雲巖老頭陀笑指箇方便僧請益溈山有句無句頌狼狽相扶走始成舌頭無骨最相親乾坤不獲三光照有眼人人暗裏行暗裏行涉途程可憐無據奴郎者轉使溈山笑更新因眾呈頌不愜復示一箭雙鵰得得新分明全露法王身尋言逐句支離者依約雲山贅賞音漫賞音獨沉吟一一鍼錐須徹骨箇裏原無半點塵咄又頌綱宗總握句無偏著著分明已現前箇裏豈容聲色轉鑽研不到更加鞭灼然一笑傳千古幸有知音隻眼觀撥轉機關全體露大千沙界掌中看趙州八十罷參頌疏逸無拘超出群天涯踏遍若風雲舉頭天外誰知已收拾雙趺懶去尋懶去尋到家原不涉途程溪聲山色依然舊輪劫何曾有二人洞山與密師伯訪龍山頌隱隱雲山知幾重無心黃葉出溪東沿流直上尋蹤跡響答如雷應谷空賓主機關總奇絕乾坤坐斷更藏鋒住菴臨訪皆堪羨留與人間作範宗閱楚石禪師魚籃觀音贊籃不見魚通身是眼眼若有見如魚墮籃見不見離聞非聞滅善哉大士常現娑婆頌云眼在見中耳在聞中達得此旨當下心空聞見不二處處皆宗法被頌當機一著那許摸索信手拈來笊籬木杓咄眼目定動是猶遲萬里天邊飛一鶚
