body:
  text: 嗣法門人通問等編舉古舉王大王向雪峰會裏請晏監寺住鼓山峰與孚上座送出門回至法堂乃云一隻聖箭直射九重城裏去也孚云和尚是伊未在峰云渠是徹底人孚云若不信待某去勘過遂至中路把住云師兄向什麼處去鼓山云九重城裏去孚云忽遇三軍圍困時如何山云他家自有通霄路孚云恁麼則離宮失殿去也山云何處不稱尊孚便回謂雪峰云好一隻聖箭折卻也遂舉前話峰云渠有語在孚云這老凍膿畢竟有鄉情在師云得底人始終一揆忌底人古今皆嫌不二之道便見參差至理之詞灼然難忍嗟夫人不知心可欺師不可欺事可瞞理不可瞞也知子莫若父在雪老有之矣雖然如是一得一失當時雪峰折卻拄杖子而今磬山這裏有此等漢直打出山門免教他日遭人簡點豈不見妙喜和尚云眾中商量道什麼處是聖箭折處云鼓山不合荅話是聖箭折處鼓山不合說道理是聖箭折處恁麼剖判非惟不識鼓山亦乃不識孚老殊不知孚上座正是一枚賊漢于鼓山面前納一場敗闕懡㦬而歸卻來雪峰拔本大似屋裏販揚州若非雪老有大人相這賊向甚處容身當時可惜放過卻成不了公案只今莫有為古人出氣底麼試出來我要問你什麼處是聖箭折處又不見楚石禪師云鼓山聖箭子射入九重城甚生氣概孚上座等閒拶著略露鋒鋩回至法堂卻云箭折誣人之罪以罪加之師云也是一得一失磬山恁麼說亦是一得一失還有跳得得失出者麼咄舉恕中和尚頌芭蕉示眾咄哉亂走阿師何曾放得拄杖捉來拗作兩橛請續末後句師呵呵笑云有無還他一半舉五祖和尚云世有一物不屬凡不屬聖不屬邪不屬正萬事臨時自然號令恕中禪師云世有一物在凡屬凡在聖屬聖在邪屬邪在正屬正萬事紛紜何須號令師云這兩箇老古錐各自分疆立界一箇混俗和光隨流得妙一箇孑峭孤危坐斷情塵磬山將來一束拋向大洋東海免得後人分凡分聖說邪說正旁有不甘者出來道和尚恁麼道是分耶不分耶說耶不說耶拈拄杖直打出去呵呵笑云也是為他閑事長無明喝一喝舉馬祖令僧馳書上徑山山接得開見一圓相於中下一點卻封回國師聞云欽師猶被馬師惑雪竇云徑山被惑且置若將呈似國師作箇什麼伎倆免被惑去有老宿云當時坐卻便休又有道但與畫破若與麼只是不識羞敢謂天下老師各具金剛眼睛廣作神通變化還免得麼雪竇見處也要諸人共知只這馬師當時畫出早自惑了也浮山云欽師被馬師惑且置國師惑卻多少人雪竇云只這馬師當時畫出早自惑了也穿卻天下人鼻孔恕中云馬師自惑國師惑人置而弗論當時徑山下者一點非惟點破馬師髑髏抑且為千古龜鑑師云這一隊老宿雖則善揣虛空之骨髓拏雲霧之根盤猶未跳得馬大師這箇圈繢子出在莫道這一隊老宿即上至諸佛下及含靈咸跳不出這圈繢在除非是無面目漢方跳得這箇圈繢出有麼有麼一任𨁝跳如無諸人謾謾且向歷代祖師鉗鎚下挨將去始到無疑無惑之地不然盡是弄虛頭切莫草草舉張無盡見兜率悅禪師既有契証因詢晦堂家風於悅欲往就見悅云此老只一拳頭耳師喝一喝乃潛奉書于晦堂云無盡居士世智辨聰非老和尚一拳垂示安能使其知有宗門向上事耶師又喝一喝未幾無盡遊黃龍訪晦堂于西園先以偈書默菴壁曰亂雲堆裏數峰高絕學高人此遁逃無柰俗官知住處前驅一喝散猿猱徐叩宗門事果示以拳頭話無盡默計不出悅所料師云著賊了也由是易之有偈云久向黃龍山裏龍到來只見住山翁須知背觸拳頭外更有靈犀一點通師云此二老當世英才一時宗匠何故隨人腳跟轉失卻一隻眼也且道兜率是何心行流落叢林至今成話杷耶蒼天蒼天舉德山到溈山挾複子上法堂從東過西從西過東顧視云無無便出至門首卻云不得草草重具威儀再入相見纔跨方丈便提起坐具云和尚溈山擬取拂子德山便喝拂袖而出溈山至晚問首座今日新到在不首座云當時背卻法堂著草鞋去了也溈山山云此子已後向孤峰絕頂盤結草庵呵佛罵祖去在師云二老恰如龍象蹴踏誠為作家相見雖然磬山若作溈山待他提起坐具叫和尚便與他一喝管教德山通身是口也難下還你草鞋脫在溈山了也何必去後讚揚賊過張弓今日莫有新到者麼許伊穿卻草鞋相見老僧要拔本有麼有麼舉傅大士云法地若動一切不安楚石禪師云壽山從朝至暮不知走了幾遭若是法地誰敢動著一莖草復云我不曾恁麼道傅大士坐了起不得師云楚石恁麼起了坐不得有一起得坐得底請出來相見看喝一喝云雖具一雙窮相手未嘗下揖等閒人舉佛日和尚因僧送拄杖云莫從天台得麼僧云不從天台得云莫從南嶽得麼僧云不從南嶽得云從什麼處得僧度拄杖日豎起云是體是用僧云拈也從體起用放也從用歸體日云你與麼來只得其體不得其用僧云和尚與麼舉只得其用不得其體日卓一下靠拄杖云體用一時收師云佛日老人可謂家富小兒驕驀拈拄杖卓一卓云且道老僧底什麼處來便歸方丈舉雲門一日拈拄杖云凡夫實謂之有二乘析謂之無緣覺謂之幻有菩薩當體即空衲僧見拄杖但喚作拄杖行但行坐但坐不得動著師卓拄杖云不得起有見不住凡夫不得起無見不住二乘不得起幻有見不住緣覺不得起當體即空見不住菩薩雲門老人到這裏也只說得箇行但行坐但坐不得動著可謂特地一場愁即今還有人知雲門老人落處麼不見妙喜和尚道我不似雲門將虛空剜窟寵驀拈拄杖子云不屬有不屬無不屬幻有不屬空復卓一下云凡夫二乘緣覺菩薩盡向這裏各隨根性悉得受用惟於衲僧分上為害為冤要行不得行要坐不得坐進一步則被拄杖子迷卻路頭退一步則被拄杖子穿卻鼻孔只今莫有不甘底麼試出來與拄杖相見如無來年更有新條在惱亂春風卒未休舉睦州問僧近離甚處僧云河北州云河北有趙州和尚上座曾到彼麼僧云某甲近離彼中州云趙州有何言句示徒僧遂舉喫茶話州乃云慚愧卻問僧趙州意作麼生僧云只是一期方便州云苦哉趙州被你將一杓屎潑了也便打後來雪竇云這僧克由𡬡耐將一杓屎潑他二員古佛妙喜云雪竇只知一杓屎潑了趙睦二州殊不知這僧末上趙州將一杓屎潑了卻到睦州又遭一杓只是不知氣息若知氣息什麼處有二員古佛師云雪竇扶弱不扶強妙喜扶強不扶弱且道磬山合作麼生商量也不可放過有人纔出眾老僧即云珍重舉裴相國入寺見壁間畫像問院主云壁間是什麼主云高僧像公云形儀可觀高僧在什麼處主無語公云這裏莫有禪僧麼主云有一希運上座頗似禪者公遂請檗至舉前語問云形儀可觀高僧在什麼處檗召裴休公應諾檗云在什麼處公於言下領旨師云裴相國忘人忘我言下超脫黃檗老直心快口獨露真機是這一等人可說這等話千古規模令人欣羨雖然如是妙喜云似地擎山不知山之孤峻如石含玉不知玉之無瑕黃檗只有殺人刀且無活人劍且道他那裏是他無活人劍處諸人還簡點得出麼若道他有埋沒妙喜若道他無屈殺黃檗然二邊不涉還我裴相國悟底意旨來良久云溪邊石女暗嗟吁海底泥牛亂奔走舉百靈一日路次見龐居士乃問昔日南嶽得力句曾舉向人麼士云曾舉來靈云舉向甚人士以手自指云龐公靈云真是妙德空生也贊之不及士卻問阿師得力句是誰得知靈便戴笠子而去士云善為道路靈更不回首師云二大老不無得力句子各各有本雖然如是若到磬山未放你在何故切忌認奴作郎即今還有人道得得力句麼速道速道舉興化一日謂克賓維那云汝不久為唱導之師賓云不入這保社化云會了不入不會不入賓云總不與麼化便打云克賓維那法戰不勝罰錢五貫設飯一堂至明日化自白槌云克賓維那法戰不勝不得喫飯即便趁出雲居云大冶精金應無變色其奈興化令行大嚴不是克賓維那也大難承當若是如今泛泛之徒翻轉面皮多少時也師云灼然灼然妙喜云雲居拗曲作直要作臨濟烜赫兒孫直須翻轉面皮始得師云妙喜老人不是誘人犯法諸人還知他落處麼路逢劍客須呈劍不是詩人莫獻詩舉石頭示眾云言語動用沒交涉藥山云非言語動用亦沒交涉頭云我這裏鍼劄不入山云我這裏如石上栽花師云二大老如彈沒絃琴唱出無生曲可謂父子投機師資道合雖然不顧傍觀者見其家醜承虛接響漢切忌動著動著則三十棒舉世尊初生下周行七步目顧四方一手指天一手指地云天上天下唯吾獨尊師咄云這老漢百劫千生磨煉得來你看他一時發露英氣逼人若到衲僧分上也只是箇石火電光底影子說甚天上天下惟我獨尊耶雖然如是將此身心奉塵剎是則名為報佛恩舉雪峰住菴有一僧到峰見以手托菴門放身出云是什麼僧亦云是什麼峰低頭歸菴其僧後至巖頭頭云雪老有何言句僧舉前話頭云雪峰道什麼僧云雪峰無語頭云噫我悔不當初向伊道有箇末後句我若向伊道已後天下人不奈雪峰何僧至夏末舉此話請益頭云汝何不早問僧云不敢造次頭云我與雪峰同條生不與雪峰同條死要識末後句只這是師云雪峰自是一員老將這僧何堪抵敵泛泛流到巖頭依稀又納敗闕至今還曾識得末後句麼良久云會中若有仙陀客好向人前唱鷓鴣舉疏山示眾云病僧咸通年已前會得法身邊事咸通年已後會得法身向上事雲門出問云如何是法身邊事山云枯樁門云如何是法身向上事山云非枯樁門云還許學人說道理也無山云許門云只如枯樁豈不是明法身邊事山云是門云非枯樁豈不是明法身向上事山云是門云未審法身該一切也無山云法身周遍爭得不該門指淨瓶云還有法身也無山云莫向淨瓶邊覓門諾諾師云疏山恰似引敵入寨雲門單鎗直入不顧危亡可謂猛虎口中奪肉者也疏山若無後語幾乎勞而無功老僧今日不問諸人法身向上事法身邊道將一句來看咦洎合停囚長智舉天如和尚示眾云雲門道東海鯉魚打一棒雨似盆傾意作麼生各請下一轉語看良久自代云東海鯉魚打一棒雨似盆傾師云天如老人恰似抱樁搖櫓且道天隱又如何泥牛流出血木馬走如煙舉覺範云山中何所有嶺上多白雲只可自怡悅不堪持贈君師呵呵大笑云覺範老人謾人則得謾磬山未在且道白雲是誰家私物往來者皆可著眼以拂子點雲云看看舉天如和尚示眾云生死事大諸禪德須是將生死兩字貼在額頭上始得有僧出云某甲不然只將不生不死四字貼在額頭上如召眾云這漢元來怕生死如何會得老漢禪遂拈拄杖趁出師云怕生死底獅子林門下不容不怕生死底龍池山門下不容且道古人底是老僧底是諸禪德也須簡點不可放過倘有云怕生死即不怕生死底不怕生死即怕生死底師喝云這儱侗漢出去舉趙州問僧甚處來云雪峰來州云雪峰有何言句示徒僧云雪峰道盡大地是沙門一隻眼汝諸人向什麼處屙州云汝若過嶺我附箇鍬子去明覺云這僧既不從雪峰來可惜趙州鍬子師云這僧明明道雪峰來明覺何故云不從雪峰來有箇什麼道理試說看舉臨濟示眾云有一無位真人常在汝等面門出入未證據者看看時有僧問如何是無位真人濟下禪床擒住云道道僧擬議濟托開云無位真人是甚麼乾屎橛師云臨濟善用太阿殺活臨時不妨奇特這僧擬向虎口裏奪食幾乎喪身失命喜得雪峰和尚聞云臨濟大似白拈賊救得一半不見明覺老人云夫善竊者鬼神莫測既被雪峰覷破臨濟不是好手復召眾云雪竇今日換你諸人眼了也你