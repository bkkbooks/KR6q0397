便打僧云某甲話也未問和尚因甚打某甲山云汝是甚處人云新羅人山云未跨船舷好與三十棒法眼云大小德山話作兩橛圓明云大小德山龍頭蛇尾師別云德山老漢實有定乾坤手段卻被二尊宿錯下名言了也且道什麼處是話作兩橛龍頭蛇尾直饒恁麼見得分明也好與三十棒舉雪峰在國清拈起缽盂問座主道得與你缽盂主云此是化佛邊事峰云你作座主奴也未得主云某甲不會峰云你問我我與你道座主方禮拜峰便踏倒後主舉似雲門云某得七年方見門云你得七年方見云是師別云雲門雖則作略高古何得如此磬山則不然待伊道七年方見攔頭一拄杖你見箇什麼來雖然如是要識磬山則易要識雲門則難舉僧問雪峰拈搥豎拂不當宗乘未審和尚如何峰豎起拂子僧乃抱頭出去峰不顧法眼代云大眾看此一員戰將師別云老僧則不然待他抱頭出去高聲叫云草賊大敗舉鏡清訪先曹山山問甚麼處來清云昨日離明水山云甚麼時到明水清云和尚到時山云汝道我甚時到清云適來猶記得山云如是如是師別云曹山只管憐民不能盡法磬山則不然待伊道適來猶記得劈脊便棒舉有老宿畜一童子並不知軌則有一行腳僧到乃教童子禮儀晚間見老宿外歸遂去問訊老宿怪訝遂問云阿誰教你童云堂中上座老宿喚其僧來問上座傍家行腳是甚麼心行童子養來三二年了幸是可憐生上座教壞伊快束裝去黃昏雨淋淋地被趁出師別云某甲教壞童子某甲應當出院和尚教壞某甲和尚合作麼生雖然即今還有恁麼行腳僧山僧與彼問訊舉僧問螺峰如何是本來人峰云惆悵松蘿境界危師別云螺峰老人酬機甚是奇特能令這僧見得本來人也未設若有人問磬山如何是本來人但云我與汝道即不本來也舉僧問咸澤禪師不與萬法為侶者是甚麼人澤云城中青史樓雲外高峰塔師別云今日有人問老僧則不恁麼道獨步孤峰月閒聽幽澗琴舉太傅王延彬居士到招慶煎茶朗上座與明招把銚忽翻茶銚公問茶爐下是甚麼朗云捧爐神公云既是捧爐神為甚麼翻卻茶朗云事官千日失在一朝公拂袖便出師別云朗上座恁麼道可謂當面蹉過何不道重命輕財明招云朗上座喫招慶飯了卻向外邊打野榸師云也是賊過後張弓朗云上座作麼生師云更納什麼敗闕招云非人得其便師云也救不得一半舉僧參睦州州問汝豈不是行腳僧云是州云禮佛也未云禮那土堆作麼州云自領出去師別云山僧即不然待伊道是即云這掠虛漢行甚麼驢腳馬腳出去可不免聞後語舉僧問興教禪師盈龍宮溢海藏真詮即不問如何是教外別傳底法教云眼裏耳裏鼻裏云祇此便是否教云是甚麼僧便喝師別云山僧若作興教見伊喝將來闍黎緩緩地喝即不無還我眼耳鼻裏底來看伊眼目定動震聲一喝可不先以定動後以智拔而今有人問如何是教外別傳底法總不恁麼對他道風送水聲來枕畔月移山影到床前舉棗樹和尚問僧發足甚處云閩中樹云俊哉云謝師指示樹云屈哉僧作禮樹云我與麼道落在甚麼處僧無語樹云彼自無瘡勿傷之也師別云棗樹老人雖慈悲太切可惜勞而無功磬山則不然待伊云閩中便道多少途程到這裏看伊有著落方可云俊哉及至作禮云我與麼道落在甚麼處恰使這僧不能轉身吐氣又云彼自無瘡勿傷之也可不雪上加霜雖然山僧與麼道又落在甚麼處遂顧視左右云亦是勞而無功也屈哉舉龍濟禪師上堂卷簾除卻障閉戶生窒礙秖這障與礙古今無人會會得是障礙不會不自在師別云這老漢無繩自縛會與不會一時拈卻又作麼生良久云延平劍已成龍去猶有刻舟求底人舉溈山坐次仰山入來溈以兩手相交示之仰作女人拜溈云如是如是師別云溈山憐兒不覺醜山僧則不然待伊拜起來放下手時看他如何合殺舉法華全禪師上堂鐘鳴鼓響鵲噪鴉鳴為汝諸人說般若講涅槃了也諸人還信得及麼若信得及觀音菩薩向諸人面前作大神通若信不及卻往他方救苦利生去也師別云山僧則不然若信不及依舊鐘聲鼓響鵲噪鴉鳴何故豈不聞法華是法住法位世間相常住舉廓侍者問德山從上諸聖向甚麼處去山云作麼作麼廓云敕點飛龍馬跛鱉出頭來山便休去師別云何不道俊哉來日浴出廓過茶與山山於背上拊一下云昨日公案作麼生云這老漢今日方始瞥地山又休去師別云瞎漢智過於師方堪傳授舉瑞鹿禪師上堂鑑中形影惟憑鑑光顯現你等諸人所作一切事惟憑箇甚麼顯現還知得麼若也知得於參學中千足萬足無事莫立師別云若也知得正好著力咦舉僧問曹山世間甚麼物最貴山云死貓頭最貴云為甚麼死貓頭最貴山云無人著價師別云既無人著價道甚麼貴賤舉同安禪師僧問如何是和尚家風安云金雞抱子歸霄漢玉兔懷胎入翠微云忽遇客來將何秪待安云金果朝來猿摘去黃花晚後鳳啣歸師別云或問山僧如何是和尚家風只對他道雲耕雨種客來如何秖待云粗茶淡飯且道與古人相去多少舉石門蘊禪師在青林作園頭一日歸侍立次林云子今日作甚麼來云種菜來林云遍界是佛身子向甚麼處種云金鉏不動土靈苗在處生林欣然來日入園喚蘊闍黎石應諾林云剩栽無影樹留與後人看石云若是無影樹豈受栽耶林云不受栽且止你曾見他枝葉麼云不曾見林云既不曾見爭知不受栽云秖為不曾見所以不受栽林云如是如是師別云若見已受栽也舉盤山云心月孤圓光吞萬象光非照境境亦非存光境俱亡復是何物洞山云光境未亡復是何物師別云光境現在復是何物舉僧問投子一大藏教還有奇特事也無子云演出大藏教又老宿云演入大藏教妙喜云演出演入則不無二老若是奇特事三生六十劫也未夢見在師別云妙喜恁麼道甚是知音作家作家且道奇特事在教內在教外舉雲門問直歲今日作甚麼來歲云刈茅來門云刈得幾箇祖師歲云三百箇門云朝打三千暮打八百東家杓柄長西家杓柄短作麼生歲無語門拈拄杖便打徑山和尚云直歲無語自有三百箇祖師證明雲門令雖行要且棒頭無眼師別云幸是無眼若是有眼待直歲道三百箇便打何待後來一落索舉道吾示眾云高不在絕頂富不在福嚴樂不在天堂苦不在地獄相識滿天下知心能幾人佛日道高在絕頂富在福嚴樂在天堂苦在地獄誰知席帽下元是昔愁人師別云磬山則不然高則從他高富則從他富樂則從他樂苦則從他苦數聲清磬是非外一箇閒人天地間舉盤山和尚道似地擎山不知山之孤峻如石含玉不知玉之無瑕若能如是是真出家育王云若能如是捏目空花師別云老僧即不然若能如是雪裏梅花舉天池隆禪師在金峰普請搬柴次峰問搬柴人過水不隆云有一人不過水云不過水還搬柴不隆云雖不搬柴也不得動著他師別云雖則搬柴也不得動著他舉千巖和尚示眾云僧問趙州大地無塵掃箇甚麼州云掃外來底若是無明秖向他道掃裏頭底大眾趙州底是無明底是師別云既是一物也無說甚麼內外直饒非內非外一齊掃卻還有掃柄在舉趙州上堂良久云大眾總來也未對云總來也州云更待一人來即說話僧云候無人來即說似和尚州云大難得人師別云古人恁麼垂慈方便不少老僧不然汝等總在這裏箇箇是英靈衲子更待誰來喝一喝舉雲門因僧問如何是諸佛出身處門云東山水上行又客問本師幻有老人如何是諸佛出身處云西河火裏坐師別云有人問磬山如何是諸佛出身處即向他道雲起長空水歸大海舉南泉送黃蘗出至門泉云如許大身材戴椰子大笠子蘗云三千大千世界總在裏許泉云王老師聻蘗戴笠子便行師別云王老師當時可不屈己從人磬山若作王老師只道恁麼闍黎卻被笠子蓋覆了也待他戴笠子行時又云恰是舉佛眼禪師示眾云廣額屠兒手中屠刀如何放下自代云不須放下師別云待你成佛後即向你道又云面前是甚麼自代云無物師別云青山綠水舉興化謂克賓維那云汝不久為唱導之師賓云不入這保社化云汝會了不入不會不入賓云總不恁麼化便打云克賓維那法戰不勝罰錢五貫設饡飯一堂來日興化自白槌云克賓維那法戰不勝罰錢五貫設饡飯一堂仍須出院雲居舜和尚云大冶精金應無變色其奈興化令行太嚴不是克賓維那也大難承當總似而今泛泛之徒翻轉面皮多少時也妙喜老人云雲居恁麼道未免拗曲作直徑山即不然要作臨濟炟赫兒孫直須翻轉面皮始得師別云二大老一人高高山頂行一人深深海底走磬山則不然有智主人二俱不受且道即今還有人代得克賓維那一轉語麼若有不惟與興化出氣亦乃光耀磬山可不覓火和煙得擔泉帶月歸舉罽賓國王仗劍問師子尊者云師得蘊空不尊者云已得蘊空王云脫生死不尊者云已脫生死王云可施我頭尊者云身非我有豈況於頭王遂斬之白乳丈餘王臂自落雪竇云作家君王天然猶在黃龍新和尚云孟八郎漢又恁麼去也師別云三人中有一人可以為師雖然如是磬山則不然秪許罽賓國王得大用未得大體在舉德山到溈山挾複子直上法堂從西過東從東過西顧視云無無便出至門首卻云也不得草草便具威儀再入相見溈山坐次德山提起坐具云和尚溈山擬取拂子德山便喝拂袖而出背卻法堂著草鞋便行溈山至晚問首座適來新到在甚處首座云背卻法堂著草鞋去也溈云此子已後向孤峰頂上盤結草庵呵佛罵祖去在妙喜云二尊宿恁麼相見每人失卻一隻眼師別云妙喜老人恁麼道還具眼也未若道具眼二尊宿那裏失卻一隻眼處若道不具眼他怎恁麼道這裏若緇素分明許你具一隻眼雖然磬山恁麼道也失卻一隻眼咄
