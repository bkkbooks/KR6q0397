body:
  text: 嗣法門人通問等編頌古舉世尊睹明星頌云寥寥獨坐雪巖中秖為衆生界未空忽地明星都照破丈夫誰肯受朦朧舉世尊拈花迦葉微笑頌云大事因緣在目前當機休更自顢頇靈山百萬人天衆擬議之間落二三四十九年無一字末後拈花有底事都緣飲老破微顏代代兒孫笑不止舉楞嚴經若能轉物即同如來頌云若能轉物即如來雪裏梅花一色開冷眼不堪長笑玩香風暗暗到經臺舉圓覺經居一切時不起妄念於諸妄心亦不息滅住妄想境不加了知於無了知不辨真實頌云山堂寂寂無人到澗水悠悠有琴操偶然曳杖過磐峰一陳狂風吹落帽吹落帽呵呵笑漢語胡言那成調師驀卓拄杖喝一喝云參舉善財參彌勒樓閣門開頌云衣帶煙霞過碧層暫時斂念便空生重重樓閣門開處更有一人參未曾舉外道不問有言不問無言頌云一條拄杖兩頭拏把住中間便打他饒你脫然頃快去看來猶著眼中沙舉殃崛摩羅産難頌云煙雲封古洞迷卻乍遊人借問三家老春光分半燈舉傅大士披衲頂冠靸履見梁武帝頌云冠似道兮履似儒袈裟猶是佛家兒了然三處原無我試問時人會也無舉迦葉因阿難問世尊傳金襴外別傳何物迦葉召阿難難應諾迦葉云倒卻門前剎竿著頌云拈花消息金襴外慶喜當年見未玄莫是頭陀堪愛處依稀爭肯畀家傳舉初祖面壁頌云大鵬放翮九萬里偃鼠飲河半勺水直自培風背負天沙界明明不用舉舉四祖住破頭山頌云鳳書三詔懶抬眸兀坐雲深破嶺頭待得黃梅童子到月明依舊照寒湫舉四祖路逢童子問子何姓頌云白髮頭陀下翠微七年重到未忘機性空姓姓非常姓千古令人作範軌舉四祖訪懶融頌云石室耽幽處山禽頻獻花天廚勤送供虎穴作鄰家懸寂心偏解菩提路更賒幸逢達道者推轉白牛車舉鳥窠吹布毛通侍者大悟頌云樹盤如蓋遂棲禪宮使從師未徹玄擬欲諸方去參學布毛拈起鼻先穿一毫端上露全機及至惺惺鴈過西未舉已前親薦得白雲終不定巢居舉馬祖打車打牛頌云不是車兮不是牛即心即佛莫他求從茲悟徹磨磚意喝下西江水倒流舉馬祖即心是佛又云非心非佛頌云即心即佛頭戴帽非心非佛帽戴頭撒手到家人不會龔公峰頂鬧啾啾舉馬祖日面佛月面佛頌云日面佛明歷歷火雲收盡天空闊月面佛清徹徹秋水澄潭光皎潔君不見雙輪無住兮太虛焰焰玄珠罔象兮赤心片片咦舉馬祖百丈遊山見野鴨頌云師資間步到溪邊大用全提把住關直得鼻端親見血倚天長劍插雄巔舉馬祖升座百丈捲席頌云高崖獅子振全威百獸聞之腦裂時不是象王回首顧爭教大地吼如雷舉百丈再參頌云入門便喝有來源秉拂從教得此傳識得祖家綿密旨大唐規範自悠然舉馬祖一喝百丈三日耳聾黃檗吐舌頌云鐵牛機印印全機電卷風馳未可欺一喝頓令知解盡耳聾三日古今疑黃檗老謾驚噓舌頭吐出更堪奇因而領略師承意惹得兒孫捋虎鬚舉百丈野狐頌云前百丈後百丈兩箇老胡鼻一樣不落不昧叵商量且看眉毛在眼上咄舉唐文宗食蛤蜊見大士像頌云夫慈悲之故化凡形而成聖像落草之談現應身以獲圓通良哉觀世音善應諸方所噫不是大唐天子力海水煎枯擘不開舉南泉刈茅僧問南泉路向什麼處去泉拈起鐮云我這鐮子是三十文錢買僧云我不問這箇南泉路向什麼處去泉云我用得最快頌云行色憧憧問路頭大人機用出常流而今睹面重拈出三十文錢第二籌舉陸亙大夫問南泉天地同根萬物一體頌云天地同根物一體潛龍臥在深淵裏豁然飛上九重霄一任興雲彌布雨舉陸亙大夫問南泉大悲菩薩用許多手眼作什麼泉云如國家用大夫作什麼頌云大悲千手眼幾人能得見如月印千江波波全體現全體現有何驗王老機鋒過閃電當頭一拶賓主分聊與大夫通一線通一線難分辨言中有則君自看舉盤山示衆三界無法何處求心四大本空佛依何住璿璣不動寂爾無言睹面相呈更無餘事頌云三界無法何處求心林間獨坐樹上啼鶯啼得落花流水去依然緘口過殘春舉泐潭問馬祖如何是祖師西來意祖云低聲近前潭近前祖打一摑云六耳不同謀來日來潭至來日云請和尚道祖云且去待老漢上堂時出來與汝證明潭乃悟云謝大衆證明繞座一匝便去頌云六月炎天雪滿巔那知身到清涼山文殊舉手金剛窟收取玻璃盞子還舉嵩山與龐居士喫茶士舉橐子云人人盡有分為甚麼道不得山云秖為人人盡有分所以道不得云阿兄為甚麼卻道得山云不可無言也云灼然灼然山便喫茶士云阿兄喫茶為甚麼不揖客山云誰云龐公山云何須更揖後丹霞聞乃云若不是嵩山幾被老翁惑亂一上士聞之乃令人傳語霞云何不會取未舉橐子時頌云未舉以前猶鈍置衲僧何必重徵問七盞清風腋下生啜著還他能徹困舉龐居士訪仰山問久嚮仰山到來為甚麼卻覆山豎起拂子士云恰是山云是仰是覆士乃打露柱云雖然無人也要露柱證明山擲拂子云若到諸方一任舉似頌云步步傾湫倒嶽來軒轅高挂絶塵埃得人一牛還一馬不是時流孟浪猜舉凌行婆問浮杯盡力道不得句頌云婆子奇哉怪哭聲禪人聞舉便驚心當機直捷離言處到底終輸趙老清清真漫將間話論疏親行婆不是丈夫手肯把拳頭買與人咄這老婆子舉藥山指二樹問道吾云枯者是榮者是吾云榮者是山云灼然一切處光明爍爛去又問雲巖巖云枯者是山云灼然一切處放教枯淡去高沙彌至山復問高云枯者從他枯榮者從他榮山顧道吾雲巖云不是不是頌云榮者榮兮枯者枯沙彌爭肯受糊塗長松壁立危巖上鶴唳一聲千載孤舉韓文公問大顛佛法省要頌云文公諦信大顛直捷快手三平腦後著楔一楔頂𩕳眼豁開普天匝地絶塵埃孤風冷冷千秋外幾度心花照玉臺舉長沙岑禪師遊山歸首座問和尚甚處去來岑云遊山來座云到什麼處岑云始從芳草去又逐落花回座云大似春意岑云也勝秋露滴芙渠頌云理策入雲深山空一色新無人間共話有鳥對頻吟踏遍春芳草歸來花滿庭若將時節會埋沒祖師心舉趙州火爐頭無賓主話頌云無賓主話誰能舉舉得分明我未許觀音院裏老趙州慣向人前賣口嘴舉趙州狗子無佛性頌云一箇無字周沙界蠢動含靈俱不壞拈來擲向於人前不會分明業識在舉趙州有佛處不得住無佛處急走過頌云有佛處不得住挂角羚羊無影樹無佛處急走過高飛野鶴青霄去三千里外莫錯舉石女懷胎唯自許恁麼則不去也摘楊花摘楊花㗭唎㗭唎囌嚕娑訶舉趙州因尼問密密意頌云密密意誰能識潦倒趙州親掐出爭奈行人未作家翻身跳入煙蘿窟舉趙州庭前柏樹子頌云不將境示人分明直對君庭前柏樹子千古客乘陰舉趙州勘破婆子頌云臺山一路甚崎嶇多少行人舉步迷癭袋老婆機慣得趙州明眼那能知舉趙州東門西門南門北門頌云南北東西到處通腳跟點地任君從相逢不解舊相識眼裏無筋一世窮舉趙州問投子大死底人卻活時如何子云不許夜行投明須到頌云不許夜行投明須到八十翁翁入場屋真誠不是小兒嬉看他多少風流弟脫卻羅衫換紫衣舉趙州一日方丈內聞沙彌喝參州向侍者云教伊去侍者才教去沙彌便珍重州向傍僧云沙彌得入門侍者在門外頌云一抑一揚真自在高提正令不須謀權衡輕重雖憑手出格男兒豈上鉤舉趙州一日雪中倒叫云相救有僧去身邊臥州便起去頌云傾身一色驗龍蛇此際誰知眼裏花起倒同人不同用至今消息遍天涯舉龍濟具足凡夫法凡夫不知具足聖人法聖人不會聖人若會即是凡夫凡夫若知即是聖人頌云凡聖情超當下機石人舉步笑嬉嬉暗中踏著珊瑚影秖許惺惺不許知舉臨濟問黃檗佛法的的大意頌云黃檗山頭瑣霧雲高安灘裏怒雷轟猛然醒得無多子棒喝交馳閃電奔祖令全提發大機普賢到此也難知可憐多少效顰者鷃翅焉能萬里飛舉臨濟建立黃檗宗旨頌云毒氣受深當以發直饒龍象也攢眉至今餘毒藏幽壑不待聲揚動地雷喝一喝莫些遲宗旨何曾棒上疑這裏若還親薦得濟翁元是小廝兒舉臨濟兩堂首座齊喝頌云兩箇泥牛驀鬥一箇木童難救牽動金剛主人鐵鞭只打童手咄若會直下分明不會依然落後舉臨濟在僧堂裏睡黃檗入堂見以拄杖打板頭一下濟舉首見是檗卻又睡檗又打板頭一下卻往上間見首座坐禪乃云下間後生卻坐禪汝在這裏妄想作麼座云這老漢作甚麼檗又打板頭一下便出頌云一樹花開幾樣紅佳人漫採月明中可憐會得枝頭意吹落巖前一陳風一陳風便不同箇中端的有魚龍試看今日堂中事那箇男兒徹骨窮舉臨濟問寺主甚處去來主云州中糶黃米去來濟以拄杖畫一畫云還糶得這箇麼主便喝濟便打次典座至濟舉似典座座云寺主不會和尚意濟云你又作麼生座禮拜濟亦打頌云移花接木點鐵成金白拈手段箇裏分明雖然不遇英靈漢千古留傳一片心舉臨濟將入滅謂三聖不得滅卻正法眼藏頌云一喝乾坤倒覆來正宗從此瞎驢開吹毛寶劍當頭截鐵眼銅睛尚皺眉舉德山見僧入門便棒頌云從來門裏大那見有天下不是老婆心膽是虛空大你若識痛癢且教終不怕切忌絶商量管取悟言下舉臨濟見僧入門便喝頌云好把琵琶月下彈清音透徹萬重山行人響慕親來聽奈是無絃曲調難四喝從教一喝來英靈到此也疑猜頂門豁達通天眼八臂那吒亦著呆舉普化明頭打暗頭打頌云打風打雨在當人百匝千重用得親崖上老人驀下劄令伊別示一乾坤舉德山托鉢因緣頌云老漢當年不耐飢鐘鳴鼓響有何疑古今多少英靈子只向巖頭問是非末後句更為奇眼上重栽兩道眉聽得虛空親説破消融頓入不思議舉興化見同參來才上法堂化便喝僧亦喝化又喝僧亦喝化近前拈棒僧又喝化云你看這瞎漢猶作主在僧擬議化直打出法堂侍僧問適來這僧有何相觸忤化云是他適來也有權也有實也有照也有用我將手向伊面前橫兩遭到這裏卻去不得似這般瞎漢不打更待何時頌云同條生不同條死坐斷乾坤誰似你當陽一著主賓分官不容針私通爾何不當時待侍僧復喝還他臨濟旨舉南院赤肉團上壁立千仞頌云一縱一擒真壁立從他猛將也歸降正宗不得獅子兒遍界狐狼滿地走舉興化示衆若是作家戰將便請單刀直入更莫如何若何時旻德出禮拜起便喝化亦喝旻又喝化亦喝旻禮拜歸衆化云適來若是別人三十棒一棒也較不得何故為他旻德會一喝不作一喝用頌云作家相見事如何電捲風馳海嶽過霹靂一聲雲散盡大家齊唱太平歌全放全收殺活機大人作略普賢知禹門三級曾經過萬浪千波更不疑舉僧問興化四方八面頌云文武全才得建功交鋒陳陳自從容因伊義敵威光遠報國酬恩盡在忠舉保壽開堂三聖推出一僧頌云大開爐鞴聖凡鎔一棒當頭便建宗獅子擲機全體露象王行處絶狐蹤獅子嚬呻獅子酬爪牙不露已風流電光影裏全身現收拾絲綸謾下鉤舉玄紹二上座見烏臼頌云老將當場猛作威英雄到此也踟躇宗師眼目天然在照用同時説向誰舉崔禪在定州州衙內升座拈拄杖云出來也打不出來也打有僧出云崔禪聻崔禪擲下拄杖云久立太尉珍重頌云正令全提殺活機隨家豐儉有誰知親言已出親人口卻被旁人冷眼窺末後句更為奇太尉還曾識得伊咄舉溈山五峰雲巖侍百丈丈問併卻咽喉唇吻頌云軒轅寶鏡已當臺妍醜分兮有自來莫道老人言語贅兒孫眼上要眉栽舉丹霞訪忠國師頌云茅堂深鎖弗輕敲叵耐山童漏泄訛短笛無腔信口出遭