海幾曾翻卻釣魚舟意綢繆彼此相看天色秋白棒臨頭如雨點賞罰分明得自由舉雪峰問僧名什麼僧云玄機峰云日織多少僧云寸絲不挂峰云參堂去僧才行三五步峰云袈裟落地也僧回首峰便打頌云象骨山前執釣竿洪波浩渺坐危磐垂絲千尺鉤頭意衝浪鯨鯢吐氣寬著餌也謾相看誰料於中失照觀玄機到此成何用千古令人喪膽寒舉靈雲見桃花頌云山桃歲歲自開花笑倒靈雲老作家一見春風生滿面須知林外有玄沙舉俱胝住菴因天龍豎指遂大悟頌云三問無酬意太高繞師匝匝不相饒俱胝未會天龍指爭得當時善用刀舉清平參翠微問如何是西來的的意微云待無人向汝説良久云無人也請和尚説微下禪床引入竹園又云無人也請和尚説微指竹云這竿得恁麼長那竿得恁麼短後出住大通舉初見翠微因緣謂衆云先師入泥入水為我自是我不識好惡頌云翠微林下緑竿竿指出清平仔細看未會西來的的意得無人處被他謾領略得更何堪猶向人前擊灸瘢雲散一輪天淨月夜深依舊照闌干舉僧問投子如何是露地白牛子云叱叱飲噉何物子云喫喫頌云玉角霜毛露地牛崑崙山頂驀騎頭人間天上絶蹤迹分付時人把索收舉僧問投子曹溪指月靈山話月如何是真月子云昨夜三更轉向西頌云昨夜三更轉向西明中有暗幾人知不須撈摝澄潭影一道寒光塞太虛舉洞山問雲巖無情説法頌云水鳥樹林皆念法有情孰不解堪聞沉淪萬劫忽開悟物物頭頭本現成舉僧問曹山雪覆千山為甚麼孤峰不白山云須知有異中異云如何是異中異山云不墮諸山色頌云突突兀兀玲玲瓏瓏類而弗類齊而弗齊孤巍插向青霄外五嶽從教立下風舉鏡清問曹山清虛之理畢竟無身時如何山云理即如此事作麼生云如理如事山云謾曹山一人即得爭奈諸聖眼何云若無諸聖眼爭鑑得箇不恁麼山云官不容針私通車馬頌云一片寥寥獻與君誰知箇裏不容針目前法法無餘事把住牢關要見清識得一始相親須教極盡今時去大地山河作眼睛舉夾山參船子頌云一橈打入洪波裏翻然吞得鉤頭餌離鉤三寸道將來不是尋常播皮嘴收拾絲綸得意歸藏身處也無窮底無窮底覆卻舟兮不是你舉洛浦見夾山頌云搖頭擺尾出重淵浩浩江湖心景寬夾嶺雲深藏古路清溪月朗照當天休草草更綿綿無舌人傳語最玄探取垂鉤千尺意飄飄一曲浪頭眠舉玄沙指僧聞偃溪水聲頌云從門入者無退失偃溪水聲清滴滴乍到叢林人返聞一條徑路通霄徹通霄徹四海波騰聲未息清風明月共知音笑殺大悲思修得舉太原孚上座問鼓山父母未生時鼻孔在甚麼處山云如今生也在什麼處孚不肯山卻問老兄作麼生孚以扇默置山罔測孚乃毆一拳頌云父母未生前鼻孔屈半邊若人親見得不值一文錢鼓山機截而未圓孚公力勇而鮮健尋幽卻到窮源處搖落桃花三五片舉法眼指簾頌云簾外春光匝地來主人敷坐笑顏開無心指出家常事殺活從教仔細猜舉瑞巖喚主人公頌云捏殺猢猻子養純水牯牛老人親切處豈比泛常流舉風穴杖林山下竹筋鞭頌云杖林山下竹筋鞭信手拈來用得鮮驚起鐵牛無住處踏破山河露地眠舉僧問匡化如何是佛法大意化云貧兒抱子渡恩愛競隨流頌云赤條條地過洪波到此恩情沒奈何不是貧兒偏愛子直饒拋棄更猶多舉智門問五祖戒云暑往寒來則不問林下相逢事若何祖云五鳳樓前聽玉漏門云爭奈主山高案山低祖云須彌頂上擊金鐘頌云嘉州大象陝府鐵牛一衝一撞半放半收交鋒陳陳兮風雷磊磊落落兮天倪長空月色無高下箇裏相逢作者稀舉南臺一寸龜毛重九斤頌云一寸龜毛重九斤南臺出語便驚人黃河攪得澄清徹玉兔懷胎水底明舉首山竹篦子頌云新婦懶梳粧婆婆喚上堂不知天已曉羞見入蘭房舉僧問首山一切諸佛皆從此經出如何是此經山云低聲低聲云如何受持山云切不得染汙頌云一道寒光耀古今箇中那許著纖塵五千餘卷非文字諸佛何曾出此經舉僧問首山學人久處沉迷請師一接山云老僧無這間工夫云和尚豈無方便山云要行即行要坐即坐頌云輪劫何嘗著眼看擬思量處隔重山誰知這箇間家具東擲西拋不直錢舉首山新婦騎驢阿家牽頌云北地煙塵穢滿天風流全在玉樓前阿家憐媳牽驢走行到堂前不用鞭舉汾陽青絹扇子足風涼頌云信手輕搖徹骨涼清風不在扇頭揚鹽官侍者無分曉把柄無能作主張舉僧問白馬如何是清淨法身云井底蝦蟆吞卻月頌云法身清淨廣無邊井底蝦蟆吞月眠汲水木童鼓掌笑笑看水底一般天舉泐潭室中問僧唯一堅密身一切塵中現如何是塵中現底身師著語云胡張三黑李四僧指香爐云這箇是香爐潭云帶纍三世諸佛生陷地獄師著語云泐潭聻僧罔措潭便打師著語云屈屈復云諸人還救得三世諸佛麼若救不得如何脫離生死速道速道頌云張公喫酒李公醉纍他東村王大妹橫拖八幅紫羅裙走入西村者一隊三世諸佛立地看覓箇衆生了不得元來都是堅密身擬議之間百雜啐咄舉僧問南嶽如何是不涉煙波底句嶽云皎皎寒松月飄飄谷口風僧云萬差俱掃蕩一句截然機嶽云點僧云到嶽云借人面具舞三臺頌云行鳥道兮絶高低倚寒巖兮截然巍風飄飄兮露全機把住關兮真箇希灼然希尤更奇從教三級透重關老龍不肯糊糢放未免遭伊額上題舉僧問華嚴大悟底人為甚麼卻迷嚴云破鏡不重照落花難上枝頌云水歸大海顯全潮終日風波海上消能納百川流不住魚龍喜躍見波濤舉僧問慈明鬧中取靜時如何明云頭枕布袋頌云鬧中取靜猶未徹困布袋枕頭那事有分騎牛更去覓牛蹤撞著山僧好一頓舉楊岐栗棘蓬作麼生吞金剛圈作麼生跳頌云銅頭鐵額入岐峰跳得金剛吞得蓬眼裏直須拔出楔從他事事以藏鋒舉僧問楊岐馬祖見讓師便悟去且道迷卻在什麼處岐云要悟即易要迷即難頌云要悟即易要迷難擬思量處隔千山茫茫宇宙人無數幾箇英靈過此關舉楊岐問僧雲深路僻高步何來云天無四壁岐云踏破多少草鞋僧便喝岐云一喝兩喝又作麼生云你看這老和尚岐云拄杖不在且坐喫茶頌云白雲深處探來機透過重關路不迷一喝頓超言象外謾留茶話少人知舉黃龍三關頌云我手何似佛手展開雲暗星斗更若擬議商量劈面攔腮一肘我腳何似驢腳收來伸去踏著踏翻海底泥牛一任魚龍摸索人人有箇生緣喫飯穿衣打眠騎著三腳驢子直入千山萬山舉白雲端上堂舉一則公案布施大衆良久云口秖堪喫飯頌云這則舊公案飢來便喫飯你自不承當我復重舉看看看喫飽自然忘百飢巖前溪水緑依依洗鉢歸來穩坐好一念萬年終不違舉雪竇示衆云譬如世界壞時大水競作其間無量衆生或沒未沒互相悲號仰望蒼蒼皆云相救當是之時四禪天神一見高聲便喝咄哉衆生我預曾報汝令頻頻上來汝卻不聽如今有什麼救處乃拍手云歸堂頌云長空浩渺浸山川無量含靈墮此淵拍手洞然歸得去無勞再上四禪天舉天衣懷上堂云鴈過長空影沉寒水鴈無遺迹之意水無留影之心若能如是方解異類中行頌云異類中行孰敢當夜來猛虎角生長鴈高影落秋江上惹得盲龜笑一場舉前寶壽問後寶壽父母未生已前那箇是本來面目後寶壽罔措一日在市見二人相爭有一人相勸云你得恁麼無面目壽遂大悟頌云一拳突出本來面碧眼胡僧難覷見桃紅柳緑故園春總是大悲千手眼舉茶陵郁山主渡橋遭攧大悟頌云百尺竿頭未肯休橋梁踏斷始知羞吟風笑月茶川上間看巖花逐水流舉大通智勝佛十劫坐道場頌云隨處安禪經數劫肯將佛法輕漏泄面前腦後錯承當好似癡人撈水月舉婆子燒菴頌云大用現前無罣礙寂然不動豈為功誰能觸著山僧體一喝還他兩耳聾體大偉哉寂滅體難把虛空比虛空尚可窺此心無下嘴相大妙哉諸有相本無名與狀名狀起於心心寂等無量用大奇哉不思用處處曾無著是箇無手人打得虛空落
