body:
  text: 嗣法門人通問等編普說衆請釋疑告香普說師卓拄杖云法門衰替賴人扶那箇男兒不丈夫勿學承虛接響漢他年決上祖師圖大衆還知麼佛佛授受祖祖傳持以心印心心心不異所以古人行腳單為此事費盡草鞋跋涉溪山千里萬里參師訪友發明本分然後覓深林歸大壑潛身養道俟其因緣時至龍天推出說法利生用報四恩豈求名聞利養取誚當世耶適才告香僧問世尊拈花單傳直指祖師提印分派接人謂是一耶謂是二耶老僧豎起拄杖卓下云且道是一是二僧云既然如是今古昭然何得分三分一老僧云虛空裏釘橛僧云若三一不存教學人何處著腳老僧云切莫隨人腳跟僧云三峰執三去一又作麼生老僧云你且領話他便禮拜噫今人不達黃面老子直下的的相承之旨著意穿鑿破壞綱宗上誣先覺下賺後昆異論紛然見笑識者若不究其根源考其虛實以訛傳訛則熒惑無窮矣吾為此懼不得不力救之以啓將來眼目故復問中略見一斑他尚不知非更向人前揚其底蘊謂三玄三要從釋迦老子三法而來睹星為心觀樹為法十方佛讚歎為師夫華嚴經云一時佛在摩竭提國阿蘭若法菩提場中始成正覺七處九會大唱真乘無法不周無機不備當時二乘在座有耳不聞圓頓教有眼不見舍那身於此脫珍御服著敝垢衣示生王宮出家雪山苦行六載歎曰一切衆生皆具如來智慧德相但以妄想執著不能證得至於法華會上云我始坐道場觀樹亦經行於三七日中思惟如是事我所得智慧微妙最第一衆生諸根鈍著樂癡所盲如斯之等類云何而可度世尊述成道之初但說一乘法念衆生沒於苦海所以權設三乘引導衆生作是思惟時十方佛皆現乃助揚法化也可見釋迦老子明心得法已久他著在化跡門頭經文尚不明而況佛旨乎又經云善男子我實成佛已來無量無邊百千萬億那由他劫於是中間我說然燈佛等又復言其入於涅槃如是皆以方便分別豈可以星為心以樹為法以十方佛為師耶又不見金剛經云若有法如來得阿耨多羅三藐三菩提者然燈佛即不與我授記汝於來世當得作佛號釋迦牟尼以實無有法得阿耨多羅三藐三菩提是故然燈佛與我授記作是言汝於來世當得作佛號釋迦牟尼何以故如來者即諸法如義世尊所得師法明文尚在豈可遮掩得人耶又把世尊傳法偈謬解云此法之本本無法也無法豈無本有法也無法而付即有法也法法何法即無法也此有而無也無而有也不可有無有無不可者也而如來傳法偈乃如是乎除非滅卻法本法無法無法法亦法今付無法時法法何曾法偈方可任你穿鑿秖如四祖優婆鞠多尊者傳法偈云心自本來心本心非有法有法有本心非心非本法七祖婆須蜜尊者付法偈曰心同虛空界示等虛空法證得虛空時無是無非法若此者疊疊顯然你又如何穿鑿乃不察自己謬誤翻道他人暗短滅之抹之且道是誰滅抹果有滅抹之者何不明據其非以共證乎天下竟哅哅然混指為滅抹也只圖誣人之短以炫己長獨不知逞其癖見以昧宗旨乎又謂二十七祖遙讖達磨曰東土有聖人氣惟駿馬駒腳下踏殺天下人言馬大師之下出臨濟雲門溈仰法眼之四宗謂之腳下也足見他是箇執相凡夫定將馬駒四足膠粘釘釘以配四宗無非欲證一擊之為三玄三要之原各有所據若恁麼執相生解達磨一宗看看掃地矣當時二十七祖但云震旦雖闊無別路要假兒孫腳下行金雞解銜一粒粟供養十方羅漢僧所以六祖諦囑南嶽讓禪師云西天般若多羅讖汝足下出一馬駒踏殺天下人病在汝心不須速說此明明道南嶽足下出一馬駒踏殺天下人也祖師遞代讖囑分明他又捏作更之以四取義可發一笑又將神秀身是菩提樹心如明鏡臺時時勤拂拭勿使惹塵埃偈判為執有修行此凡夫法也必欲把秀大師作箇凡夫見是何言歟不見南嶽讓一日有省白六祖曰某甲有箇會處祖曰作麼生讓曰說似一物即不中祖曰還假修證否讓曰修證則不無染污即不得祖曰祇此不染污諸佛之所護念汝既如是吾亦如是神秀雖無南嶽轉語之圓終不可謂之凡夫法也又將六祖菩提本無樹明鏡亦非臺本來無一物何處惹塵埃偈判為從前後際斷忽得心空遂墮空邊正外道法也師喝一喝云你曾夢見祖師來否既不識祖師縱奪之機當見龐居士云十方同聚會個個學無為此是選佛場心空及第歸豈亦可作外道法耶且傳法正宗記云五祖見偈默許不即顯稱恐嫉者相害乃佯抑之曰此誰所作亦未見性先德語言至今不泯況毗婆尸佛偈云身從無相中受生猶如幻出諸形象幻人心識本來無罪福皆空無所住可見佛祖理徹心通無二無別肇論云本無實相法性性空緣會一義耳必以本來無一物為墮空落外其謗法之愆焉能逃哉又謂袈裟法數為宗旨之至細至密處一以迦葉持衣載法以傳彌勒一以阿難副二以傳西天四七不知世尊說付法偈已止告迦葉吾將金縷僧伽梨衣傳付於汝轉授補處至慈氏佛出世勿令朽壞次至多子塔前止命迦葉分座令坐以僧伽梨圍之告曰吾以正法眼藏密付於汝汝當護持傳付將來而後迦葉亦止告阿難言我今年不久留今將正法付囑於汝汝善守護聽吾偈言法法本來法無法無非法何於一法中有法有不法說偈已乃持僧伽梨衣入雞足山俟慈氏下生豈有二袈裟一以俟彌勒一以付阿難殊不知衣為表信必欲妄執名相而迷其原以衣為至細至密之宗旨何西天二十五祖當二十六祖之啓請而不付東土六祖遵五祖之遺囑而不傳恁麼則宗旨之不得而付不得而傳也可見得法源底豈在衣乎故二十五祖曰此衣為難故假以證明汝身無難何假其衣化被十方人自信向五祖曰昔達磨來自異域雖法傳二祖恐世未信其所師承故以衣鉢為驗今我宗天下聞之無不信者則衣鉢可止蓋可行可止可付可不付吾所謂宗旨之不在衣明矣又謂鞋之一擦碓之三擊與袈裟縷縷明示則法數具足原無缺少原無增減既云一擦為之痛快而又據三擊碓床宜以詳見祖師所用不定只要人直下知歸你又釘定三擊為三玄張本足見倍迷其原矣如得法悟心之士寧執相滯名若此哉又謂不待悟而後出生死非因迷而曾墮生死不聞楞嚴經云當知一切衆生從無始來生死相續皆由不知常住真心性淨明體用諸妄想此想不真故有輪轉又古人云背之則凡順之則聖迷之則生死始悟之則輪回息豈非因迷而有生死因悟而出生死昭然之理咸可見也他顛倒反是令人安得不疑果如不待悟而後出生死非因迷而曾墮生死卻也無迷也無悟也無佛也無祖宗旨俱不必傳將率天下以滅佛法者必彼之言夫又何用絮絮於袈裟者哉又舉馬祖與百丈因緣至一喝三日耳聾云此非三棒之法而何此語實可憐生何執之於三乃至如斯百丈從一喝大悟云三日耳聾他何止三日耳聾百千萬劫命根斷盡又謂三法之師承自此而來使馬大師當時震聲三喝令百丈三日耳聾則你今日引證確乎成據矣既非三喝而惟一喝則三棒之法不獨證之不成益見古人得之者尚不定在一而況執其三乎又說馬大師三甕醬示百丈丈一時打碎檗亦以三頓棒示臨濟濟還大愚肋下三拳你謂三甕醬一時打碎且道百丈一時將三棒打破耶將一棒打破耶若將一棒打破不合馬大師三甕醬之為三法矣若將三棒打破又不合馬大師一喝令百丈三日耳聾矣既前後三一不合又如何合得黃檗三頓痛棒以發臨濟悟由耶不見雲庵和尚頌云便言黃檗無多法大丈夫兒豈自乖脅下兩拳明有信不從黃檗付將來你還委得麼又謂比時野狐之種不少會各不同有者會得本來無物便執道是有者會一棒一喝亦執道是果爾會得本來無物令人不著名相果爾會得一棒一喝令人不墮死水且本來無物正六祖見徹處一棒一喝正馬祖百丈親承授處乃翻道野狐之種會本來無物以至一棒一喝也還知徹底人自然人法兩忘而何得支離瞎說如此耶又據百丈上堂野狐公案不落因果以破本來無一物不昧因果以破身是菩提樹且夫前百丈五百生前錯答一字而墮野狐安有意向後百丈前以破六祖之偈乎嗟嗟古人錯答一字尚墮野狐身五百生今人恁麼妄判先宗又如何耶不見百丈至晚上堂舉前因緣黃檗出問云古人錯答一轉語墮五百生野狐身轉轉不錯合作箇甚麼丈云近前來向汝道檗近前打一掌丈拍手笑云將謂鬍鬚赤更有赤鬚鬍你把黃檗一掌如何看若識得黃檗一掌便識得溈山老人三撼其門得大法者何曾在名相上著腳自下臨濟和尚不惟三頓痛棒徹困向上一路關捩子七通八達方作人天師範若執三法臨濟之宗寧有今日哉不見濟一日夏半上黃檗山見檗看經曰我將謂是箇人元來是唵黑豆老和尚住數日乃辭檗曰汝破夏來何不終夏去濟曰某甲暫來禮拜和尚檗便打趁令去濟行數里疑此事卻回終夏後辭檗檗曰甚處去濟曰不是河南便歸河北檗便打濟約住與一掌檗大笑乃喚侍者將百丈先師禪板几案來濟云侍者將火來檗曰不然子但將去已後坐斷天下人舌頭去在大衆師資相印豈是草草若遮裏見得徹山僧亦將鉢袋子擲與你們隨處住山去若遮裏見不徹且按下雲頭七尺單前研窮本分直到大休大歇始可向人前提掇此事不然都落在意根卜度邊無有出頭日子切須仔細如八十翁翁入場屋真誠不是小兒嬉且看臨濟大師徹證之後當時復被黃檗打了趁出尚數里疑不肯自滿掉轉頭來復造黃檗是何境界而後得意旨黃檗和尚便付禪板囑云已後坐斷天下人舌頭去在方自相承建立宗旨所以連次打普化克符至晚小參曰有時奪人不奪境有時奪境不奪人有時人境兩俱奪有時人境俱不奪此正料揀人法知其邪正他解云料者物料揀者揀擇此四揀以成一句之料也此等邪知曲說諸人可以推之不待老僧轉播唇舌而後見矣僧問臨濟大師如何是真佛真法真道乞師開示濟曰佛者心清淨是法者心光明是道者處處無礙淨光是臨濟大師當時直截答他句句了然恐人執著即云三即一皆是空名而無實有如真正道人念念心不間斷自達磨大師從西土來秖是覓箇不受惑底人後遇二祖一言便了始知從前虛用工夫山僧今日見處與佛祖不別若第一句中薦得堪與祖佛為師若第二句中薦得堪與人天為師若第三句中薦得自救不了僧便問如何是第一句濟曰三要印開朱點窄未容擬議主賓分曰如何是第二句濟曰妙解豈容無著問漚和爭負截流機曰如何是第三句濟曰但看棚頭弄傀儡抽牽全藉裏頭人臨濟大師到遮裏曲垂不少雖逐句下一聯語直是痛快令人𢄶然奈他又向鉢盂上添柄說出三身中有九法顛顛倒倒句義且不照應況佛祖之至理乎一味欲以能所見壓當世以狂妄論超先輩汝等切忌入他圈繢裏播弄一生終無了期濟又曰大凡演唱宗乘一句中須具三玄門一玄門須具三要有權有實有照有用汝等諸人作麼生會你看臨濟綱宗面目現在遮裏他又自問自答說此一句之大法也猶非大法之大法也何為大法之大法前一棒後一棒折作炭灰發光亮尤為可笑你看他說此一句之大法以判三玄三要猶非大法之大法前一棒後一棒折作炭灰發光亮意謂超過三玄三要之大法也所以又道會此大法之大法方好賓主相見瞎漢不見臨濟大師明明道一句中須具三玄門一玄門須具三要有權有實有照有用汝等諸人作麼生會若賓主未相見時縱有權有實有照有用三玄三要湛寂無聞那裏下口大衆要知臨濟大師立法蓋為賓主相見遮裏切須究取不可隨他生解所以百丈老人云義句知解知解為貪貪變成病秖如今但離一切有無諸法亦離於離透過三句自然與佛祖無差他又將四喝分為賓主逐句分疏不見臨濟大師對僧曰我有時一喝如金剛王寶劍有時一喝如踞地獅子有時一喝如探竿影草有時一喝不作一喝用汝作麼生會僧擬議濟便喝諸人還知四喝落處麼若知得落處則不受伊惑矣又拈今之杜撰禪和心粗膽大不識好惡便道世尊拈花只是箇一心之法更無餘事種種枉直作曲老僧今日不與較量他又道我佛只是一心更無餘法如此方是正宗若有三玄四料便是旁出指三玄四料為旁出等語說自何人你看他向虛空裏鑿出要瞞天下學者必也你假造一本道是某人著作令不聞不見者道聽途說一人傳虛多人傳實方可如是說不然有何據而如斯誑妄耶又謂那裏曉得有萬峰今日一場說破他室中傳授之祕遮樣誣說更可慚惶人既室中付囑之祕語你因何竊得如此捏造只恐閻羅老子未肯放你在又把臨濟大師傳法偈曰沿流不止問如何真照無邊說似他離相離名人不稟吹毛用了急須磨將前三句逐句下箇注腳定要穿套起來合他偏見盡判為未妥單取末後一句吹毛用了急須磨而已咄你單取遮一句為是則吹毛劍何所歸著莫道久參衲子概不堪聞凡有血氣者皆不堪聞矣不見臨濟大師復謂衆曰吾滅後不得滅卻吾正法眼藏三聖出曰爭敢滅卻和尚正法眼藏濟曰子已後有人問你向他道甚麼聖便喝濟曰誰知我正法眼藏向遮瞎驢邊滅卻你看三聖遮喝繼臨濟千百年來還有人揀點得也無他又謂今人要把極粗一棒便了者欺人欺佛欺祖欺前欺後而欲妄號佛祖不亦無恥之甚乎此亦因死執其三而非其一殊不知執一執三皆不明三一之理何故但知其一不知其三如人有首而無足但知其一不知其三如人有足而無首首足體一也豈可執一而不知其三乎又豈可執三而不知其一乎足首用分也豈可執其用而昧其體耶又豈可執其體而不達其用耶所以永嘉大師云至理虛玄窮微絶妙尚非其一何是於三不三之三而言三不一之一而言一一三非三尚不三三一之一亦何一一不一自非三三不三自非一非一一非三不留非三三非一不立不立之一本無三不留之三本無一一三本無無亦無無無無本故妙絶如其執定三法為之準繩以貫佛祖之道則西天四七皆不得道矣有何三法為據哉乃至東土二三及諸大禪師何曾箇箇專用三法闡揚佛祖之道耶我臨濟大師有三玄三要亦未嘗執定三法而有四賓主四料簡四照用四喝之唱且汾陽老人有三種獅子四句十八問十智同真乃至遠公九帶南堂十門若死殺看定三法則汾陽遠公南堂何能續臨濟之道哉他又訕道廣通邪說既已大行不得不力辨其為遮裏若非老僧孰知其真僞之詳也老僧今日實不得不正其僞以伸先輩之誣懲三峰之罪亦杜不知者蹈襲之咎諸人看笑巖和尚聯芳偈序云世尊瞬目迦葉破顏達磨安心神光斷臂了知佛法無多子黃梅暗付以紛爭庾嶺明傳而弗受洎乎錯認定盤星不肖上承迦葉六十三世之元祖下繼曹溪三十一葉之真孫驗邪正以秦鏡甘本分於磻溪苟遇其人囊橐罄付云耳笑巖老人既云不肖上承迦葉六十三世之元祖下繼曹溪三十一葉之真孫正嗣臨濟上下之一胍總謂之數十世也何為抹殺者乎又廣通序云是集始刊於隆慶己巳孟秋是時吾師已南行矣及自金陵伏牛清涼於萬曆丙子孟春元日都中檀越迎請回京仍置興德舊居因晚參次與諸徒敘見集中字多訛舛板亦損壞諸徒意欲重梓兼南中一帶之語隨之續入又前原公之序渾言大體但未略伸吾師嗣祖回風之正意故茲因而序曰夫釋迦文佛說法訖將言外單傳之道嫡付飲光下至二十四祖獅子尊者得婆舍斯多付法訖復攝達磨達始有旁出之名逮達磨以來二祖可師四祖信師五祖忍師亦有正傳旁出之事暨曹溪之下厥旁岐縱橫肆出厥奇名異相涯岸各封以羅天下學者致使晚進無知靡所適從前代格法漸遠末世相承漸僞輒成駕虛望空授受何異漚泡明珠之歎乞兒聖主之誅者耶師得絶學老人不傳之旨望臨濟二十六代之祖而弗專臨濟之稱者何也見諸天下浸蔓泛繁久假而莫知歸故截枝泝流以復本原惟曰曹溪正脈某十某代俾天下末世無根據者竟不墮於紛紜妄號之責回祖風真淳之舊寧不以為宜乎者哉此序正表笑巖聯芳序之意旨何有削去臨濟抹殺五家之說明眼者詳其理可也他尚不知廣通出處彼平生見地徹證中年已亡別無著作何以諄諄罵詈總是無稽之談直要橫行到底立自己見深可哀也諸人當知余非好辨三峰狂言詆謗此猶可容傷殘慧命實為可痛各宜力究辦別正邪研窮至理助揚法化共報佛恩久立珍重復三峰漢月藏公書原書附粵自威音無象一為千佛萬佛之祖故七佛以雙頭獨結四法交加勒成無文密印而飲光傳二十八代無非以法印心此法之不可滅沒也重矣達磨東來六傳之後奈何旁出之徒又於法偈中鑽出理路故密處成疏絶滲漏中成漏馬大師萬不得已拈出一機一境絶盡旁門單提向上故以正出為重遂有野狐兩扇而三撼其門百丈再參而末後一喝從前心法印定於此矣黃檗因而有三頓痛棒未聞有兩頓四頓之旨此臨濟之三玄要所以發明七佛歷祖之祕以簡一橛頭相似野狐涎也此臨濟之所以為萬世法也故後世聞臨濟兒孫出興不憚費盡杖頭破盡草鞋千里萬里為之參叩耳未嘗有簡臨濟為旁出者不待辨而明矣自唐及宋而元臨濟之法楚楚至中峰傳法於千巖失卻一隻眼淆訛從此而起然萬峰寶藏尚以三玄為傳法之要去後則泯泯無聞焉逮笑巖之徒廣通不知何許人乃肆滅六祖已下五家詆為旁岐益可恨矣其說一唱法遂滅盡但得一知半解全無古格肆其臆說不是本來無一物定是涼颼颼地苟非認性認心又落不上機境今時外道陋不可聞今時禪品惡不可見皆因無祖法之印為格則也藏竊痛哭流涕久矣期一再見臨濟兒孫身雖百歲得三歲之的派者必禮為師此無他以深參覺範高峰之禪實透臨濟玄要賓主之法故耳往年嘗欲走叩龍池以先得語録不果後以髮將垂白聞金粟出世喜臨濟重興特為叩荷其傳所望其瀾益闊其道益光嗣聞我叔大師建幢石磬尤見古佛並興拜讀新刻果如初日乍出便欲拽杖禮龍池塔聆石磬響以寺事所勒未克如願遙聞來歲世甲乍周祖堂將闢願和尚無外臨濟正宗大豎三玄古格藏等願就克符普化之列共扶七百年既抹殺之宗光天耀日於大明之世何其快哉何其快哉藏臨楮不勝仰望之至諸佛為一大事因緣出現于世故我釋迦如來初生下時便一手指天一手指地周行七步目顧四方云天上天下唯吾獨尊四十九年彈偏叱小會權歸實所以云唯此一事實餘二則非真以此一心之法印定故末後拈花微笑嫡付教外單傳至二十八代達磨東來傳至六祖亦無非一心之法彼群英疊出兩派分岐旁出繁興皆以所得淺深教化馬大師單提向上百丈再參而末後一喝黃檗因聞不覺吐舌才明大師大機大用故施棒以接臨濟如發藥人只欲救病今來書云只有三頓痛棒未聞有兩頓四頓之旨此語若在臨濟則可在黃檗則不可何故若黃檗恁麼為人已成實法了也況臨濟至大愚言下點破悟徹根源握萬世之綱宗開法四賓主四料簡四喝一句中具三玄一玄中具三要簡別邪正殺活縱橫自後五宗並立門庭雖異總之咸歸一心之法如洞山得法雲巖臨行囑付因過水睹影大悟前旨有偈云云可不各各師承有據或嚴密或痛快又豈有實法繫纍人耶正宗流至中峰傳法於千巖乃云失卻一隻眼淆訛從此而起此何說也況中峰大師語録言言見諦句句超宗其道要歌發明玄要字字破的及餘開示小參拈提公案當時無有出其右者而千巖築破方甓盡底掀翻中峰尚囑云時節若至其理自彰後三十年住山出世若是半邊見焉能道得一句子流出百千萬億句百千萬億句入這一句豈非全收全放全放全收耶古德云但恐不成佛不慮佛不解語萬峰寶藏從此得傳縱奪抑揚賓主照用莫不本臨濟綱宗若非具眼豈能作得他家兒孫耶此繫法門大事立論宜當三思如云泯泯無聞今日新萬峰從何而得也又云笑巖之徒廣通肆滅六祖已下五家詆為旁岐此因未諳通本昔我幻有老人親聞笑巖翁祖云當時因少林出祕要天奇和尚直注破時人之執遂議論紛起謂正宗久寂已無其人所以笑巖深慮法門而聯芳偈敘故有上承迦葉六十三世之元祖下繼曹溪三十一葉之真孫以遮表同時遮則遮其濟洞無分表則表其曹源不絶命通序之並非肆滅五家削去臨濟不欲承嗣但詆曹溪上下旁岐涯岸各封以羅天下學者恐晚進無知靡所適從泝流歸本之意耳此處將藥作病失照不少至云今時外道陋不可聞今時禪品惡不可見此誠諦之言不肖亦未嘗不拊膺痛心念祖道之陵夷師承失嚴密也及觀所著五宗原始於圓相七佛由來五宗各出一面正宗先出四宗相續其餘旁出莫不悉備者蓋欲發明先輩抹殺五家宗旨單傳拈花一事也所云傳宗旨者不悟宗旨抹宗旨者不知宗旨夫既不悟宗旨所傳何事耶五家宗唱若不本單傳之旨又傳何事耶然而五家雖各從一宗莫不發明拈花旨趣若抹殺宗旨非魔即外不待辨而自明矣今公千辛萬苦參訂將來猶恐後學反以圓相為躲跟奈何卻成窠臼不見當時五祖演和尚舉祖師道吾本來茲土傳法救迷情一花開五葉結果自然成達磨信腳來信口道後代兒孫多成計較要會開花結果處麼鄭州梨青州棗萬物無過出處好所以云垂慈則有法無法不垂慈識取鉤頭意莫認定盤星公數十年操守博學晚年繼我密雲師兄法道不減夾山船子之風道光遐布欣慰欣慰若非念公以法眷見稱不肖亦不敢如是以法為親也客歲過吳門希一晤因歸迫未果適接來翰并佳刻如見手儀又承厚惠何以克當不肖病軀孱劣久困巖壑偷安待盡誠為法門罪人仰望高賢唱導隆盛素所願矣復答三峰漢月藏公書問并判語三峰云承大教以一心為宗師答你還跳得出麼印定萬法以一拈花為單傳之法答西天東土亦如是此外並無餘法而一拈之內亦並無餘蘊答你那裏摸索便以一棒一喝一句梨棗東來西去你出我入互相活脫不滯機用謂之殺活縱橫答你不達古人方便死了不得活以五宗為此外另立之門庭答自生分別故不欲盡明其說而將就彀用於今時則已答將謂你鑿壁偷光故逢著祖宗嫡骨之要皆意思問放過答呵呵大笑若人舉著還他一箇絡索二字答未舉先知自己立在無人對證處答瞎漢今日被不肖問著便東塗西抹說些四無頭果子阿母話支塞答尚且不會又要立在上風答可見你有人我相此非支塞過便了者不肖正為舉世如此答則恐你還不識痛承小釋迦再來畢竟要與臨濟出口毒氣耳答未到你在今復有問願和尚真實答我答從來不妄語幸勿遮遮掩掩說半開合話方好流布諸方答諸方早已見矣救得正法重新光顯答何曾隱晦來若又是前來話柄則不敢求搜索也答不識好惡在一問兩派分岐旁出繁興皆以所得淺深教化且道兩派分岐是所分何等岐講何等事兩派可有深淺否答諜諜迷源話頭也不識如何是他深處如何是他淺處答待你腳跟點地方知且道旁岐所說是何等法遂判為非正答你也出不得正者說何法遂判為正支淺深之旨可得聞乎答看取老僧上下文次問來教云馬大師單提向上百丈再參而末後一喝黃檗因聞不覺吐舌才明大師大機大用故施棒以接臨濟且道馬大師既單提向上百丈於扭鼻處已明得哭笑卷席大師已印過他會也又印過子深明昨日事矣為甚麼還弄這些子而至豎拂掛拂之最後方震聲一喝而百丈方悟得三日耳聾耶若道此處才明一喝他前師印資呈皆落妄語矣答錯若前來都是又何必一喝而方貴耶答錯錯前之扭鼻哭笑獨非機與用乎至一喝而方明大機大用答你未夢見在大字遂成重見疊出一何勞叨若此哉答轉見不堪黃檗吐舌明得大機之用而百丈讚其超師且道他超處在於何所答放你三十棒亦不可糊塗也答自領去承教如人發藥只欲救病今來書云只有三頓痛棒未聞有兩頓四頓之旨答𧄼此語在臨濟則可在黃檗則不可何故若黃檗恁麼為人已成實法了也請問為何在檗則可意者以非實法故答以楔出楔若言非實法者此是謾他臨濟也答我也知你作實法會而臨濟恁麼會黃檗禪已成實法乎答以己方人埋沒先聖是則臨濟何足貴而小釋迦於溈山處極口讚嘆而將此身心奉臨濟以報佛恩耶抑錯之甚矣甚矣豈不爾思室是遠而答親言出親口承教臨濟至大愚言下點破悟徹根源他既是悟得一句一喝一棒的又何說他悟徹根源遠之遠矣答你未知落處在且道如何是根源處耶答待你徹後見又云握萬世之綱宗且道何者為綱宗亦不可不識也答再參三十年與你道又云開四賓主且道他兩人對面說話何者是賓答照顧腳下何者是主答賞罰分明何為賓中賓答闍黎切忌道著何為主中主答老僧決不謾你四料簡者何為料答想你不識何為簡答門外漢料簡作麼答恐你瞞頇又云一句具三玄請問何者為一句中之第一答倚天長劍第二答威風凜凜第三玄答全提正令誰敢當鋒何者為第一要答杲日當天二要答虛空霹靂三要答風馳電捲不留剩跡不可塗糊隨語生解象病冤鬼答恰是說一句支塞過不肖必不肯輕放也答面皮厚多少又云三玄三要以簡邪正此語天教說出賴不得也答掩耳偷鈴且道如何是邪正處答一分少你不得如何是簡他邪正處答簡了也豈可忽哉答寐語在若不過意思間說箇總歸一心答謗佛謗法謗僧便是果子說話便是座主奴也答老僧不如你音者聲之外者也曹洞一宗想非和尚茶飯不必言矣答扯東蓋西中峰千巖且待辨明已上諸說方好點簡答劍去久矣不然徒虛爭耳答果然此事實曾三思方立大論答未知之咎也雖千佛列祖出世皆欣欣合掌者答可憐生但當世之所不容答可知禮也佛法欲滅正謂此也答難道通公之說實屬未知之咎敬為懺謝答墮也但其言溷指旁岐實不通旁岐之理有犯正宗不得不為力誅之以存佛祖也答負也承教及觀所著五宗原始於圓相七佛由來五宗各出一面正宗先出四宗是已而竟言相續答大妄語漢其餘旁出莫不悉備者則又似數曹洞為旁出也訛矣答昧又言夫既不悟宗旨所傳何事耶請問一喝一句一棒轉轉弄此謾人者即是宗旨乎答你還跳得出麼又云公千辛萬苦參訂將來猶恐後學反以圓相為躲跟奈何卻成窠臼此說大為可笑答下士聞道若圓相成了躲跟窠臼則我金粟大師一棒亦成了躲跟窠臼乎答自語相違漢麻三斤乾屎橛亦成躲跟窠臼乎答過而和尚磬山集上道蒼天蒼天太平盡唱無生曲引得巖前石虎吟亦成躲跟窠臼矣答你那見他著實處吁人可欺乎佛祖可欺乎直心道場何可若此也答作賊人心虛久聞和尚心如虛空答也不消得今日竟將一夕雷雨崩擊一上答青天白日想大慈不我怪也答放過則不可不肖多所未知幸垂示我至禱至禱師判云子復三峰前來書為彼判臨濟宗旨不達其理妄肆臆說欲置而不答恐誤後學獲罪於法門故不徇情而據理言之詎料彼有人我見翻道子立在無人對證處說果子話又道子要立在上風足見三峰皆勝心也子住山三十餘年並不管分外事因他驀刺書來蓋不得已而應之耳今彼復嘵嘵致辨於理全違希圖遮人耳目愈增其醜既知豫宗一心拈花單傳之旨而乃謂舉世如此者何也殊不知三世諸佛亦如是歷代祖師亦如是天下善知識亦如是何為硬執己見翹然自負以為異於人而謬判先聖宗旨如所謂黃檗三頓痛棒未聞有兩頓四頓之旨發三玄三要處處抱樁搖櫓必欲合此三法逆推五祖接盧能以杖擊碓三下為臨濟張本不論拈花單傳之旨恐離了三法則落在心性禪裏然則四料簡四賓主四喝有何四法可據耶若謂三玄三要根定三頓痛棒則曹洞君臣五位又何從五法而接青原一脈乎殊不知三頓痛棒本乎單傳之旨若識厥旨三玄三要著著現前若道三玄三要意趣在拈花旨外而另有法亦是心外取法矣豈非埋沒我臨濟大師於空閒無用之地哉不達此理妄議古今尊宿為抹殺宗旨而單傳拈花一事見余不肯是說遂爾惡發濫言詆詈令人目之皆可欣也令人思之實可哀也豫觀三峰傳衣注云若必重自悟而抹殺相傳之法必非悟心之士也何以故以其見有法故見有法即與自心違故既悟見有法則所悟之心亦僞故余謂三峰如是說則悟心之士不可分心分法何故必執三法為宗旨而妄判所悟單傳之旨者為一橛頭禪且問他曾悟也未若道悟則不可取法而反責悟心之士為抹殺相傳之法也若道未悟亦不可云既悟見有法則所悟之心亦僞故而反執法以貶諸方一悟便了單傳拈花之旨也可見三峰轉轉迷源弗知顛倒苟欲網羅當世學者致令自語相違處處乖張言言失旨豫豈好辨哉況三峰奚足與辨誠恐後世無所據焉爾彼云通公之說實屬未知之咎敬為懺謝但其言溷指旁岐實不通旁岐之理有犯正宗不得不為力誅之子曰此理明顯尚自弗知攖犯先覺而況佛祖玄微奧旨全不細心猶且矜誇三思方立大論更誣余似數曹洞為旁出是何言歟豫雖不敏法門大綱難以掩目正為三峰五宗原中云五宗各出一面然有正宗第一先出次則雲門曹洞其餘旁出道理極則教家玄妙淵微莫不悉備又云此但人天小果有漏之因如影隨形雖有非實豈非曹洞語乎此說皆出三峰之口而昧已謾人磬山可得而謾哉凡閲三峰語句者亦不可得而謾也又云豫書中言公千辛萬苦參訂將來猶恐後學反以圓相為躲跟奈何卻成窠臼此說大為可笑若圓相成了躲跟窠臼則我金粟大師一棒亦成躲跟窠臼乎麻三斤乾屎橛亦成躲跟窠臼乎此因豫點破五宗各出一面之句故也今且問他能分得五宗一宗一宗從何一面一面而出耶若五宗實從這箇圓相一面一面而出者豈不成了躲跟窠臼乎況此圓相你那裏見他方所一面一面來瞎漢還聞塗毒鼓麼又云一棒一喝轉轉弄此謾人者怪道他復竹菴書中竟駁為天然外道爾弗思乎今之海內孰行棒孰行喝何故班班見於著而非之況三峰今已繼此一棒了也而且虛獎道我金粟大師一棒亦成躲跟窠臼乎此非三峰語自乖乎嘻若果會得三玄三要之旨不出拈花單傳何爭一棒一喝乃至猿啼鳥噪莫不發明三玄三要之旨也驢鳴馬嘶莫不發明三玄三要之旨也魚歌牧唱莫不發明三玄三要之旨也風柯月楮莫不發明三玄三要之旨也所以塵說剎說衆生說無間歇莫不發明三玄三要之旨也嗚呼若是抱死竿頭直饒你把生鐵鑄就三玄三要之句掇向人前猶是立地死漢正所謂邪正在人不在法也且麻三斤乾屎橛你道曾流出什麼物來也成躲跟窠臼了可見又要贓誣先聖矣而又將古人直指處穿鑿話頭來相詰知而故問乎不知而問乎豫一一答之請彼反之於心已可欺也佛祖不可欺也天下後世更不可欺也諸方自有明眼者在何待豫辨
