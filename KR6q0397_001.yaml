body:
  text: 嗣法門人通問等編湖州府上柏山報恩禪院語錄師於崇禎七年八月二十二日入院以拄杖指三門云從這裏入皇恩佛恩一齊報答且道最初一句作麼生道彈指頓開華藏界剎那都向箇中來便入佛殿師云古寺重興慈風再扇有頭有尾無背無面既然有頭有尾為甚麼無背無面擲拄杖云天上人間無處不現大展具禮拜方丈師拈拄杖云據此室行此令不入虎穴焉得虎子從他牙如劍樹口似血盆到這裏也須喫棒為甚麼如此不曾得祖印難過此關頭便起上堂師至法座前云最初一步踏著須向千峰頂上提持且道是甚麼人行履處高著眼遂陞座拈香云此一瓣香天不能蓋地不能載靈根透於劫外秀葉覆於閻浮爇向爐中端為今上皇帝聖躬萬歲萬歲萬萬歲次一瓣香遇貴則價滿娑婆遇賤則半文不值奉為滿朝文武闔郡公勳主請邑侯水出檀越現前居士眾等同乘般若之慈航共證金剛之種智又一瓣香慇勤古木林間埋沒白雲堆裏向無所得中得來在有修證處不證今日對眾拈出供養荊溪龍池山禹門禪院本師大和尚幻有老人以酬法乳斂衣就座維那白槌云法筵龍象眾當觀第一義師云若論第一義老僧未到此間已與諸人抑揚了也而今重新再舉不覺落二落三去也還有出格英靈對眾遞相酬唱者麼僧問把斷要津不通凡聖正恁麼時請和尚道師直視云見麼進云一句曲含千古韻萬重雲障月來初師云且站過一邊進云謝師答話師云杓卜聽虛聲問大開爐鞴鍛聖鎔凡忽遇無背面漢來如何鍛煉師云你從那裏來僧呈坐具師云卻有背面了也進云和尚又恁麼去師便喝問最初一句則不問未審踏著箇甚麼師云半夜裏偷瓜問祖印全提十方坐斷報恩一句作麼生道師云我已道過了也進云如何是報恩境師云梯子嶺頭雲翼翼金車山下水潺潺進云如何是境中人師以拂子左右拂進云如何是人中意師放下拂子良久進云還有向上事也無師云有則有未可與你道在僧禮拜云報恩一句重拈出鐵眼銅睛不可窺師云多枝多葉乃云當陽顯露人人鼻孔遼天直截根源箇箇腳跟點地達磨西來徒為往返之勞神光斷臂枉受辛勤之苦所以道言前薦得屈辱宗風句後承當埋沒家寶恁麼則世尊說法四十九年末後拈花道吾有正法眼藏涅槃妙心付囑飲光廣令傳化勿使斷絕且道傳箇什麼來這裏會得何須長期短期消磨歲月如未委悉老僧畫蛇添足與你諸人通箇消息驀豎拂云還見麼若是不見除卻你生來眼以拂擊案云還聞麼若道不聞除卻你生來耳既見既聞聞又聞箇什麼見又見箇什麼老僧說到這裏話頭也忘卻了且道報恩一句又如何左右顧視云全憑一點無私力報答四恩咸有餘維那云諦觀法王法法王法如是下座師在荊溪磬山受請陞座辭眾拈拄杖云一十五年成小搆謝諸檀信護持心別行一路暫時去汝等堅修守寂岑目視雲霄已有年酬恩報德不相關而今帶水拖泥也杖笠迎風過遠山還有同起同倒者麼出眾相見僧問法性如如無云來從來普遍周沙界即今和尚去耶非去耶師豎起拄杖云你還識得這箇麼進云祖禰不了殃及兒孫師便打良久云雲本無心出岫乘風縹緲於長空往來無礙月非有意臨溪趁水光含於四海映徹何窮住也則心包太虛無欠無餘行也則道不虛應有來有去到這裏事絕理絕超古超今去亦得來亦得行亦得住亦得驀卓拄杖一下云都盧收在拄杖頭上優游自在放曠逍遙喝一喝云既然如是出門一句作麼生道木人執板林間拍石女含笙嶺外吹到德清縣開封寺鳴鄒蔡封翁請上堂師云迷封曠劫開悟剎那不涉迷悟關頭別通消息試道一句看良久云至道無難惟嫌揀擇但莫憎愛洞然明白以拂子指上云上是天復指下云下是地高是山淵是水男是男女是女僧是僧俗是俗老是老少是少如何道得不揀擇底句驀擲下拂子云撲落非他物縱橫不是塵便下座示眾師云老僧今住箇破院子多病不能為汝等提持佛法兩字賴土木瓦石為諸人轉大法輪發諸人大機大用切不得當面蹉過若蹉過只知事逐眼前過不覺老從頭上來師誕日示眾幻住人間六十春相逢未遇幾知音虛懷祖印全提旨遙望賢裔造詣深幾度白雲空聚影多番黃鳥亂啼聲報恩今日重拈出也道當生即不生冬至示眾師云夜來一片霜天冷從此陽生日日長箇裏不知誰著力森羅萬象盡敷揚大眾且道敷揚箇什麼事若會得道將一句來看如未會得按下雲頭參究一回始得珍重示眾舉圓悟禪師上堂云有句無句超宗越格如藤倚樹銀山鐵壁及至樹倒藤枯多少人失卻鼻孔直饒收拾得來已是千里萬里只如未有與麼消息時還透得麼風煖鳥聲碎日高花影重師云且喜佛果老人恁麼舉揚真所謂萬世標榜不唯見得古人徹頭徹尾親切處以破時人支離穿鑿之窠窟也何故今時有一等漢魔昧人家男女膠柱鼓瑟定要入他圈繢道作麼生是有句作麼生是無句作麼生是如藤倚樹作麼生是樹倒藤枯逐句須要義解合他杜撰稍有不合處便道你只會得箇有句未會得箇無句若到樹倒藤枯句歸何處猶隔遠在諸人還知古人建立法要處麼如未知當自看佛果老人言語一一究明方不隨群逐隊雖然若具箇金剛正眼莫道看破他邪根種子這些圈繢連老僧這些說話揚在一邊圜悟老人這些說話亦揚在一邊將古人恁麼葛藤亦拋向那邊更那邊自家自有出身之路一段本地風光蓋天蓋地豈肯把虛空分長分短分古分今耶到這裏還知落處麼良久云數聲清磬是非外一箇閒人天地間示眾師云剛纔結制俄爾半月矣諸人曾將半月內簡點於未結制前是同是別底消息否老僧每欲入堂逼拶諸人做工夫且思之此事按牛頭喫不得草記得先師幻有老人云真學道人要人逼拶做工夫是不濟事矣果爾是按牛頭喫不得草若是生死心切教他放亦放不下我這裏堂中也有久參底也有一知半解底也有纔入門底也有懵然無知底各各簡點做自己本分工夫始得昨夜執事等勉老僧與大眾說法冷地裏仔細思量有什麼法可說良久驀出座顧視左右云誰是欠少底那便下座檀越請小參師拈香云這一瓣香從祈遠唐居士信心中流出爇向爐中祝延慈父當朝大堂存憶大檀越壽浼山僧舉揚般若眾中還有知恩報德衲子出眾相見麼僧問如何是奪人不奪境師云腳下踏黃泥進云如何是奪境不奪人師云頭頂破屋漏進云如何是人境兩俱奪師云老僧這裏也無說法者亦無聽法者進云如何是人境俱不奪師便喝乃云驀劄相逢便舉揚拈來無事不相當至誠一念超情念敢保無虞日月長天地覆育父母生成人所共恩誰能報答直須看到父母未生已前親見一回到這裏無恩不報無德不酬居士還委悉麼不見當時陸亙大夫參南泉云肇法師道天地同根萬物一體也甚奇怪泉指庭前牡丹云大夫時人見此一株花如夢相似當時南泉大師雖具驅耕夫牛奪饑人食底手段未能令大夫慶快去今日居士若問山僧天地同根萬物一體驀豎起拂子云都盧在這裏放下拂子左右顧視云者裏若還親見得酬恩報德在其間示眾師云今朝臘月一事事應當急箇裏若茫然看孔須著楔莫待三十夜手腳做不及諸人還覺毛寒骨豎麼切忌卜度便下座臘八日上堂師云此一瓣香從雙徑諸德齎來要老僧拈向爐中熏我釋迦老子鼻孔為天下衲僧出氣還有不甘者麼僧問世尊睹星悟道今人見星為何不悟未審過在甚麼處師云秖為不見進云爭奈庭前梅樹已芳春師云你還聞麼僧便喝師云再喝看進云恁麼則禮拜去也師云且放過你問上無佛道可成下無眾生可度世尊於此日成道堪作什麼師云切忌眼花僧擬議師便喝問如來具五眼睹明星是那一眼師云你這一問是那一眼僧便喝師云喝即不無未具眼在僧復喝師云一喝兩喝後如何進云和尚請尊重師云闍黎不得造次乃拈拄杖云禪非解會道絕功勳妙體湛然真機獨露不可以心思不可以意想不可以言宣不可以默照不可以色見不可以聲求但一念回光便同本有恁麼則釋迦老子睹明星時見箇什麼來者裏透得頓越三祇坐斷報化佛頭隨時著衣喫飯還有向上一路即今釋迦老子在什麼處咦在諸人眼睫毛上放光動地只是不得動著動著則三十拄杖何故不見道丈夫自有衝天志不向如來行處行卓拄杖下座示眾舉張無垢居士參楚明禪師問入道之要明曰此事唯念念不捨久久純熟時節到來自然證入復舉趙州柏樹子話令時時提撕士久之無省謁善權禪師問此事人人有分箇箇圓成是否善曰然士曰為甚麼某無箇入處善於袖中出數珠示之曰此是誰底士俛仰無對善復袖之曰是汝底則拈取去纔涉思惟即不是汝底士悚然未幾留蘇氏館一夕如廁以柏樹子話究之聞蛙鳴釋然契入有偈曰春天月夜一聲蛙撞破乾坤共一家正恁麼時誰會得嶺頭腳痛有玄沙師云古人為道決不敢造次須是真參實悟方自信自入後來復見諸大老參證至徑山與馮給事諸公議格物慧曰公秖知有格物而不知有物格士茫然慧大笑士曰師能開諭乎慧曰不見小說載唐人有與安祿山謀叛者其人先為閬守有畫像在焉明皇幸蜀見之怒令侍臣以劍擊其像首時閬守居陝西首忽墮地士聞頓領深旨題不動軒壁曰子韶格物妙喜物格欲識一貫兩箇五伯慧始印可你看無垢既悟得乾坤共一家因甚到者裏自家茶飯又喫不下且道利害在什麼處這裏若會得許你們參得祖師禪若未會得切不可將之乎者也以當平生自欺欺人安知先覺不可欺者況先輩大儒已操戈入室不肯甘自埋沒今之衲子一百箇倒有九十九箇略得些光景便斷送一生矣可惜光陰易過歲不久留汝等珍重示眾師云今朝臘月十五夜半搥鐘擂鼓觀音入理之門到此休教妄鹵不妄鹵五九四十五五九四十五窮漢街頭舞不要舞春寒途中猶更苦顧視左右且道坐家堂底又作麼生喝一喝云休瞌睡下座立春日示眾拶破泥牛遍界春一回消息一回新江山不改舊時色指點諸人賞寂音除夕小參師云爆竹聲聲歷亂來煙雲陣陣過蒼苔老人兀坐山窗下閒看梅花笑滿腮還有道出常情者麼良久云天無蓋地無載萬象森羅無在不在春夏秋冬秖恁過於中不知誰主宰燈籠露柱最相親佛殿山門咸頂戴東村喫酒西村醉笑倒張家王小妹且道笑箇甚麼一年四季好風流此際分明都捉敗顧視左右云更有一事一發與諸人說破今夜小盡各各圍爐喫茶去元旦上堂維那白槌云法筵龍象眾當觀第一義師云看滿天甘露灑濛濛遍地森森點翠濃佛法不須重舉似大家齊唱太平風有麼有麼拈拄杖云如無老僧自拈自弄去也年年有箇新年頭今日新年事事周國泰民安無底事道人林下自優游山河大地也優游以拄杖作舞勢卓下云拄杖子豈不優游耶所以道當堂顯示只要知歸擬議之間白雲萬里喝一喝云且道目前一句作麼生殘雪已消千嶂冷和風纔起萬溪春驀擲拄杖下座示眾舉乾峰云舉一不得舉二放過一著落在第二雲門出眾云昨日有人從天台來卻往徑山去乾峰召維那云來日不得普請師拈云乾峰當時恰似誘人犯法好與三十棒雲門雖是見兔放鷹亦是忘前失後諸人到此切不得放過乾峰末後云來日不得普請底句雖然如是也是賊過後張弓頌云漁翁終日在灘頭釣得金鱗始便休放去收來風浪穩坐看明月下滄洲漫悠悠千尺絲綸任意浮活脫鰲頭驚卻餌蘆花汀裏去藏舟示眾舉世尊九十日在忉利天為母說法及辭天界下時四眾八部俱往虛空界迎有蓮華色比丘尼作念云我是尼身必居大僧後見佛不如用神力變作轉輪聖王千子圍遶最初見佛果滿其願世尊纔見乃訶云蓮華色比丘尼何得越大僧見吾汝雖見吾色身且不見吾法身須菩提在巖中宴坐卻見吾法身師拈云惜當時蓮華色比丘尼未解世尊太煞慈悲若解言下脫然雖然世尊只說得如來禪若撞著山僧見他恁麼來攔頭便棒管教他變去不得諸人還知落處麼良久云天共白雲曉水和明月流示眾舉夾山云我二十年住山未嘗舉著宗門中事一日有僧問承和尚有言二十年住山未嘗舉著宗門中事是否山云是便掀倒禪床山休去師拈云報恩當時若作夾山待這僧掀倒禪床時但云今日卻被闍黎啟請看他眼目定動劈脊便棒何待明日普請掘一坑令侍者請昨日問話僧來云老僧二十年只說無義話師云支離不少又云今請上座打殺老僧埋向坑中便請便請上座若不打殺老僧自著打殺埋此坑中始得師云雖用紅綿套子亦令人不快山僧若作這僧但進前云某甲罪過轉身拂袖便行何必潛去諸人委悉麼未會更為汝等頌出賓主繇來未作家遞相鈍置莫矜誇箇中若具拿龍手任爾風濤眼豈賒示眾舉石樓和尚一日纔見龐居士來便掩卻門云多知老翁莫與相見士云獨坐獨語過在阿誰樓便開門纔出被居士把住云是師多知是我多知樓云多知且置閉門開門卷之與舒相較幾何士云秖此一問氣急殺人樓不語師云二大老驀劄相逢如兩陣交鋒不無勝負至此石樓輸卻一籌報恩當時若作伊便道居士老老大大猶作這箇話會待他道弄巧成拙又道箇恰是可不完局耶即為諸人總頌出兩陣交鋒果是奇到頭嬴得這些兒當場一著擬強弱不避鋒鋩破禁圍閑翫賞弄旌旗收得頭來把尾歸咄示眾舉道吾因南泉云法身具四大否有人道得與他一腰褌吾云性地非空空非性地此是地大三大亦然泉不違前言乃與一腰褌師云道吾與麼道報恩則不與麼道性地本空空非性地一大如故三大亦然且道與古人是同是別若人簡點得出還我一腰褌有麼有麼示眾舉歸宗禪師泥壁次白侍郎來參宗便問君子儒小人儒白云君子儒宗乃打泥拓一下白遂過泥師著語云俊哉一是靈利宗接得便使良久云莫便是快俊底白侍郎否師著語云假醉揚惺亦是探竿影草白云不敢宗云秖有過泥分師云當時侍郎將成萬仞之山未進一簣之土山僧若作侍郎但應諾諾云和尚亦莫壓良為賤雖然要恁麼君子儒也甚難得諸人還知二大老龍象蹴踏非驢所堪麼到這裏切不得放過良久云莫將無事為無事往往事從無事生元宵示眾一燈續焰百千燈剔起眉毛繇未曾照得心空及第處方纔遠繼老南能示眾舉玉泉浩布禪因東坡居士微服相訪浩問云尊官何姓坡云姓秤是秤天下長老底秤浩唾地云這一唾重多少坡休去師云山僧若作東坡便道猶未出定盤星在不使這老漢一唾至今收不得還有人收得麼若收得也許伊識分兩顧視左右頌云識得眉毛眼上頭何須特地起戈矛氣吞宇宙渾無礙觸著風雷電捲收意綢繆漫看天涯一色秋這裏若還親薦得道人無事樂悠悠解制上堂師云春山青春水綠萬卉榮榮爭秀郁三三兩兩出林巒雲水悠悠自奔逐途中驀撞鐵蛇橫擬議遭他底塗毒咦諸人還過得麼僧問機關未動杲日當空撥轉之時為什麼乾坤猶礙師云從黑漆漆地來僧喝師云好一喝且道落在甚麼處僧作掌勢云和尚猶欠掌在師拈棒僧復喝師亦喝乃云九十日中眉毛廝結從今已去兩眼橫開爍破山河大地箇中無去無來驀豎拄杖云三世諸佛從這拄杖頭上興慈運悲歷代祖師從這拄杖頭上點化群迷天下老和尚從這拄杖頭上指東話西今日山僧一時捉敗眾中還有不甘者麼喝一喝卓拄杖云雲在嶺頭閒不徹水流澗下太忙生下座幻有和尚忌日師拈香云大明國裏這老漢兒孫省地盡道今日是忌日設供山僧則不然正是老漢大解脫底時節諸人還知落處麼若知得落處也許你們拈一分香便禮拜檀越請上堂師云老僧自解制後收起法幢封卻法鼓待汝等新建法堂再與你們說幾句無義味話不料今日嘉定張居士數百里來得得設供請老僧陞座掀翻般若懺滌愆尤還有超情離見者出眾遞相酬唱僧問超情離見即不問和尚向日道不盡底今日請垂一語師云你那裏得者消息來進云瞞我不得師云早是瞞了也僧便喝師亦喝乃拈拄杖云罪從心起將心懺心若空時罪亦空箇裏了然塵垢盡無邊障難悉消鎔雖然如是須如有向上一著始得悄然突出難辨端倪信手拈來豈容擬議驀豎拄杖云看喚作拄杖則觸不喚作拄杖則背速道速道道得亦出不得建化門頭道不得亦出不得建化門頭且不落建化門一句作麼生道卓拄杖云三世諸佛亦如是歷代祖師亦如是天下老和尚亦如是老僧亦如是諸仁者亦如是箇中有箇不如是者好與三十拄杖復偈云解冤釋結總非難只在當人一念間剔起眉毛從此會歸家樂業享餘年卓拄杖下座上堂師云今晨菩薩誕生為恒一芟染兼之南都諸友堅請陞座喝一喝云入山不畏虎兕力士之勇也入水不畏蛟龍漁人之勇也入林不畏佛祖機鋒道人之勇也衲僧家以何為勇麼僧問觀音此日出世居士圓頂方袍雖則人聖超凡何異原來不隔如何是全提不隔底句師云師姑原是女人做進云月出冰壺光照清虛之境如何是先照後用師云闍黎退後看進云風來水面魚聞性海之波如何是先用後照師云好與三十棒進云森羅顯煥以交輝杲日當空而獨麗如何是照用同時師喝和聲便打進云逢緣則事事皆真就理而時時普應如何是照用不同時師低頭良久進云照用已蒙師指示如何是不涉照用一句師直上視云還見麼進云與麼則彈指頓超華藏界箇中不動一毫端師云腳下看取乃云一塵不立猶在半途截斷眾流尚居門外且道到家一句作麼生顧視左右云觀音菩薩將錢買糊餅放下手時原來是饅頭到這裏直得如天普蓋似地普擎耳裏藏得須彌山眼裏著得四大海方有語話分恁麼則此人渾身坐在什麼處委悉麼數聲清磬是非外一箇閒人天地間復偈云堂堂已具丈夫相就裏還教識得渠今日分明親指示不須回顧更躊躕卓拄杖下座四月八上堂師云大千沙界百億須彌不動步而到且道是甚麼人行履處諸人還知麼問答不錄師乃云自從放出拿雲手隨波逐浪四十九只為普利於群迷月印千江隨人走年年有箇四月八人人盡稱生悉達雲門跛腳老阿師一棒拈來要打殺報恩今日則不然冷眼看來沒搕𢶍若將此語當禪宗後代兒孫坑陷殺咦雲門大師來也左右顧視云還見麼為汝諸人不唧溜隱入拄杖子裏去也喚作拄杖子又是雲門大師喚作雲門大師又是拄杖子這裏若分疏得下釋迦老子還他釋迦老子雲門大師還他雲門大師拄杖子還他拄杖子且道報恩老漢腳跟站在什麼處驀卓拄杖喝一喝下座示眾師云老僧一夏來未曾舉箇佛法若論佛法兩字也最難舉記得當時藥山向手中書一佛字問道吾是什麼吾云佛字山云這多口阿師據報恩今日說藥山只知他人多口不知自己多手老僧恁麼批判只見錐頭利不見鑿頭方諸人還知落處麼若知落處他日不得錯舉不知落處他日亦不得錯舉珍重上堂維那擬白椎林玹喝住云待我問了話白椎問云昔日黃蘗道大唐國裏無禪師如今大明國裏還有箇把麼師拈拄杖作打勢云看棒林便喝師亦喝林又喝便轉身云不是狂兒多意氣止因曾透上重關竟出師喝一喝林亦喝遙聞維那重白椎林乃高聲云歎你娘底死氣師良久乃云一向灰頭土面了無佛法判斷若箇伶俐衲僧當機不用打筭更有麼復云資生貴圖求富參禪貴圖求悟求悟若似資生箇箇成佛作祖大小高峰末後兩句云咄甜瓜徹蒂甜苦瓜連根苦恰似首尾不相照報恩則不然資生何必求富參禪何待求悟這裏直下承當人人本是佛祖喝一喝卓拄杖云炎天汗流脊解衣林下涼下座晚參師拽杖入堂云今日有則因緣不得不舉似大眾知道報恩偶得二貓林玹琇書記攜至方丈問老僧云那一箇好老僧指琇左手底云遮箇好琇驀擲下而去二貓皆洎死老僧問旁人云死了耶移時琇復入老僧曰你又來乃趁出琇曰老漢真箇無殺心至後老僧出貓猶放在地上琇見更與一踏貓亂輥老僧赶進琇已從別路出老僧拈棒直趁至門外打眾皆集琇轉身曰和尚也掙命老僧便打琇約住作掌勢老僧復抽杖打琇拗折拄杖擲地歸寮老僧復至寮外高聲曰你不知鼠底害只欲行祖師門下事琇在寮高聲答應曰說什麼祖師不祖師老僧曰與麼為甚踏殺貓琇曰和尚作這箇說話入地獄如箭射老僧低頭入方丈到這裏老僧性命洎合不存眾中有人代得一轉語相救老僧麼箬庵出眾云大眾和尚今日普請拂袖便出師云過去了也林玹厲聲云箭去西天十萬里猶在大明國裏擬議便退師卓拄杖云雖然如是不因漁父力爭得見波濤檀越請對靈小參師以拂子打圓相云靈覺昭然不滯空死生無異體元同當年信有這般事覿面相呈達此宗喝一喝云還會麼其或未然與你別資淨路無沉中陰以遲疑直捷一路到蓮池上品菩薩為伴侶拋卻人間五濁泥驀擲拂子示眾舉大慧禪師上堂舉須菩提巖中宴坐諸天雨華讚歎尊者曰空中雨華讚歎者是何人天曰我是梵天尊者曰汝云何讚歎天曰我重尊者善說般若尊者曰我於般若未曾說二字云何言善說慧喝一喝云當時若下得這一喝非但塞卻梵天口亦乃一千年後免被徑山簡點天曰尊者無說我乃無聞無說無聞是真般若慧又喝一喝云當時若下得這一喝非但塞卻須菩提口亦乃二千年後免被徑山簡點且道徑山還有遭人簡點處也無自云有甚麼處是遭人簡點處不合多口師云徑山老人如箇築漏洞底一般恰是築著空生梵天二漏洞且道自家漏洞還曾築著也未諸人若築得著道將一句來良久云不見道不合多口便下座示眾師云今朝七月一秋風漸漸急若是箇中人不用重重說他人難用力須教自打徹大眾且道打徹箇什麼驀豎拂子云八角磨盤空裏走露柱懷胎笑點頭下座檀越請對靈小參師云世尊時七賢女遊尸陀林見一屍一女指云屍在這裏人向甚處去一女應云作麼作麼其時諸姊皆悟無生即今智常楊氏其人不在其靈在此老僧恁麼舉揚還悟也未其或未然更與你別通消息偈云大千沙界一靈知無滅無生無所拘這裏若還親薦得蓮邦托質定無疑示眾舉翠巖真禪師因黃國博問百丈華長老既是百丈為什麼卻短小華云今日好天晴黃不契卻請真代語結緣真云且問將來黃再問真云須彌南畔把手同行黃佇思卻問意旨如何真云蚊子上鐵牛黃又佇思云不會請和尚為某甲說真云你離卻妻子來我與你說黃云秖如和尚還行得麼真云上藍寺裏送客一日行百十遭師云大小國博恁麼見解意欲勘驗諸方未到你在山僧今日也是扶強不扶弱眾中要箇扶弱不扶強底出來代他一轉語看若代不得切忌草草看古人因緣正如蚊子上鐵牛頌云三擒三放不知歸陸地行舟未可為箇裏要知端的意還他真正作家兒唐祈遠聖俞暨公巽昆季等眾居士請祝壽注堂師拈拄杖云香雲繚繞娑婆界瑞氣遙騰四大洲箇裏了然無別事酬恩報德一毛頭山僧一秋困倦拄杖子今日𨁝跳出來令山河大地草木叢林森羅萬象情與無情齊唱無生曲祝憲宰存憶翁壽三世諸佛立地聽諸人還委悉得麼若委悉得令彼合門眷屬令子賢孫歡喜歸憑三寶各各自修自證所以道悟則事同一家迷則萬別千差到遮裏若欲識得佛境界當淨其意如虛空遠離妄想及諸取令心所向皆無礙心既無礙事亦無礙事既無礙理亦無礙事理無礙事事無礙事事無礙如意自在舉拄杖云拄杖子豈不逍遙自在作書勢云要把南山寫君壽漫將東海作書池卓拄杖下座
