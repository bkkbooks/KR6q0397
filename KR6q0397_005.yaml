body:
  text: 嗣法門人通問等編荊溪磬山語録之三臘八日示衆僧問六年霜雪經多少夜半明星眼豁開睹明星事則不問釋迦老子向甚麼處安身立命師云腳跟下看進云恁麼則萬古宗猷全賴今日師拈拄杖云倚天長劍逼人寒進云祗樹生香草曇花匝地開也師以拄杖畫一畫云截斷葛藤進云還有知恩報恩一句請師道師云闍黎也須道一半進云大衆證明學人禮拜便禮拜師乃云把住也乾坤失色放行也草木生輝山僧今日也不把住也不放行作麼生商量還有知音者麼良久云今日瞿曇成道諸方老禿談玄惹動群情意地塞卻當人性天惟獨磬山白眼又被諸子綿纏到這裏阿呵呵説箇甚麼法要終不道一拿三只有箇蠻頌子與諸人通箇消息六載雪山清修練卻鍛身心如死灰縱然拶得明星現也是重添眼上眉黃面老子今日被山僧鈍置一上諸人證明還有不甘者麼出來道箇出格底句看一僧出才禮拜師劈脊便棒僧無語師云谷深連夜雪壓折幾株松示衆師云大衆大凡看古人公案不得造次須是腳踏實地見得古人落處然後著著自有出身之路不見當年報恩華和尚為佛智雪堂舉哀上堂舉大覺和尚順世謂衆云我有一隻箭子要付與人時有僧出云請和尚箭覺云汝喚什麼作箭僧便喝覺打數棒歸方丈次喚其僧來問汝適來會麼僧云不會又打數棒擲下拄杖云已後遇明眼人分明舉似報恩和尚云大覺平生用一隻箭子穿卻天下衲僧鼻孔因甚到遮僧面前折卻衆中莫有為大覺雪屈底出來與報恩相見有麼如無育王師伯薦福師叔亦未免喫報恩手中痛棒何故有功者賞師云大覺報恩二大老一箇鼻頭兩孔出氣正所謂殺人刀活人劍上古風規諸人切忌向此僧邊覓若也會得當堂拈出老僧即與你拄杖子若也不會且向蒲團上搜索一回始得卓拄杖云不是藍田射石虎如何識得李將軍立春示衆師云臘盡剎那際春光潑面來道人行履處不逐四時推驀豎起拄杖云你向未舉已前薦得猶是不堪更若末後承當自救不了所以道戢玄機於未兆釋迦彌勒攢眉藏冥運於即化臨濟德山卻步到遮裏拶得冷湫湫不別今時驀地裏開展浩浩然不離劫外既然如是且道和光同塵一句作麼生道卓拄杖云洞門老樹梅先放惹得遊人雜沓來示衆舉應庵和尚上堂舉僧辭歸宗宗問向甚麼處去僧云諸方學五味禪去宗云我遮裏只有一味禪僧問如何是一味禪宗便打僧云莫打某甲會也宗云你作麼生會僧擬開口宗又打黃檗聞云馬祖出八十四員善知識個個屙轆轆地惟有歸宗較些子圓悟師翁道若非黃檗深辨端倪洎乎勞而無功應庵老云二尊宿只解扶強不能扶弱若作一味禪入地獄如箭其或別有生涯何異鏤冰作玉且道節角在甚麼處驀拈拄杖卓一卓喝一喝師拈云應庵老漢具大人作略掀翻時人窠窟如虎口裏奪食著著自有出身之路諸人還見麼雖然若道不是一味禪埋沒歸宗若道是一味禪忽略應庵到這裏如何識得古人落處良久云天共白雲曉水和明月流示衆師云今朝是箇臘月半大事分明須了辦莫待臨時有屈伸解脫門開成大患堂中箇箇老成人著著拈來要方便言言見諦剔祖燈自古傳持吹毛劍吹毛劍有何驗當陽拈出隨人薦驀擲拄杖云洎合停囚長智便出堂示衆舉雲門道若説菩提涅槃真如解脫是燒楓香供養你若説佛説祖是燒黃熟香供養你若説超佛越祖之談是燒餅香供養你皈依佛法僧下去應庵云三百六十骨節八萬四千毛竅被雲門一棒打開了也還有為衆竭力底麼出來為雲門作主與歸宗相見師云雲門老人將三分真香熏天下衲僧鼻孔如截虛空作三節看不無氣蓋諸方應庵老人拈一條白棒總要穿卻亦是倚勢欺人大衆那裏是他一棒處若道雲門一棒打開怎奈伊分作三節判斷若道三分商量怎奈應庵一棒穿卻到遮裏有斷得者出來與磬山相見不惟撥開二大老關捩子亦為諸方雪屈有麼有麼良久喝一喝云雁飛不到處人被利名牽示衆舉歸宗和尚道參學人切忌錯用心悟明見性是錯用心成佛作祖是錯用心看經講教是錯用心行住坐臥語言三昧是錯用心喫粥喫飯屙屎放溺是錯用心一動一靜一往一來是錯用心更有一處錯用心歸宗不敢與諸人説破何故一字入公門九牛拽不出師云歸宗和尚慣用抽釘拔楔之鉗錘也是這般人始得若不如是洎被瞞過了也山僧則不然出家兒須知不錯用心處參禪見性是不錯用心處成佛作祖是不錯用心處看經解義是不錯用心處行住坐臥語默動靜是不錯用心處奔南走北幹辦常住是不錯用心處更有一處不錯用心我未敢與諸人通箇消息在何故一言既出駟馬難追你道磬山與歸宗是同是別試道看良久云復雨消殘雪開雲見遠山除夕示衆師云年年有箇除舊歲歲歲有箇新年來新舊不知誰改變去來無礙莫疑猜所以道已去無有去未去亦無去離已去未去去時亦無去已住無有住未住亦無住離已住未住住時亦無住巖頭和尚云大凡唱教須從無欲中流出三句祇是理論咬去咬住欲去不去欲住不住或一向不去或一向不住可見古人發言直透一覽大藏是故釋迦老子云我四十九年説法未嘗道著一字末上梢頭拈優鉢羅花道箇教外別傳密授心印也是臨風賣俏雖然大衆也須急著眼看驀豎起拂云且道與釋迦老子是同是別若道是同釋迦拈花山僧豎拂若道是異古今不二道聖凡無兩心也是鉢盂安柄然汝等若提掇得起便可丹霄獨步放曠自如識得祖祖相傳心心相印不見六祖示明上座云不思善不思惡正恁麼時如何是上座本來面目明便轉身問云上來密語密意外還別有意旨也無祖云我今與汝説者即非密也汝但返照自己本來面目密卻在汝躬深見祖師無一實法與人汝等會得便識得南泉示趙州平常心是道不屬知不屬不知知是妄想不知是無記若達不疑之道猶如太虛廓然豈可強是非耶還委悉麼若未委悉急須猛著精采汗出一回始得又不見當時茗溪和尚示衆云吾有大病非世所醫有僧持問曹山未審是甚麼病山云攢簇不得底僧云一切衆生還有此病也無山云有僧云既有因什麼不病山云衆生若病即非衆生僧云和尚還有此病也無山云老僧正覓起處不得今時人縱拶到遮裏不是望崖而退便於此處躲跟卻成窠臼若到磬山門下好與三十痛棒遮僧又問一切諸佛還有此病也無山云有僧云既有為什麼不病山云為伊惺惺你看曹山著著有轉身吐氣處汝等於此透得可以踏步向前便識古人到與不到才見得疏山在溈山會下聞示衆云行腳高士直須向聲色裏睡眠聲色裏坐臥始得時疏山出衆問云如何是不落聲色底句溈由豎起拂子疏山云此是落聲色底句溈山便歸方丈遮裏疏山失卻一隻眼遂不契乃辭香嚴嚴云何不且住疏云某甲與和尚無緣嚴云有何因緣不契疏山舉前話嚴云某甲有箇語疏云道什麼嚴云言發非聲色前不物正是以水投水似空合空疏云元來此中有人你他日有住處某甲卻來相見乃去溈山至晚問香嚴問聲色底矮闍黎在什麼處嚴云已去也溈云向汝道什麼嚴云某甲亦曾對他來溈云試舉看嚴云某對他道言發非聲色前不物溈云他道甚麼嚴云深肯某甲溈山不覺失笑云遮矮子我將謂他有長處元來秖在這裏他後設有住處近山無柴燒近水無水喫大衆可見古人勘驗學者實非細事切不得草草後疏山復造大溈安和尚處聞示衆曰有句無句如藤倚樹乃問忽然樹倒藤枯句歸何處溈山放下泥盤呵呵大笑噫溈山老人一笑直至如今笑不休何故今時有等無地頭漢死葛狚逐句下個注腳自瞎猶可更瞎他人可不更使溈山笑轉新也山僧見昔日有箇俗漢也不曾參禪也不曾慕道剛在馬祖庵前過即石鞏也問馬祖云有鹿過否祖云汝是什麼人鞏云我是獵人祖云汝既獵人善射否鞏云善射祖云一箭射幾箇鞏云一箭射一箇祖云汝不善射鞏云師善射否祖云善射鞏云一箭射幾箇祖云一箭射一群看他鉤頭有餌鞏云彼此皆是生命何得射他一群一釣便上祖云你恁麼何不自射驀頭一劄石鞏到遮裏露出本來面目便云若教某自射無下手處祖抗聲大喚云遮漢曠劫無明從此蕩盡鞏便擲下弓箭正所謂牢籠不肯住呼喚不回頭千聖絶安排至今無住所你看石鞏是箇俗漢子於馬祖言下便道無下手處可不超過曹山了也乃舉拂云大衆已上一隊老漢皆是大宗匠赤手提持今夜被山僧拂子穿卻鼻孔擲向諸人面前還見麼若見得便好孤峰絶頂蟠結草庵無心出世而譽播寰區無心濟物而德洽湖海到遮裏年窮歲盡且道徹頭徹尾一句作麼生道喝一喝云驪龍不臥澄潭水猛虎還藏深谷林旦日示衆師以拂打一圓相復拋後云新年頭上佛法信手拈來豁達撞著無位真人打算全無合煞剛道拾隻達磨皮鞋放下時元來是憨布袋破衲一年四季好風光枝頭春鳥喃喃嘴又滑聒聒狼藉幾多沒搕𢶍喝一喝云日月明天象山河壯帝都示衆舉雲門云你若不相當且覓箇入頭處微塵諸佛在你舌頭上三藏聖教在你腳跟底不如悟去好還有人悟得麼出來對衆道看師云雲門老人雖慈悲之故而有落草之談山僧若在衆中便道恁麼則不相當也何故不見他將佛法賤使今日衆中有人出來掀倒禪床喝散大衆山僧劈脊便棒且道是賞伊是罰伊燈節示衆師云光前薦得截斷衆流照後知歸踢翻影像不是依依稀稀零零落落當得平生直饒得似澄潭月影靜夜鐘聲隨扣擊以無虧觸波瀾而不散猶是生死岸頭事明則普天匝地明暗則普天匝地暗要且明不自明暗不自暗所以道當明中有暗勿以暗相遇當暗中有明勿以明相睹不見當時百丈深撥溈山便知落處龍潭吹滅德山忽爾洞然老僧今晚也不用吹滅也不用深撥驀豎拂子云大衆還見麼於此見得徹去人人常光現前個個壁立萬仞順逆卷舒縱橫自在正與麼時且道應時及節一句作麼生道良久云巖上雪消春水瀏庭前玉綻蝶梅香示衆林皋問雲影到山賓作主溪聲入海主為賓賓主歷然如何施設師舉如意云還見麼進云敢謂是和尚為人處也無師云知則不問進云騰騰煙雨裏春濤送客新師云且過一邊進云臨濟大師道我於黃檗先師處喫三頓痛棒如蒿枝拂相似為是報恩耶伸冤耶師云你還知麼進云和尚在禹門大師處曾喫棒也無師云老僧忘卻了也進云恁麼則法法盈千古燈燈焰不晦便禮拜師云聽取乃云當臺顯露觸處洞然豈容鑿壁偷光覿面提持隨方應用那許顢頇取性若是作家戰將不必如之若何如其臨陳遲疑未免機前失照所以道決行者不顧於後決戰者不顧於首登山須到頂入海須到底入海不到底不知滄溟之淵深登山不到頂不知宇宙之寬曠是以古人三登投子九上洞山只為端的此事直得劄劄地打風打雨浩浩然蓋地蓋天不見德山老人見人入門便棒臨濟大師見人入門便喝從上宗乘如是作略山僧雖是他家兒孫不用遮些茶飯且道即今當陽直指一句如何為衆通箇消息驀豎如意云看若將遮箇名如意昧卻當人底本來示衆舉僧問雲門佛法如水中月是否門云清波無透路僧云和尚從何得門云再問復何來僧云便與麼去時如何門云重疊關山路師云雲門老人此三轉語內有函蓋乾坤句有截斷衆流句有隨波逐浪句山僧今日一一點破可惜當時遮僧水中捉月若人透得許伊親見雲門若不如是佛法猶未夢見在參中秋日謝新舊頭首執事示衆師云宗風不墜全憑作者提撕法道流行須藉賢能酬唱表帥得人紀綱斯立視虛空遍界為一室攝情與無情為同參到遮裏法法全彰心心無間事理圓融權實並用退之者安間修證進之者勇猛嚴持不進不退一句且作麼生道喝一喝云秋月長夜涼山桂滿庭香好箇真消息從君漫度量示衆舉僧問風穴古曲無音韻如何和得齊穴云木雞啼子夜芻狗吠天明妙喜云這黃面浙子恁麼答話也做他臨濟兒孫未得在今日或有人問徑山古曲無音韻如何和得齊只向他道木雞啼子夜芻狗吠天明師云妙喜老人直饒恁麼答亦未作得風穴兒孫磬山則不然有人問古曲無音韻如何和得齊但與他道天明芻狗吠子夜木雞啼示衆師拈拄杖云今朝十月一秋光漸漸歇報道冬令嚴籬頭吹觱篥邪説混世間拄杖一條直阿呵呵且道笑箇甚麼笑他偷心人不得祖師訣驀擲拄杖下座示衆舉雲門云盡十方世界乾坤大地天下老和尚以拄杖畫一畫云百雜碎師云雲門和尚只解放不解收山僧今日拄杖子在手亦道盡十方世界云云以杖卓一下云總在遮裏雪竇云遮老漢是即是要且無有出身之路如今拄杖在雪竇手裏復橫按云東西南北甚處得來師云雪竇老人但知收不知放山僧則不然而今拄杖子在手卓一下云要東便東要西便西要南便南要北便北到這裏還有全放全收者麼喝一喝云豈容淺見衲僧會惟許通方作者知誕日示衆師拈拄杖云老漢今年五十九諸人要我揚家醜自從一腳踏地來不落人前與人後記得東村陳媽媽卻道無生生已就喝一喝卓拄杖云且道拄杖子幾時生耶道得亦三十拄杖道不得亦三十拄杖何故不見道賞罰要分明以拄杖畫一畫云且置是事仰勞大衆起居萬福示衆師拈拄杖云今朝乃是十月半戶債糧租要打算十方雲水一無憂本分應須急早辦閻羅天子甚分明出入公私平等判若還這裏有虧缺世世管教填不滿咄不涉陰陽迥然一句合作麼生道良久云本來無一物何處惹塵埃雖然如是今時有等不識好惡便謂是偏見也他時喫鐵棒有日在莫言不道驀卓拄杖云羚羊挂角無蹤迹更有羚羊在上層結制示衆僧問十方聚會共學無為千指駢臻願聞法要如何是和尚為人句師云舉目皆是進云恁麼則普天匝地從人薦滯義承言空自迷師云也許闍黎啓請進云昔石屋云福源今日結制不得不為諸人議定第一從朝至暮舉足動步不許踏著常住地第二十二時中不許諸人鼻孔裏出氣此間結制又作麼生師云汝為我判斷了也僧禮拜師乃云磬山不蓄一文錢要與諸方共結緣終日秖餐無米飯定教打徹祖師關且道如何是祖師關劄適才二三僧問話各各有箇落處諸人還知麼若知則門門有路若未知直饒當堂顯露猶落第二門頭驀劄知歸未是本分一著擬之則差強之則隔近之則遠向之則背且道不向不背不近不遠不強不隔不擬不差一句又作麼生道所以聲前一句千聖不傳學者勞形如猿捉影這裏透得何須立期立限畫地為牢遮裏未透且高挂鉢囊向七尺單前豎起脊梁坐斷衆流一念不生前後際斷直至威音那畔更那畔慢慢蘇醒轉來攪長河為酥酪變大地作黃金亦不為分外事要須到遮田地始得若未到遮田地將古人言句妄生穿鑿道遮是甚麼句那是甚麼句饒你穿鑿到彌勒下生也只是個恁麼不見巖頭老人云若有一法繫綴人土亦難消況信心檀越脂膏耶諸人既信向老僧特入深山扣己所參切須仔細古人云塵勞迥脫事非常緊把繩頭做一場不是一翻寒徹骨怎得梅花撲鼻香擲下拂子云珍重黃介子薦考請小參師云靈源湛若覺體自如迥脫根塵高超物表迷之者永劫輪回悟之者當時闃寂澄江居士黃介子為先考彙所元公九月二十八日捐館至今六七飢不思食睡不安枕晝夜忘疲哀痛無已浼友作書特託棲禪入山人天衆前燒香設供乞山僧舉揚般若薦拔先靈若論此事向居士未舉念處山僧未啓口時大解脫了也其或遲疑不妨起模畫樣以拂子打圓相召大衆云看遮裏會得圓明了知無欠無餘不見道身從無相中受生猶如幻出諸形象幻人心識本來無罪福皆空無所住既無所住亦無所去既無所去寧有來耶無去無來無住故湛然常寂心境一如不被三世之所拘如是且道彙所居士即今安身立命在甚麼處識得他安身立命便識得自己安身立命處識得自己安身立命便識得諸佛諸祖安身立命處識得諸佛諸祖安身立命便識得一切蠢動含靈安身立命處到此便知佛與衆生平等煩惱與菩提平等生死與涅槃平等西方與東土平等近亦得遠亦得動亦得靜亦得生亦得死亦得來亦得去亦得得無所得無去無來無生無滅無動無靜無遠無近恁麼則即今追薦一句作麼生道驀拍香几云彈指頓超華藏界剎那擊碎涅槃城下座示衆師云大衆都下埠老僧獨看庫雖無一物中也須要保護露柱與燈籠笑他間底苦苦苦苦口説甚分明心裏至妄鹵堆堆守箇間驢年成佛祖衆中有個孟八郎漢出來道大小磬山動靜裏見人放你三十棒且道是賞伊是罰伊驀擲下拄杖冬至示衆僧問暑往寒來即不問冬至陽生事若何師云形興未質進云正當恁麼時如何師云腳下看取又僧問萬法歸一萬法則不問如何是一師拈拄杖云你還識這箇麼云不識師云誰道不識進云未審一歸何處師卓拄杖一下僧擬議師便打乃復卓杖云陽消則陰至陰極則陽生陰陽未判時試問誰作主今見書雲日物物轉機爾惟有這些兒無動無靜旨遮裏若委悉得生陰也在遮裏生陽也在遮裏生天也在遮裏生地也在遮裏生人也在遮裏生物也在遮裏上則有君下則有臣尊則有父卑則有子內則有理外則有事到遮裏理無事外之理事無理外之事事理圓融權實並用恁麼即今應時及節一句作麼生道擲拄杖云識得一陽才動處森羅萬象掌中看檀越請小參師云妙性圓明離諸名相本來無有世界衆生因妄有生因生有滅生滅名妄滅妄名真真既不立其妄本空不意釋迦老子到遮箇田地而今現前大衆若僧若俗若男若女若老若少若高若下還能離諸名相得達妙性圓明否只因各守其名各執其相故不得見本來面目山僧今日與你諸人通箇消息高著眼看以拂子打圓相云遮裏薦得也無僧也無俗也無男也無女也無老也無少也無高也無下轉愚癡為般若易短壽為長年恁麼時山還是山水還是水僧還是僧俗還是俗男還是男女還是女老還是老少還是少高還是高下還是下不得動著一絲毫動著則與你三十拄杖委悉麼不見道具足凡夫法凡夫不知具足聖人法聖人不會聖人若會即同凡夫凡夫若知即是聖人左右顧視云還知麼聖賢俱是凡夫做祇恐凡夫心不堅驀擲拂子示衆師云四十年來端為禪半肩風月只隨緣尋常簡點無欺處才向煙波擲釣竿以拄杖作釣勢云不惜性命者上來吞餌僧問信施營齋法王升座財法二施兼周未審無事衲僧憑何報德師橫呈拄杖進云與麼一粒一莖布雲水鉢中咸成菩提種草或語或默與寶華座下胥為大道標模師云禮拜著進云古人道大家相聚喫莖虀喚作一莖虀入地獄如箭又道喫粥了也洗鉢盂去雖總殘羹剩飯試問是別是同師云你還待第二杓惡水麼進云不明先聖門中事逐隊饔飧實可危師云放你三十棒僧禮拜師乃云道本無方因方故迷心本無住因住故執執之則觸途成滯迷之則背覺合塵念念攀緣矻矻造業故經云一切衆生皆由不知當住真心性淨明體用諸妄想此想不真故有輪轉若能一念回光返照直下見得廣大心體無有邊涯際畔則不被生滅妄緣之所流轉也於是一念清淨一念清淨故則一身清淨一身清淨故則一世界清淨一世界清淨故則無量無邊世界清淨諸人還到遮田地麼若未到遮田地切不可以無明為佛性將煩惱作菩提日用現行更須仔細不見當時龐居士云難難難十擔油麻樹上攤龐婆出來道易易易百草頭上祖師意靈照女又道也不難也不易飢來喫飯困來睡據山僧見處此三老有一人行到説不到有一人説到行不到有一人行到説亦到若人簡點得出許你一生參學事畢正與麼時一句又作麼生道當陽直截能開悟萬別千差總一般示衆師云今朝臘月一玉峰打供給試問兩堂僧報德作麼説有性燥者出來對衆道看僧問同門出入玷辱宗風別路資生難謾作者今日玉峰法叔臨筵且禹門得力句如何舉似師豎起拂子進云三級浪高龍臥穩九天雲淨鶴飛遙師云武陵溪水向西流進云恁麼則大衆咸欣也師云闍黎道箇末後句看進云不是久參洎合打失鼻孔便禮拜師云缺卻半邊也乃云祖師巴鼻迥迥撩天獅子爪牙獰獰踞地得之者群魔喪膽用之者百獸腦裂且道誰是其人不見我臨濟大師道有時一喝如金剛王寶劍有時一喝如踞地獅子有時一喝如探竿影草有時一喝不作一喝用驀喝一喝云且道遮一喝是金剛王寶劍耶是踞地獅子耶是探竿影草耶是一喝不作一喝用耶若道是金剛王寶劍如何是踞地獅子若道是踞地獅子如何是探竿影草若道是探竿影草如何是一喝不作一喝用遮裏識得堪作濟下兒孫遮裏未識得切莫胡喝亂喝直饒你喝得虛空落地猶未在且將我遮一喝入於四喝之中不見有一喝之相亦將四喝入我一喝之內不見有四喝之名到遮裏你還分得那一句是賓那一句是主不見谷隱老人云一喝分賓主照用一時行會得箇中意日午打三更你還知麼不是祖師親嫡印直饒動地野干鳴復舉龍牙道雲居師兄得第二句我得第一句師云大小龍牙得便宜處失便宜山僧則不然我玉峰師弟得第一句我得第二句且道與古人是同是別諸人會得許你具一隻眼若無山僧自道去也驀擲拂子云南山起雲北山下雨臘八日示衆師拈拄杖云握毗盧印撥向上機赤手全提通身擔荷且道誰是其人還有知恩報恩者出衆相見僧問釋迦老子今日成道乃云一切衆生皆具如來智慧德相但以妄想執著而不證得如何是妄想師云立人立我進云如何是智慧德相師云忘我忘人進云恁麼則無明實性即佛性幻化空身即法身釋迦老子又云而不證得不證箇甚麼師云不是德相麼僧禮拜云若非今日親承示洎乎話作兩橛師云一面底道將一句來看進云也是臘月裏蓮花師以拄杖畫一畫云更有問話者麼乃云既釋迦今日打失鼻孔諸人還知他落處麼若也知得他落處便好向今事門頭接物利生如或未知且向七尺單前研窮至理適才僧問世尊今日成道歎云奇哉一切衆生皆具如來智慧德相但以妄想執著而不證得妄想老僧道破了也殊不知世尊百劫千生已曾證得今日是開權顯實化利群迷道箇立人立我忘我忘人恁麼也不得不恁麼也不得不見石霜云休去歇去一念萬年去寒灰枯木去古廟香爐去一條白練去冷湫湫地去雲峰又道不休不歇去業識茫茫去七顛八倒去十字街頭鬧浩浩地坐臥去三家村裏盈衢塞路荊棘裏遊戲去刀山劍樹劈腹剜心鑊湯爐炭皮穿骨爛去如此舉唱大似三歲孩兒輥繡毬你看二大老各資一路山僧則不然今日將三條篾纜緊緊縛卻擲在無底坑裏也不許休去歇去也不許不休去不歇去動著則三十棒有箇旁不甘者出來道磬山老漢有甚長處喝一喝云丈夫自有沖天志不向古人行處行示衆師豎起拳召大衆云捏聚也由遮箇舒手云放開也由遮箇若遮裏識得根源管保歸家穩坐還有遞相證據者麼良久云如無山僧為你們打葛藤去也風雨蕭騷塞汝耳根落葉交加塞汝眼根香臭藂雜塞汝鼻根冷熱甘甜塞汝舌根衣綿溫冷塞汝身根顛倒妄想塞汝意根古人恁麼道山僧則不然風雨蕭騷開汝耳根落葉交加開汝眼根香臭藂雜開汝鼻根冷熱甘甜開汝舌根衣綿溫冷開汝身根顛倒妄想開汝意根遮裏若透得通身受用了無障礙其或未然真是平地骨堆更聽取一偈根塵識得原初體縛脫何曾兩樣來遮裏不隨聲色轉無勞動步出三災參檀越請示衆師云霜風夜夜吹人老此事誰能端的來不是一番親證得如何脫得暑寒推還有不涉陰陽地者出衆道看良久云如無山僧再與你們打葛藤去也諸佛與一切衆生惟是一心更無別法此心非大非小非長非短無垢無淨不生不滅猶如虛空不可測度超過一切限量名言蹤迹對治當體便是動念即乖既乖此心便有十法界之分何謂十法界諸佛菩薩緣覺聲聞此四聖之法界也天人阿修羅餓鬼畜生地獄此六凡之法界也諸佛法界者從四無量心萬德莊嚴之所成也菩薩法界者識得當體即空修六度萬行之所成也緣覺法界者以十二因緣為本行之所成也聲聞法界者轉四諦法離苦集滅道之所成也天道法界者精修十善之所感也人道法界者嚴持五戒之所感也阿修羅法界者鬥爭堅固瞋恚之所報也餓鬼法界者慳貪鄙吝之所報也畜生法界者癡心橫想之所報也地獄法界者十習六交之所報也這裏一念回光直下見得本來便能超凡入聖透出法界之量諸人既入深山各須努力究取一回以悟無生不見龐居士將家財悉沉湘江道有男不婚有女不嫁大家團圞頭共説無生話一日又謂靈照女曰明明百草頭明明祖師意汝作麼生會照曰這老漢頭白齒黃猶作這個見解士云汝又作麼生照云明明百草頭明明祖師意師驀豎起拂子云山僧今日亦有一問這是百草頭這是祖師意若道是祖師意如何是百草頭若道是百草頭如何是祖師意諸人會得對衆通箇消息如若不會卻被山僧拂子穿卻鼻孔了也擲下拂子云你作麼生打脫去參除夕示衆師拈拄杖云巖石積經霜迸裂庭梅疊壓雪凋殘人生百歲終何用此道誰能著眼看莫有箇念茲在茲者出來道看僧問年窮臘盡事如何師指爐云一炷清香遍十方僧禮拜師乃云適來這僧問箇年窮臘盡且道如何是遷即不遷之義今年除歲也恁麼舊年除歲也恁麼明年除歲也恁麼直饒你除到眼光落地四大分張也只是恁麼終無了期將何以敵生死老僧四十年來參之究之研之窮之猶是恁麼大衆又作麼生此事要實悟實證實行實踐始得到這裏拄杖子𨁝跳出來道今夜是什麼時節説這些牽牽蔓蔓話不見道有物先天地無形本寂寥能為萬象主不逐四時凋驀喝一喝云也是牽蔓説話且直截一句如何道大衆各各歸堂喫茶去和聲擲下拄杖旦日示衆師云好箇新正日雨打千山濕人人有生緣這裏無間歇傾湫倒嶽鎮常靜一念萬年終不回左右顧視召大衆云伏惟珍重示衆師拈拄杖云白日以消千嶂雪清風吹散一天雲道人活計隨時用信手拈來不是塵有知音者出來遞相酬唱僧問雪覆千山則不問孤峰不白事如何師云直上看進云雲開碧岫千林曉日照晴沙萬壑明師便喝進云恁麼則瓦解冰消去也師云為什麼如此進云太虛問一色親見普賢王便禮拜師云且去乃云昨夜三更時分文殊普賢二大士口喃喃地道助揚法化及至天明都走向無生國裏剛剛剩得一條楖栗拄杖橫拈倒用都合其宜一觸觸著帝釋鼻孔東海鯉魚打一棒雨似傾盆或云遮是雲門扇子不是德山拄杖若道是雲門扇子又是德山拄杖若道是德山拄杖又是雲門扇子即今在山僧手裏驀卓一下云諸人還定奪得出麼若定奪得出也有權也有實也有照也有用殺活縱奪總在遮裏且得力一句又如何道復卓一下云懸崖路絶承渠力斷橋溝缺賴伊扶檀越請示衆師云大道寥寥像季年不拘朝市與林間但能一念回光照報德酬恩總現前顧左右云且道誰是知恩者到菩提場斷煩惱路開智慧門坐無生國未為好手何故日用無回互當機有卷舒驀豎起拄杖云大衆急著眼看卓一下云天得之以覆育地得之以生成君王得之恩被萬物群臣得之報國祐民且道衲僧家得之又如何施設林玹驀掀倒香案云截斷天下人舌頭便出堂師擲下拄杖擎兩手作修羅勢振威一喝便下座兩旁顧視一衆失色師復轉身召云大衆便歸方丈玹隨後禮拜云適來觸怒和尚師云好與三十拄杖隨聲拈棒玹逆上掌云即今便打説甚好與師亦打玹約住拄杖師注視玹即聳拄杖云須還遮老漢始得師擲下拄杖大衆作禮衆請小參僧問如何是不通涓滴底句師云漫天漫地乃云當臺顯露誘引初機覿面提持猶為晚進箇中無向背此際絶淆訛不可以智知不可以識識驀豎起拂子云恁麼恁麼會得豎窮三際放下拂子云不恁麼不恁麼會得橫遍十方復豎起拂子云恁麼不恁麼會得輝騰日月放下拂子云不恁麼恁麼會得超越古今若向坦坦平平處入須是兀兀突突處全彰若向兀兀突突處入須是坦坦平平處放下若不如斯饒你喝似雷轟棒如雨點掀翻四大海躍倒五須彌未是衲僧本分事且道如何是衲僧本分事一念頓超塵劫外千峰齊立下風吹薦亡請小參師以拂子打圓相云靈光獨耀照破罪性之本空智鑑常明見徹因果之報實因果報實故須懺纍劫之愆尤罪性本空故以證無生之實際逍遙於三界之中放曠於六塵之外不見有一法可生不見有一法可滅生滅既滅寂滅現前正恁麼時儲茂士向何處安身立命驀豎起拂子云莫不在拂子頭上得大解脫且道轉身一句又作麼生打一拂子云一拂打開生死路翻身步步踏金蓮解制示衆師云木馬正嘶雲影去泥牛長臥石臺邊箇中消息誰能解切忌當機著意猜還有性燥者麼僧問倏忽九旬已度平等室內安居掩息如灰即不問隨流得妙事如何師云腳腳踏著去進云與麼則箇中一物無歸家罷問途頭頭明歷歷坐斷古毗盧師云逢人切莫錯舉問古帆未挂時如何師云坦坦平平地進云挂後如何師云波浪滔天乃云春色融融百草頭邊明祖意春風蕩蕩一瓢瀟灑樂天涯不用寒巖兀兀何消定水澄澄直得緊峭草鞋橫擔楖栗千峰萬峰絶蹤絶迹塵塵獨露物物全彰隨緣放曠應用無虧所以道未有常行而不住未有常住而不行欲益無所益欲為無所為聚則如雲歸谷散則似月臨溪不聚不散一句合作麼生道良久云間來獨坐當軒下漫看花枝自短長本師幻有大和尚忌日掃塔師云這老漢當時不提一箇元字腳直是教人無可奈何不肖今日拈一瓣香不是報德酬恩亦非雪怨伸屈顧視左右云冤有頭債有主不是時人無本據便拈香
