body:
  text: 嗣法門人通問等編徵古舉臨濟兩堂首座齊下喝僧問還有賓主也無濟云賓主歷然天童拈云殺人刀活人劍在臨濟手裏雖然如是當時便與一喝直饒大逞神通也秖得同聲相應萬松道當時若問兩堂首座齊喝還有賓主也無咄云賓主歷然臨濟有語無喝天童有喝無語如今殺人刀活人劍在萬松手裏師徵云若是有語又落在臨濟手裏若是有喝又落在天童手裏若道亦語亦喝也出不得臨濟天童手在若道非語非喝敢謂萬松無分且道那裏是殺人刀活人劍衆中還有擇得出者麼喝一喝舉大耳三藏得他心通朝見肅宗皇帝帝命忠國師驗之藏見國師便禮拜側立於右國師云汝得他心通是不藏云不敢國師云汝道老僧在甚麼處藏云和尚一國之師何得在西川看競渡船國師再問汝道老僧即今在甚麼處藏云和尚是一國之師何得在天津橋上看弄猢猻國師第三問老僧即今在什麼處藏罔知國師叱云野狐精他心通在什麼處有僧問趙州三藏三番為甚不見國師州云在三藏鼻孔上又問玄沙既在鼻孔上為甚麼不見沙云秖為太近後僧問海會端端云國師若在三藏鼻孔上有甚難見殊不知在三藏眼睛裏天童云三藏不見國師且置你道國師自知下落處麼師徵云這一隊老漢恰如盲人摸象總未知國師下落處在諸人還知國師下落處麼若知得國師下落處許你他心通舉雲門示衆云直得觸目無滯達得名身句身一切法空山河大地是名身亦不可得喚作三昧性海俱備猶是無風匝匝之波直得亡知於覺覺即佛性矣喚作無事人更須知有向上一竅在師徵云還知麼雲門大師語句一一與修多羅合也要諸人簡點直饒透得過須知有向上一竅且道如何是向上一竅參舉石頭問長髭甚處來髭云嶺南來頭云大庾嶺頭一鋪功德畫了未髭云畫了秖欠點眼在頭云莫要點麼髭云便請頭垂一足師徵云長髭既善畫大庾嶺頭一鋪功德而不善點眼者何也還知麼今時人畫亦未就而先自點眼不知瞎了多少人也衆中還有請點眼者麼僧云有師手搖云我也知你畫未就在舉僧辭大隨隨問甚麼處去僧云峨眉禮普賢去隨豎起拂子云文殊普賢秖在這裏僧畫一圓相拋向背後隨云侍者將一貼茶與這僧師徵云且道大隨是賞伊是罰伊衆中有人道得老僧付你拂子去舉三聖道逢人則不出出則便為人興化則不然逢人則出出則不為人師徵云二大老一者逢人則出一者逢人則不出且道逢什麼人諸人還識得麼舉黃檗云若擬著一法印早成也印著有即四生文現印著空即空界無想文現但不印一切物此印與虛空等師徵云不著有不著空印即是不印即是試道看又云喚甚麼作印舉興化和尚示衆今日不用如何若何便請單刀直入興化為你證據時旻德長老出禮拜起便喝化亦喝旻德又喝化亦喝旻德禮拜化云若是別人三十棒一棒也較不得何故為你會一喝不作一喝用師徵云賓家也喝主家也喝且道那裏是他一喝不作一喝用或有人亦喝老僧道且謾且謾我也曉得你一喝不作一喝用且道是語與興化同也異也師復喝一喝舉雪巖禪師上堂云道在日用日用不知飢只喫飯寒只添衣晴天愛日挂枯藜點簡溪頭梅樹向陽偷放南枝師徵云還灼然會得麼若會許你識得臨濟大師人境俱不奪之句雖然直須親到若不親到也是抱樁搖櫓有甚麼用處舉仰山問溈山如何是西來意溈云大好燈籠仰云莫只這箇便是麼溈云只這箇是什麼仰云大好燈籠溈云果然不識師徵云汝等參詳也未且道當時仰山會得西來意恁麼酬不會西來意恁麼酬你若道會溈山又道果然不識若道不會仰山又道只這箇便是會與不會且置如何是西來意舉興化道三聖逢人則不出出則便為人興化則不然我逢人則出出則不為人雪巖頌云弄晴微雨濕春風柳自青青花自紅寄語遊人急回首歌樓不在畫橋東師徵云你看二大老作略被雪巖翁一頌徹骨徹髓撒向諸人面前了也還會麼若會得為人也得不為人也得如未會為人也不得不為人也不得參舉僧問趙州和尚學人乍入叢林乞師指示州云喫粥了也未僧云吃粥了州云洗鉢盂去其僧有省師徵云今時叢林或三百五百那箇不知道喫粥了洗鉢盂去且道當時其僧省箇什麼舉祖師道執之失度必入邪路放之自然體無去住師徵云且道執又執箇什麼放又放箇什麼你向不執不放處道將一句來看舉雲門普請搬柴次門拈一片拋下云一大藏教秖説這箇師徵云既是一大藏教秖説這箇何故又道教外別傳諸人試説看若説得許汝通一大藏教舉臨濟行腳到龍光值上堂濟出問不展鋒鋩如何得勝光據座濟云大善知識豈無方便光瞪目云嗄濟以手指云這老漢今日敗闕也師徵云臨濟大師行腳時氣吞諸方如獅子遊行自無伴侶雖然太露鋒鋩了也諸人不展鋒鋩道將一句來看舉僧問洞山相逢不拈出舉意便知有時如何洞乃合掌頂戴師徵云且道洞山是肯伊是不肯伊舉僧問雲門十二時中如何即得不空過門云向甚麼處著此一問僧云學人不會請師舉門云將筆硯來僧乃將筆硯來師徵云諸人十二時中莫空過不若空過常時碌碌若不空過終日間間看取雲門大師遂題其頌曰舉不顧即差互擬思量何劫悟參舉僧問法眼如何披露即與道相應眼云汝幾時披露即與道不相應師徵云相應不相應且置汝等還曾披露也未若披露老僧許你相應若未披露管教不相應在咄舉金剛經云若見諸相非相即見如來法眼云若見諸相非相即不見如來天童拈云世尊説如來禪法眼説祖師禪會得甚奇特不會也相許師徵云天童恁麼和會將來也要諸人簡點磬山道如來禪祖師禪即不問你向諸相中指出箇非相來看拈柱杖云切忌動著動著則打折你驢腰舉溈山坐次仰山入來溈云寂子速道莫入陰界仰云慧寂信亦不立溈云子信了不立不信不立仰云秖是慧寂更信阿誰溈云若恁麼即是定性聲聞仰云慧寂佛亦不立師徵云快哉你看仰山如珠走盤縱橫無礙還識得麼如識得即向前速道速道莫入陰界舉洞山云體得向上事方有些子語話分僧問如何是語話山云語話時闍黎不聞云和尚還聞不山云不語話即聞師徵云藏身處沒蹤迹沒蹤迹處莫藏身洞山老漢得之矣咦汝等還聞麼若聞須知有向上事若知向上事聞與不聞遠之矣舉僧問首山如何是佛山云新婦騎驢阿家牽云未審此語什麼句中收山云三玄收不得四句豈能該云此意如何山云天長地久日月齊明師徵云還識得首山老漢紫羅帳裏撒真珠麼有僧問如何是紫羅帳裏撒真珠師云阿家牽驢新婦騎會麼云不會師云切忌妄生穿鑿舉僧問新興如何得出三界去興云汝還信麼云信則深信乞師慈悲興云秖此信心亙古亙今快須究取何必沉吟要出三界三界唯心師徵云既是唯心有什麼出入衆中有人道取一句看更聽頌云若得信心無古無今非舍非取有韻有吟空觀三界即達唯心舉僧問灌溪如何是一色溪云不隨僧云一色後如何溪云有闍黎承當分也無師徵云今時人造到這裏都坐在一色邊還知灌溪老答處麼直饒明得到磬山正好喫棒舉三聖問僧近離甚處僧便喝聖亦喝僧又喝聖亦喝僧云行棒即瞎便喝聖拈棒僧乃轉身作受棒勢聖云下坡不走快便難逢便棒僧云這賊便出去次有僧問適來爭容得這僧聖云是伊見先師來師徵云若識得三聖與此僧交鋒處堪為濟下兒孫且道次僧恁麼問三聖答他道是伊見先師來是肯伊不肯伊時有僧欲進語師即喝出舉興化問雲居權借一問以為影草時如何居無對化云想和尚答此話不得不如禮拜了退二十年後居云如今思量當時不消道箇何必後遣化主到興化處化問和尚住三峰時老僧問伊話對不得如今道得也未僧舉前話化云雲居二十年秖道得箇何必興化即不然爭如道箇不必師徵云古人一機未透積歲窮研豈肯造次胡言亂道今人不揣己分才入門來學些口頭三昧便要為人師範可不深愧古人乎且道當時雲居道箇何必興化道箇不必還有優劣也無試道看舉曹山辭洞山洞遂密授洞上宗旨復問云子向什麼處去曹山云不變異處去山云不變異處豈有去耶云去亦不變異師徵云古今師資道合豈造次成就耶當時曹山事師數載親承實授臨別洞山尚不肯放過云子向甚麼處去洞山向伊一拶道不變異處豈有去耶云去亦不變異看曹山此語穩密無以加矣然在臨濟門下正好喫棒不見洛浦當時自謂了當別濟南去當仁不讓濟以拄杖畫一畫云過得這箇便去浦乃喝濟便打浦禮拜而去濟明日上堂云臨濟門下有箇赤稍鯉魚搖頭擺尾向南方去不知落誰家虀甕裏醃殺他日果跳不出夾山圈繢子可見臨濟大師豈輕授受乎然而洛浦亦不越師之記莂雖然到這裏諸人向不變異處道將一句看道得許你前去道不得按下雲頭參舉大涅槃經云十二因緣法下智觀故得聲聞菩提中智觀故得緣覺菩提上智觀故得菩薩菩提上上智觀故得佛菩提師徵云大小世尊説如來禪也所以道依經解義三世佛冤離經一字即同魔説且道衲僧家又作麼生道驀卓拄杖云千山勢到嶽邊盡萬派宗歸海上消舉丹霞問僧甚麼處宿云山下宿霞云甚麼處喫飯云山下喫飯霞云將飯與闍黎喫的人還具眼也無僧無語師徵云諸人終日喫飯還識得此人麼若識得此人許你具一隻眼舉鼓山到玄沙沙作一圓相示之山云人人出這箇不得沙云情知你向驢胎馬腹裏作活計山云和尚又作麼生沙云人人出這箇不得山云和尚與麼道卻得某甲為什麼道不得沙云我得汝不得師徵云二大老如兩鏡相照咸云人人出這箇不得優劣在什麼處一得一不得且道人人既不出這箇驢馬還出得麼試道看舉保福僧到羅漢琛禪師處漢問彼中佛法如何云有時道塞卻你眼教你覷不見塞卻你耳教你聽不聞坐卻你意教你分別不得漢云吾問汝不塞你眼見箇什麼不塞你耳聞箇什麼不坐你意作麼生分別師徵云還知麼二大老一縱一奪殺活自在俱為作家磬山今日塞與不塞置之弗論且道根根塵塵周遍法界誰與你安名還識得此人麼舉石頭問龐居士云子見老僧來日用事作麼生士云若問日用事即無開口處乃呈偈云日用事無別唯吾自偶諧頭頭非取捨處處沒張乖朱紫誰為號丘山絶點埃神通并妙用運水及搬柴師徵云老龐道日用事即無開口處且道既無開口處這一落索從何處得來若知他落處開口也得不開口也得雖然我問你日用事聻舉長生問靈雲混沌未分時含生何來靈云如露柱懷胎云分後如何靈云如片雲點太清云未審太清還受點也無靈不答云恁麼則含生不來也靈亦不答云直得純清絶點時如何靈云猶是真常流注云如何是真常流注靈云似鏡長明云向上更有事也無靈云有云如何是向上事靈云打破鏡來與汝相見師徵云當時靈雲兩處不答是何意你看古人琢磨到純清絶點處喚作真常流注似鏡長明直須知有向上一著不然則命根不斷所以道打破鏡來與汝相見驀拈拄杖云諸人還曾到這田地麼若未到這田地卓下拄杖云決不孤負參舉石門蘊禪師在青林作園頭一日歸侍立次林云子今日作什麼來蘊云種菜來林云遍界是佛身子向甚處種蘊云金鋤不動土靈苗在處生林欣然來日入園喚蘊闍黎蘊應諾林云剩栽無影樹留與後人看蘊云無影樹豈受栽耶林云不受栽且置你曾見他枝葉麼蘊云不曾見林云既不曾見爭知不受栽蘊云秖為不曾見所以不受栽師徵云終日蒲團上靜悄悄地菜不擇一莖米不揀一粒謂之參禪辦道還識得古人親切處麼你看他隨方應用都合其宜信手拈來頭頭本具打一拄杖云受栽不受栽且置無影樹子聻舉溈山因劉鐵磨來云老牸牛你來也磨云來日臺山大會齊和尚還去麼溈山作臥勢磨便出去中峰和尚拈云溈山被劉鐵磨一拶拶倒要起起不得鐵磨被溈山一推推轉要住住不得本上座與麼批判多少人在背後咬斷拇指師徵云中峰老人恁麼道你道他還知二老落處麼若知落處何故道要起起不得要住住不得試道看舉趙州訪一菴主便云有麼有麼主豎起拳頭州云水淺不是泊舟處便去又訪一菴主亦云有麼有麼主亦豎起拳頭州云能縱能奪能殺能活禮拜而去師徵云趙州老人問處一般二菴主答處不別為什麼一肯一不肯諸人還知利害在什麼處舉僧問風穴語默涉離微如何通不犯穴云常憶江南三月裏鷓鴣啼處百花香師徵云既作臨濟兒孫須識臨濟綱宗始得不然未免傷鋒犯手或有人問磬山語默涉離微如何通不犯豎起拂子云見麼且道與古人是同是別不見當時佛鑑老人頌云彩雲影裏仙人現手把紅羅扇遮面急須著眼看仙人莫看仙人手中扇舉心地觀經云此法名為一切凡夫入如來地頓悟法門此法名為三世諸佛自受法樂微妙寶宮此法能引諸菩薩衆到色究竟自在智處此法能與生死長夜作大智燈師徵云諸人看這黃面老子在靈山會上百萬人天衆前拈出也甚奇特雖然且道如何是此法驀卓拄杖云擬之則差強之則隔道道舉臨濟大師道有時奪境不奪人有時奪人不奪境有時人境俱奪有時人境俱不奪師徵云作麼生是奪境不奪人作麼生是奪人不奪境作麼生是人境俱奪作麼生是人境俱不奪你若一一透過作得臨濟門下兒孫你若透不過卻被人境埋沒了也喝一喝云且道那裏是人那裏是境參舉僧問法眼求佛知見何路最徑眼云無過此師徵云還識得法眼老人最徑路麼切忌動著動著打破你頭皮代古舉世尊因自恣日文殊三處過夏迦葉欲白槌擯出才拈槌乃見百千萬億文殊迦葉盡其神力槌不能舉世尊遂問迦葉汝欲擬擯那箇文殊迦葉無對師代云來説是非者便是是非人一齊擯卻傍有不甘者出來道磬山老漢有甚長處開此大口便合掌向前云汝真文殊舉大宋太宗皇帝因入寺見僧看經問云看什麼經對云仁王經既是寡人經為甚在卿手裏僧無語師代云一人有慶兆民賴之又因僧朝見帝問甚處來云臥雲來帝云朕聞臥雲深處不朝天為什麼卻到這裏僧無語師代云弘恩難報舉閩王問報慈禪師報慈與神泉相去近遠慈云若説近遠不如親到慈卻問大王日應千差是甚麼心王云甚麼處得心來慈云豈有無心者王云那邊事作麼慈云請向那邊問王云大師謾別人即得慈無語師代云此猶是這邊事舉明招謙在婺州智者寺為第一座尋常不受淨水主事云不識觸淨淨水也不肯受謙下禪床提起淨瓶云這箇是觸是淨主無語師代云老僧住持事煩上座休怪舉楚石禪師入寮見僧看經問云看的是甚麼經僧云是金剛經石云我不問你金剛經看底是甚麼經僧無語師代云意欲別道則恐斬頭覓活舉雲蓋山僧乞瓦造殿有官人問既是雲蓋何用乞瓦僧無語師代云寒暑不常舉悟空禪師問座主講甚麼經云法華經空云有説法華經處我現寶塔當為證明座主贊請甚人證明座主無語師代云尊德不淺舉投子示衆云汝等諸人盡道我實頭若出門三步有人問你作麼生是投子實頭處作麼道衆無語師代云恩大難酬舉楚石與衆僧觀海次僧問秖是一片水因甚麼喚作海楚云秖是一片海因甚麼喚作水你且道源從何來僧云從一滴來楚云一滴又從何來僧無語師代云當時磬山若在以手急掩其口塞卻這漏洞舉雪竇問僧甚處來云摘茶來雪云人摘茶茶摘人不問你無底籃子重多少僧無語師代云自從雲水來且喜無人較舉楚石禪師一日因施主送楊梅僧就盒拈起問云一般楊梅為什麼有赤有白石以盒子合卻云見箇甚麼僧無語師代云若是某甲便翻轉盒子請和尚再鑑石又揭開盒云聻僧又無語石云你只是箇無開合漢師代云待揭開盒子便云和尚用赤底也好用白底也好舉玄沙禪師在雪峰時光侍者謂沙云師叔若學得禪某甲打鐵船下海去沙住後問光云打得鐵船也未光無對師代云磬山若作光侍者輕輕對他道師叔且喜參得禪也看他如何去就舉長慶上堂大衆集定乃拽出一僧云大衆禮拜此僧又云此僧有甚長處便教大衆禮拜衆無對師代云和尚何得誘人犯法雖然如是磬山今日設若推出箇僧來大衆禮拜即是不禮拜即是或云和尚何得誘人犯法我也知你學語之流舉古鷂子趁鴿子鴿子飛向佛殿欄干上顫有人問僧一切衆生在佛影中常安常樂鴿子見佛為甚麼卻顫僧無語師代云冤有頭債有主舉道匡禪師拈起鉢囊問僧你道直幾錢僧無對師代云和尚從甚處得來舉昔有一道流在佛殿前背佛坐僧云道士莫背佛道云大德本教中道佛身充滿於法界向甚麼處坐得僧無語師代云許你具一隻眼舉有一行者同法師入佛殿行者向佛而唾法師云行者少去就何以唾佛者云將無佛處與某甲唾法師無語師代云許你燒得香換得水有僧與童子上經了令持經著函內童云某甲念底著向那裏僧無語師代云汝在甚處將來舉一僧在經堂內不看經每日打坐藏主云何不看經云某甲不識字主云何不問人僧近前叉手鞠躬曰這箇是甚麼字主無語師代云識也識也舉一老宿因江南國主問我有一頭水牯牛萬里無寸草未審向甚麼處放宿無對師代云不臥寒雲谷長耕大地春舉一老宿見僧來豎起火筒云會麼云不會宿云三十年用不盡底僧卻問三十年前用箇甚麼宿無對師代放下火筒云汝會得許汝親見老僧舉明招到坦長老處坦云夫參學一人所在亦須到半人所在亦須到明便問一人所在即不問作麼生是半人所在坦無對師代云我這裏半人也無坦後乃令小師問明明云汝識半人所在麼也秖是弄泥團漢小師無語師代云謝和尚教誨而今若有人問磬山如何是半人處對他道病魚止濼困鳥栖蘆舉裴相國啓建法會問僧看什麼經云無言童子經有幾卷云兩卷云既是無言為甚麼卻有兩卷僧無對師代云莫會無言好有人問僧點甚麼燈僧云長明燈云甚麼時點云去年點云長明何在僧無語師代云瞞他半點不得有僧入冥見地藏菩薩藏問你平生修何業僧云念法華經云止止不須説我法妙難思為是説是不説僧無語師代云謝指示有一官人入鎮州天王院睹神像問院主云此是甚麼功德云護國天王云秖是護此國遍護餘國云在秦為秦在楚為楚云臘月二十九日打破鎮州城天三向甚麼處去主無對師代云無剎不現身舉僧問石霜咫尺之間為甚不睹師顏霜云我道遍界不曾藏僧後問雪峰遍界不曾藏意旨何如峰云什麼處不是石霜僧回舉似霜霜云這老漢著什麼死急僧無語師代云和尚也不得藏頭露尾舉藥山問僧甚麼處來僧云湖南來山云洞庭湖水滿也未僧云未山云許多時雨水為甚未滿僧無語師代云某甲未雨水前離彼舉雪峰搬柴次乃於洞山前拋下山云重多少峰云盡大地人提不起山云爭得到這裏峰無語師代云也知和尚識分量拂袖便行舉瑞巖謁夾山山問甚處來云臥龍來山云來時龍還起也未瑞乃顧視之山云炎瘡瘢上更著艾燋云和尚又苦如此作什麼山休去師代云龍生龍鳳生鳳舉僧侍玄沙和尚沙以杖指面前地上白點云還見麼云見如是三問僧亦如是三答沙云你也見我也見為甚麼道不會師代云和尚慈悲恩逾父母舉雪峰一日升座衆集定輥出木毬玄沙遂捉來安在舊處峰便休師代云放你三十棒大衆且道是賞伊是罰伊舉泗州塔頭侍者及時鎖門有人問既是三界大師為甚麼被弟子鎖侍者無對師代云開來也泗州塔前一僧禮拜有人問上座日日禮拜還見大聖麼僧無對師代云這一問從何來舉鏡清再參雪峰峰云甚處來清云嶺外來峰云什麼處逢達磨清云更在甚麼處峰云未信汝在清云和尚莫恁麼粘泥好峰便休師代云老僧年邁賴子殷勤舉玄沙和尚問明真禪師善財參彌勒彌勒指歸文殊文殊指歸佛處汝道佛指歸甚處云不知沙云情知汝不知師代云老老大大作這箇見解舉臨濟到京行化至一人家門首云家常添鉢有婆云太無厭生濟云飯也未嘗得言太無厭生婆便閉卻門師代云情知你慳吝舉仰山住東平時溈山令僧送書并鏡至仰上堂提起示衆云且道是溈山鏡東平鏡若道東平鏡又是溈山送來若道溈山鏡又在東平手裏道得則留取道不得則撲破去也衆無語仰撲破便下座師代云某甲若在會中遂向前叉手而立云請和尚鑑舉楊岐和尚問僧敗葉堆雲相離何處云觀音岐云觀音腳下一句作麼生道云適來相見了也岐云相見底事作麼生僧無對師代云和尚萬福岐云第二座代參頭道看亦無語師代云我若答和尚昧卻第一座也岐云彼此相鈍置師代云賴和尚年尊舉報恩禪師問彥上座從上諸聖及諸先德還有不悟者也無彥云若是諸聖先德豈有不悟者恩云一人發真歸源十方虛空悉皆消殞今天台山嶷然如何消殞去彥不知所指師代云天台山不肯和尚恁麼道大笑去也舉僧問疏山如何是諸佛師山云何不問疏山僧無語師代云這老賊又云若問疏山疏山則不肯恁麼道舉溈山和尚令侍者喚第一座座便至溈云我喚第一座汝來作甚麼座無對師代云若非某甲洎合被侍者笑禮拜而出舉仰山一日指雪獅子問衆云有過得此色者麼衆無對師代云磬山若在便向一指輕輕道和尚這喚作甚麼色舉僧問香嚴如何是西來意嚴以手入懷作拳展開與之僧乃跪膝以兩手作受勢嚴云是什麼僧無對師代云諸佛亦不識有俗士獻畫帳子與文益禪師益云汝是手巧心巧云心巧益云那個是汝心士無對師代云和尚更要一幀那舉欽山與巖頭雪峰坐次洞山行茶來欽乃開眼洞云甚麼處去來云入定來洞云定本無門從何而入欽無語師代云這一問從何而出舉良巨禪客參欽山禮拜了便問一鏃破三關時如何欽云放出關中主看良云恁麼則知過必改欽云更待何時良云好隻箭放不著所在便出去欽云且來闍黎良回首欽下禪床擒住云一鏃破三關且置試為欽山發箭看良擬議欽打七棒云且聽亂統漢疑三十年師云衆中還有人代得良巨一轉語麼顧視左右如無老僧代一轉語待欽山道發箭看劈面一拳直饒欽老有棒也下手不得雖然如是切莫亂統咦舉韶國師參朱溪才參次聞犬咬靈鼠聲韶便問是什麼聲溪云犬咬靈鼠聲韶云既是靈鼠為什麼卻被犬咬溪云咬殺也韶云好箇犬溪便打韶云莫打某甲話在溪休去師代云速道速道舉僧問趙州毗目仙人執善財手見微塵佛時如何州遂執僧手云你見箇什麼僧無語師代云謝師答話舉僧問趙州如何得不被諸境惑州垂一足僧便出鞋州收起足僧無語師代云大慈悲故舉佛眼禪師垂示云上座未來此間時無一人上座既來此間後有一人上座秖是一人上座為甚麼成有成無僧無語師代云禍不入慎家之門舉佛眼禪師垂示云無目仙人能揣骨既是無目將什麼辨貴賤師著語云摸著鼻頭喚作眼又云有人問你隨問隨答無人問你時作麼生道師著語云掩耳偷鈴漢又云有情説法易見無情説法難聞秖如無情説法什麼人得聞師著語云從那裏得這消息又云芥子納須彌且問你諸人即今在芥子內芥子外若道在芥子外如何納得須彌若道在芥子內許多大身材如何卻在芥子內師著語云內外且置喚什麼作芥子又云三界惟心萬法惟識舉智門祚禪師示衆十一問師答復徵問問登天不假梯遍地無行路正當漝麼時向什麼處安身立命師答遍界不曾藏復云遍界不曾藏切忌絶商量諸人還見麼問千人排門不如一人拔關還有人拔得關麼試對衆道看若道不得且居門外師答我若當時在會從西過東從東過西卻依位而立復云關諸人又作麼生拔得問三十年前即不問你三十年後不用將來正當即今還道得麼若道不得一處不通兩處失功師答天長地久日月齊明復云普諸人如何道問荊棘林中即不問你出身一句作麼生道師答三腳驢子弄蹄行復云險諸人又如何出身問天下行腳道我參禪你道禪是什麼義師云眉分八字復云擬議則白雲萬里諸人作麼生參問鉢盂無底成得箇什麼師答不從手得或云不從手得將什麼喫飯師云沒卻你鼻孔諸人作麼道問天降時雨為什麼枯木不生花師答切忌枝頭覓復云切忌枝頭覓如何是根本諸人作麼生得見問衲僧須是透得名句身句方可具得衲僧一隻眼還有道得底麼師答拄杖子𨁝跳復云拄杖子𨁝跳還出得名身句麼諸人如何透問滿口道不著底句還有人道得麼師答卻被和尚道著復云道著即不無道不著底諸人又作麼生道問秋初夏末遊山玩水且從你驀劄一問快道將來師答山花開似錦澗水湛如藍復云這猶是遊山玩水驀劄一問諸人道將來問出門一句不問你萬里無雲道將一句來師答青天也須喫棒復云且道過在什麼處諸人試説看
