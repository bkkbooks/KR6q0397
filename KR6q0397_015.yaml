body:
  text: 嗣法門人通問等編雜著題船子和尚機緣集船子和尚得藥山法泛一小舟江邊三十餘年接待方來未有可其意者及見夾山下箇毒手一橈打落洪波直教離鉤三寸道將來此是從上宗師爪牙也其間道藏身處沒蹤跡沒蹤跡處莫藏身恰是龍頭蛇尾所以夾山已後接洛浦支離不少雖然正所謂以心印心心心不異且看末後踏翻船子是何作略時人觀其語句若作歌辭會入地獄如箭射不作歌辭會亦入地獄如箭射離此二邊道得一句許你親見船子極庵說夫真實荷道極盡今時無一毫留滯無半點隔礙而庵始成焉然不見有凡可了不見有聖可成無聖無凡無得無失是名為極無得故實無所得無失故實無所失歷歷明明湛湛寂寂能轉一切物一切物不能轉蕩蕩然庵亦無庵極亦無極無庵故庵無極故極無極故不捨一法無庵故無處非庵出則虛而靈入則寂而照無出無入非照非寂超然獨立于器界根塵之外是則吾所為極菴之說佛祖讚天隱禪院造佛并十二圓覺諸大菩薩讚慈悲大覺皇憐憫於一切嘗開甘露門拔濟群生類大千沙界中求者無不遂圓明常寂照不動一毫端及諸大菩薩慈悲亦復然遍滿虛空界化現無邊際神通不思議出沒皆無礙衆生但瞻仰塵勞即解脫離苦得安樂猶如反掌間況以妙莊嚴成道正因地箇中無染污剎那得佛智功德本具足無願不成就清淨慧眼觀證我如是說光明照十方莫不沾恩力觀音大士讚誠侍者請錢貢善繪筆意精妙以淡墨畫大士趺坐磐石作巉巖覆之一善財於洪波浩渺中跪蓮舟而頂禮瞻者莫不驚歎疑為菩薩示現又何必復航海而覲補陀耶謹此拜讚茫茫大海中化現一磐石應度有緣人覿面欣敬禮眼裏聞妙音耳裏見妙質善財達此意波浪蓮舟出不畏風險濤頓然超百億菩薩如父母之念孩衆生如子女之哀接若能會得善財如斯之猛烈許你生死之心當下息白衣大士讚夫半枝楊柳灑甘露于大千一片慈心救迷雲於恆劫或現白衣仙以釋求男女之愛想或現夜丫形令無數漢返妄歸真若空谷之傳聲如太清之起雲其聲兮無聲其色兮無色唯衆生自覺觀之在耳聽之在目發無盡藏開圓通門乘不可思議大願力也吾將海水為墨讚之曷能窮焉三十二應身大士像贊印禪人請悲願應身三十二慈悲遍照平等施如月映徹影無方善惡逢緣咸得利猛火焰焰刀楯中一灑甘露無能纍衆生顛倒逐根塵所以輪回生死際如依大士返聞聞思修頓入三摩地印禪懇切來請題而我信筆書此偈普門功德贊莫窮恰似太虛點空翠因茲悟徹無窮身口誦目瞻皆了義大士贊二三十二應權為應著眼看來原不定心如孤月照長空千江有水千江印瞻之仰之惟誠惟敬毀之辱之無嗔無諍光明寂照遍河沙兀兀無言行正令耳觀世界眼聽十方普利群情應化無疆淨瓶甘露時灑清涼是為大慈悲父故作苦海舟航初祖達磨贊四傳佛心印多虛少實親對梁王剛云不識折蘆暗暗渡江心久坐少林成底業咄試問當門齒可生今日誰能為雪屈持般若劍以破六宗被忍辱鎧而服三毒直指人心剛云不識一葦渡江九年面壁東土人天從師開闢一葦渡江九年面壁致使梁王追之不及神光斷臂剛才漏泄而今滿地是兒孫看來得髓何曾徹咄飄飄一葦渡江淮少室峰前眼不開默坐九年成底事當門齒缺可曾栽高峰大師贊張公洞裏死關天目山頭化導足跡不落人間影像何從而到描也描他不成畫也畫他不就識得高峰老人鼻孔依然是舊碧峰禪師贊清涼山裏坐禪石城殿下說法震動四海歸降安置八方寧靜仔細簡點將來也是一場笑具老人本分幽然觸處隨宜應現咄這裏見得分明休作神通妙行續十一代祖師贊并序余閲中峰廣録有列祖贊自初祖達磨以至高峰歷二十八代復從中峰師師相印祖祖相傳至笑巖寶祖及先師幻有老人又十一代矣憶昔先師付源流於禹門堂上未及讚語某繇是焚香拜讚以繼中峰和尚略酬遞代傳持之意俾後學知臨濟正宗代不乏人也中峰本禪師天目開明中峰成仁觀河流水大法雷霆千巖長禪師千尺巖巔握金剛圈長年兀坐化利人天萬峰蔚禪師萬峰頭上氣吞佛祖遇此等人震塗毒鼓寶藏持禪師衣珠一露魔王大怒持平等心善惡咸度東明旵禪師心光發現無背無面闡化東明聊通一線海舟慈禪師渡生死流全憑慈舟令人到岸瀟灑天游寶峰瑄禪師山藏奇玉林巒秀蔚得者安閒不向外逐天奇瑞禪師少林祕要直露心巧忒煞天奇宗風絶倒無聞聰禪師圓通一門頓悟心聞高超三界震動乾坤笑巖寶禪師心如皎月未可方說聞小兒啼悟西來訣禹門傳禪師江南開宗此老英雄造此室者如雲從龍幻有老和尚贊五踏破笑巖巖上月翻身直入清涼窟萬年冰裏一蒲團坐斷乾坤吞佛骨虛空為口須彌舌大千沙界風雷說兩肩擔荷臨濟宗腳下兒孫千百億鉗錘喫盡禹門來所以磬山伸雪屈老漢參尋三十年閒來獨坐白雲巖四方衲子聞風集不肯糢糊底許單約住也下辣手之鉗錘放行也用針錐之痛劄機超笑巖隻履權衡臨濟三玄掀翻海嶽震動乾坤大開爐鞴於禹門提挈綱宗於普照末後一句把住牢關咦而今若要通消息鼻孔分明在目前特石匪堅芭蕉匪幻吾師面目澄澄湛湛無緣之慈應遍知接物利生有何倦百億化現度群迷夜叉羅剎咸法脊讚之毀之平等觀直下令人已事辦一片青山一溪碧水敷箇蒲團依石梁止拈龜毛拂提向上旨懸河之辨閃電之機曾經毒手二十年餘今朝覲面痛徹骨髓欲形文彩讚吾師恰似一滴投海底噫大笑一聲淚如雨且道悲兮且道喜這老和尚慈悲海量應接人天大方模樣道合尋常龍神瞻仰驗盡天下衲僧秖許呆頭三兩真讚天隱禪院識監寺請若道即是磬山和尚撩天鼻孔無半若道不是磬山和尚模樣依稀人諳是與不是離微誰能下口判斷既然如此糢糊務要描他何幹又不會禪又不會道剛剛一味平懷穿衣喫飯懶漢咄十方雲水高流剔起眉毛試看報恩禪院衆請咄這箇老漢佛法全無機算慣開大口磨牙妄作人天師範披如來衣坐如來座行祖師正令用辣手鉗錘拈起龜毛拂子放下枯枝草莖且道不拈不放一句合作麼生若道得許你半箇住持若道不得試看一筆揮將也外道魔王肝膽寒玉峰長老請玉峰與我同條生不能與我同條死有人來問是何緣驀口便將拂子止咄阿誰阿誰天隱老子授徒請千巖萬壑兀兀忘學一箇蒲團逍遙快樂咦拈起拂子便驚人惟授闍黎已輕諾休輕諾無可託描摹去為木鐸範徒請見山不是山見水不是水拈起鐵楖栗打破西來旨噫範徒會得這些兒留與他年作標子本徒請長松壁立巖泉傾瀉直指西來不用唇舌記得當年舉拂時道本闍黎曾會得咄即今還會得麼藏徒請終日翛然坐佛也不要做禪道爛葛藤不與你說破山茨際請拈龜毛拂坐箇蒲團別無長處佛祖難瞞清風拂白月此意有誰諳這裏一分親切處秖許闍黎隻眼看箬庵問請遠山青近水緑兀坐蒲團如枯木箇裏原無半點塵石上苔斑鴨頭緑手中拂子卻付誰走向煙霞潛深谷夙世冤家撥不開務要描伊露人目林玹琇請三山不是山水不是水坐破蒲團豈有定止千巖萬壑之中豺狼群隊之裏要尋箇張牙露爪底驀然撞著捋虎鬚不是我兮便是你正坐堂堂無事可做龍象交參一一按過頂門具眼劈頭打破林玹小廝慣要惹禍來捋虎鬚許伊膽大雲無所來山無所去無去無來道人無住繡谷風生蘭溪水注一一拈來各有本據如虎戴角如鳥乘羽咄同雲萍維那請手中執如意心裏原無住推倒須彌峰踢翻四大海不動一毫端何曾有本據分付萍禪人留作他年間家具崇北振知事請此老生平慣行棒何故而今坐卻杖果能諳得這些兒許伊作箇人天樣面目儼然襟懷可暢咄都從幻影乞留題誰道於中無形無相振宗承知客請一片蒲團隨方就圓擲下拂子袖手安閒眼空四海心若大川出懸河之辨舉倒嶽之鞭咄冷地看來那值半文錢大林偉知客請這老頭陀破無明窠長年獨坐大法擔荷拈起拂子多多和和若人會得其中意隨處蒲團隨處歌無文印禪人請坐臥千巖萬壑令人到此絶學截斷東西路頭方始頂門開目問渠那裏端由臨濟正派老禿印得幾箇摟搜拂柄今還倒握咄且看三十年後滿地兒孫角角百訥全禪人請一節兩節竹三莖四莖曲擊之了無聲昔人曾中毒這箇老頭陀拋磚要引玉描他本無為舒幀開人目咄咄此事不須更叮囑奇知事請這老和尚為人諦當對衆之言不敢輕誑雖無法可說也有些度量遍身毛孔發天真試看眉毛在眼上啓徒請寒巖積翠兀兀忘慮冷瀑飛肩幽然自處看伊不是古佛再來出言信口了無所據咄哉天下有這等宗師未免將黑豆換人眼去剛是一種平懷毀亦不真贊亦不喜古竹嵩禪人請遠山青近水碧中間已有玲瓏石兀坐蒲團待箇誰頭白鬚長人不識咄嵩禪嵩禪秖有一事我不題道得著兮方與說智林妙禪人請白雲非白黑石非黑閒坐於中繩繩默默半肩擔荷佛祖家風兩足交趺人天莫測誰是知音識得渠大明國裏一老賊恆侍者請一根拄杖雙手不放遇箇中人打模畫樣幾莖瘦竹鶴立地上點點石頭奇形怪狀咄可以謂幻境可以謂實相論侍者請懶坐磐陀石上那是人天榜樣惹得雲水參尋竟沒些些肚量未曾開口呈言令他心驚膽喪且喜真實禪和不許諸方孟浪論禪論禪錯認荊溪大匠音侍者請倚几默坐探取古話得意忘懷不覺物化心空法空唯餘這箇知音者從能言者和試看淡墨屏風上更有一事不說破智閒禪人請一箇蒲團兀兀忘緣祖師心印卻教誰傳太虛為口本爾難宣出廣長舌借此爐煙透頂透底無勞我言續知衆請百丈孤峰壁立大悲千手不足閒坐晝夜蒲團消息枝枝發泄不須播此唇皮總是出廣長舌冷地看來一事無常把烏龜喚作鱉啓明靜主請吸得龍池水長坐白雲巖開闢磬山阿提唱報恩寺這裏有何為據此菴中地老禿髮又長誰人不識你問渠渠不知閉著一張嘴咄恰似無廉恥慈引居士請鬚長眉細心中無住擲箇蒲團說法隨處拈龜毛拂提向上旨遇此等人全身付與咄草深一丈沒法堂明月清風吹兩耳明濟禪人請山碌碌水漉漉一片煙雲坐深谷頭頭物物總自然手中白拂何倒握問渠老漢箇端倪指點人天開眼目咄大機禪人請疊疊雲山知幾層瀟然自得箇閒僧坐觀物物皆為幻遮裏看來火上冰咄秖有些些堪羡處了無一事到胸膺石林禪人請南面獨坐有什麼做說法無時都成話墮集之如雲散而無作有甚閒工夫與人婆婆和和咄禪人請十五堂堂之軀敢未是伊伊恰是我我不是伊咄直饒恁麼會得也是瞎驢這個老禿奴胸中一字無拈條楖栗棒佛祖難近傍眼光爍破四天下即今還坐枯藤上咄若然會得遮些兒雙手與你這柱杖煙霞老漢兀坐無伴四十餘年無思無算揚斯白拂判斷公案至精至微非枝非幹若還撞著箇多口阿師呵呵大笑云饒你文言瀚漫切忌自毀自贊無道可修無法可說拈箇拂子慣向人間出乖弄醜咦風雷滿地來且看你三十年後一箇蒲團久坐忘緣不知斯旨莫謂枮禪問渠西來大意默默剛示無言箇裏應須體究自古此道無傳敷草蒲團秖圖暖和一物不為豈肯話墮道不會學禪不會參剛是一枚打坐老漢生平壁立萬年松下一默坐斷千差路頭頓然超過百億咄你若這裏承當管教得亦無得山水重重煙霞疊疊無智老人坐此一默一柄白拂從來持不知肯付與阿誰江北江南任你走不離這箇蒲團居峰巒疊疊瀑布雙流閒坐於中無作無修天生這樣瀟灑人間無事優游佛法一些不會箇裏卻道真休咄描模他何用不如擲在壁角落頭雲靄靄水潺潺白石清風坐處閒有人來問西來意謾指溪流月在天舉世看來那箇真百年之後化為塵全憑一點丹青手留與人間不記春一葉落知天下秋道人無事自優游憨憨以坐磐陀石恰似尋常懶老牛煙霞影裏留蹤跡瀟灑林間已白頭咦識得渠儂真面目不風流處也風流無相山中坐臥無影樹下安間有人舉問西來雙履脫卻於前供養伊集福毀罵伊增愆去此二途道一句來咄也是如驢覷天節操兮無如松柏清徹兮無逾泉石學道兮原非老少真誠兮豈論緇白操之則存舍之則隔仰之則祥抑之則厄分明都屬自心生達得源頭號禪伯老漢生來孤寂不與萬法同轍趺坐一箇蒲團捉得一柄白拂不談禪不論道一味平懷也無得兮也無失楓隱居士傳行樂描師與玉公同軸請題居士家傳諦信綿綿忠心宇宙樂業林泉談玄說妙拈向一邊二老比丘招隱其間行坐不一非正非偏禪不會講道不能傳一條拄杖撐地撐天有時指撥兩童子運水搬柴都現前問他的的西來意一片白雲嶺上閒啓明靜主摹師小像同軸請題雙手把拄杖拂子與你握若是達其源切莫輕馳逐喬木森森兮枝枝秀雲山疊疊兮藹藹蒼此非俗境真渺茫得其受用無何鄉咦分付兒孫兮聊且供養於山房題南嶽大師像此老心直口快不假禪道捏怪生平不蓄半文舉作千金痛快若非稠錫再來定是普門還債嘗親幻有老人得些活潑主宰住此南嶽山中卓錫泉邊自在不須臨濟三玄何用遠公九帶肯接雲水上流蔬飯二時慷慨大悲高閣立成如來破殿重蓋兒孫描邈師真來索山僧贊唄咦老禿無相福田直與虛空同壞題澗川關主像長坐團蒲終年一衲得法於雪浪堆頭化導於廣陵江畔若風傳幽谷月印寒泉噫要知末後底光明但看手中這如意題啓明小像獨倚孤松閒坐不作一毫功課本非寂而忘緣西來祖意看破題照菴居士像有照有知全是假無知無覺亦非真兩頭擔子俱拋卻清淨茅菴一老人咄題大若居士像飄飄然有出塵之行奮奮然有絶世之剛棄功名若敝屣玩塵俗如秕糠道之淵微以達穹蒼理之至妙而曰真常逍遙于北窗之下直配享乎羲皇題就空居士像此老生平鯁直鄉鄰行事欽悅逢善總之扶持遇惡教之不絶若在三寶門中隨緣種福不缺世出世間並能可以稱為英傑唯願子孫多賢吾今贊之何徹佛事為聞遠師弟舉火浮生如夢幻質如雲去住無礙出入縱橫非眼所見非耳所聞靈明這點蓋色騎聲無聞之聞謂之真聞無見之見謂之真見真見所以能見源真聞所以能聞遠正恁麼時聞遠師弟還聞麼超然獨脫一句作麼生道以拄杖挑火炬云一團紅焰從空起本地風光在目前為紹巖師弟舉火紹巖師弟聽我說偈無上菩提言下薦取禹門院裏安禪伏龍山下脫去打破涅槃城截斷生死路逍遙三界之中如獅脫索獨步以火炬打云正與麼時三世諸佛歷代祖師現此光中異口同音轉大法輪令嵩長老全身放下得大自在去也驀投火炬入塔靈明廓徹廣大虛寂風吹不裂雨打不濕這無縫塔豈有出入以拄杖點塔門云雖然如是爭奈杖頭有眼明如日推襯骨下塔云不是懸崖親撒手那能箇裏得安居上生居士為母請對靈師揮案三下云靈臺獨鑑照破煩惱之昏衢覺體洞明頓證無生之法忍迷之者六道輪回悟之者三途永息舉拂子云看看打云圓陀陀光爍爍無去無來淨裸裸赤灑灑非生非滅於此會得不涉程途其或未然且聽衆僧轉般若心經示寶印庵主覺靈起棺梅蕊含香玉吐春凝寒徹骨笑吟吟不居常寂光中地先向枝頭漏泄音於此會得轉身一路即在目前其或不然別通消息喝一喝云寶印還會麼驀豎拄杖云看舉起也直透非非想天穿破帝釋鼻孔卓下也摟空波波地獄觸著閻羅腦門所以道十方薄伽梵一路涅槃門卓一卓偈云拶著分明毛骨栗劃然打失娘生鼻本來面目要承當也是虛空裏迸裂佛祖牢關鎖忽開大地山河一片雪拈起兔角杖行時生死本來無間隔到這裏轉身一句作麼生道將拄杖指棺云杖頭點出金剛眼崑崙騎象鷺鷥牽曳拄杖便出舉火身從無相中受生猶如幻出諸形相幻人心識本來無罪福皆空無所住既無所住亦無所去於無所去處生於無所去處滅生滅既滅寂滅現前到這裏末後一著如何道偈云寶印持來已久印破虛空三有回觀自家面目嚇得須彌倒走以火炬打圓相云吽吽吽虎叔居士為母請對靈靈光獨耀本無去而無來幻質非堅現有生而有滅非堅故生即不生獨耀故去即不去去即不去故來而無來生即不生故滅而無滅既然如是且道熊安人在何處安身立命揮案一下云九品蓮臺隨處現三途地獄頓然空示廣修宜人靈以如意擊棺三下云諸行無常是生滅法生滅滅已寂滅為樂無上大涅槃圓明常寂照凡愚謂之死外道執為斷諸求二乘人目以為無作惟有過量人通達無取捨六祖盡力說到這裏止說得一箇無取無捨既無取捨亦無去來既無去來豈有生死生時不來死時不去湛然圓寂心境一如但能直下頓了不被三世所拘且道廣修宜人在什麼處安身立命舉如意云仰憑三寶恩光力特達蓮臺第一枝漢沖居士為父請對靈了知四大元非我真性空時萬法空識得本來真面目大千沙界一空空生亦空死亦空生死空空空亦空一空空到無空處東土西方總一同所以道一切有為法如夢幻泡影如露亦如電應作如是觀以拄杖豎起卓棺三下云杖頭點出金剛眼上品逍遙得自繇為成侍者起棺師倒拈拄杖擊棺云吾徒通成可謂信心脫俗九載事師殷勤只這著子尚未惺惺涅槃堂上請汝先行且道正恁麼時是生耶是死耶生既未生生即無生死既離死死亦無死無死無生靈然獨存咦門外春風瀟灑去一回消息一回新為聰侍者起棺師至呼云行聰行聰十九如風偶然失腳滿盤盡空一空空到無空處返本還元總是同你若會得生來便去也不為夭你若會不得縱然百歲不為老即今會得便恁麼去以拄杖抵棺云出去示航長老覺靈假借四大以為身心本無生因境有前境若無心亦無罪福如幻起亦滅既然如幻生亦如幻死亦如幻來亦如幻去亦如幻善亦如幻惡亦如幻有亦如幻無亦如幻天堂亦如幻地獄亦如幻樂亦如幻苦亦如幻秖如汝五十二歲父母未生前清淨本體亦如幻五十二歲中間所作所為或善或惡因果昭然亦如幻直至五十二歲後氣斷聲銷復元初體亦如幻如幻亦如幻所以經云一切有為法如夢幻泡影於此會得轉身一路即在目前其或未會假我木上座通箇消息倒拄杖連敲棺三下云航長老打開頂門眼返見本來人四大了然空今復歸何處山前一片地寶塔汝師製命我傳法言直指汝歸去入塔山河一片雪行人那裏歇條條赤體空且向箇中入卓拄杖云歇歇一念頓超於塵劫相看只在剎那間杖頭從此清風徹二文居士為母請點主靈臺寂寂久孝子垂簾守今日請山僧大家出隻手為甚麼如此賓因主則顯主因賓則立賓主未分前無得亦無說如是義了然幽顯俱洞徹咦靈光一點透九霄子孫雲仍朝北闕以嚴居士為父請對靈生本無來死本無去無來無去湛然常住起達本兄歸龍池入塔海底泥牛銜月走巖前石虎抱兒眠吾兄既達元初本何故淹留在此間歸去來歸去來故山院裏絶塵埃相逢俱是舊相識管使吾兄笑眼開為達妄煉骨達妄明真體了知四大空衲僧巴鼻事今日與君通驀投火炬云看白骨從教煆煉來眉毛端的不須動為世安煉骨以杖擊龕云世安旨法姪生前已竭力衛護箇叢林喪身亦不輟即世明出世安然超十地以火炬照龕頂云頂門眼豁開照破第一義為見空煉骨靈明一點徹大千光皎潔見得無始空蓮花火裏出以火炬打圓相云咦為拙呆禪火起龕師以拄杖擊龕三下呼云拙呆拙呆魔不從外來冤不繇他起這裏若分明生死當下息且道出門一句作麼生通身本無相步步絶形蹤舉火性火真空性空真火天上人間也無處躲東風撲面來真箇也奇哉照破渠儂真面目遍界都是火蓮開驀投火炬為行直舉火以拄杖擊龕三下云打破化城要歸寶所智光未朗助你把火以炬投下為嚴道人起棺師拈拄杖擊棺云迷從曠劫直至而今捨身受身輪回虛幻你若這裏薦得業障如山一擊分明百雜碎真性如海片時返照萬緣空其或未然再聽古佛偈云假借四大以為身心本無生因境有前境若無心亦無罪福如幻起亦滅既然如是出門一句作麼生道以杖指外云薰風自南來且歸林下去行由辛未重陽師在磬山衆請師述始終參履師固辭衆堅請師曰若論此事本無言說歲月浸久經歷繁多雲水艱辛難以具告扣己所參聊通影響余生荊溪閔門母潘氏不幸早歲失怙母老孀居時值凶荒貧難艱苦無從師範之訓失讀孔孟之書祖業行戶幼不堪任幸植夙因時中常念觀音名號憶得小時伯母偶攜出戶閒望井邑忽一念返照見空豁豁地境界一回至十餘歲貨菜養母漸涉世緣不覺隨聲逐色頓失前來赤子之心二十歲始發心茹齊然不知三寶歸向唯對神立願二六時中邪念忽起默誦小人閒居為不善章頓然念息一日偶經講肆值講楞嚴一切衆生皆由不知常住真心性淨明體用諸妄想此想不真故有輪轉余時一聞惕然發起畏生死心自念既在世間虛受輪回遷變不常咸屬幻化何不急早修行貴圖脫苦聞幻有和尚是大善知識自清涼山來唐凝庵太常吳安節通政延居龍池山道風遐播闡揚臨濟正宗單提向上一著特往歸依自後只一念怕生死心切單單體究本分事雖處塵寰中實無有一毫留念世緣一日母命攜籃買腐籃錢俱與店家手空而歸被母呵責余時工夫愈覺痛切母見我道念堅固不悅處世允余出家時歲萬曆戊戌遂脫俗依和尚芟染初看趙州無字話半載不得發明更示余參如何是我父母未生前本來面目余領受提撕無論閒忙動靜處行住坐臥時死死挨拶不敢少怠一日和尚同衆看出窯有覺所兄云聞四大名山菩薩出現神通廣大和尚驀接語云我這裏亦不少余進曰如何是這裏神通和尚曰快些度磚其時稍稍有入第未敢認為本源真性次後工夫急切晝三夜三看來看去及百餘日偶展楞嚴見佛咄阿難云此非汝心於時如善財入彌勒樓閣忽憶昔年童稚境界目前無異無別頓覺從前疑情放下平貼貼地一日室中和尚舉華嚴經佛身充滿于法界普現一切群生前為什麼汝等張著兩眼不見時邗州兄云據某見處是佛見無我是我見無佛和尚云料掉沒交涉復顧余曰你如何會余曰據某見處道得一字即不出和尚曰同坑無異土明春侍和尚入城在顯親禪堂余請問永嘉大師道忽然如托空時如何和尚一喝復顧余云我代你修行罷余時禮拜便會得賓主照用之句復適石城寓天界寺謁雲松老師貌古臘高精勤定課寒暑不移可畏可敬親榻數日受益良多又訪文齊老師於能仁寺此老敏而文質出語新奇令人心暢也秋後還山至辛丑余遂掩關和尚囑云汝既有入處此番當更精進他日利導有情勿令斷絶吾北行矣余時不獲從侍巾瓶如失慈父懊恨無已然無可奈何只得關中隨時消遣雖閲古人因緣一一有透露處或拈或頌隨問隨答至僧問乾峰十方薄伽梵一路涅槃門未審路頭在什麼處乾峰拈拄杖畫一畫云在這裏僧復問雲門門拈扇子云𨁝跳上三十三天築著帝釋鼻孔東海鯉魚打一棒雨似盆傾卻又去不得於是力參兩載終日蒲團正在忘絶境界之際忽聞驢鳴恍然頓釋前疑如放下百千斤擔子有偈曰忽聞驢子叫驚起當人笑萬別與千差非聲非色鬧自後看公案如劈竹相似了無滯礙偶聞風拂松梢雨打窗紙隨口云風聲與水聲不必論疏親一耳聞為決何曾有二音至甲辰年四月八日解開遂與密雲兄三藐弟趨覲和尚抵燕都普照時冬殘矣和尚見三人遠去甚喜因驗余等曰汝輩離老僧三載各各呈箇見處看余禮拜便出復呈偈曰人說北地寒我說南方暖寒暖不知人窮人知寒暖和尚笑云汝是窮人次日復徵云汝既為我臨濟門下兒孫當盡臨濟法要祇如四料簡汝如何會余時以四法界答之和尚首肯余復問曰歷歷孤明時如何和尚曰待你到這田地與你道余便喝和尚曰汝還起緣心麼余拂袖便出一日因事和尚穿褊衫舉椅子曰汝上座待我拜你為師余笑呈偈曰木人提唱笑呵呵更著衣衫誰識他昨日覸來是男子今朝還作老婆婆和尚覽竟亦笑云此偈甚愜老僧意時古輝老師其來少室博通三藏講諸經于白塔寺余繹教乘不可不達古德云通宗不通教開口便胡道通教不通宗如蛇入竹筒宗教兩俱通如日處虛空宗教俱不通如犬吠茅叢故同密雲兄遊歷教海明春蒙聖母慈恩建無遮大會于臺山延靜淵老師主法余時得從杖履以廁法席領法華妙旨今想見此老孤高標格操履冰霜真乘法範萬指圍繞余沾其光受益孔矣又近妙峰老師于塔院寺連居數月時常請益欣羡真誠苦行因果明白建葺德業浩然無窮時相與言句頗多歲久已忘後回京中復侍和尚密雲兄南還遊浙中余謁幻也老人於天寧寺睹其高風逸韻真人所不及問答由繁故不述也已上皆一時耆宿誠為人師法者一日本師和尚得恙甚重余思法門吾木分大事雖略露一班曾未明證倘和尚不起于疾奈何其時晨夕不離左右曾于中夜拜跪曰某雖侍和尚十有餘年本分所得因緣特未明諗今欲呈似不敢自欺一字望和尚慈悲和尚爽然坐起余一一傾心披誠和尚曰汝既如是吾亦如是余時便禮拜丁未歲余與三藐弟懇和尚還龍池次年臘月就龍池開堂命余為西堂余固辭之力進此道是冬發大病明春稍愈和尚復以秉拂事命余余再三辭讓癸丑年命理院事余因病又辭因假嶺南靜室掩關時計隨侍和尚南北往還併初發心親近共一十八載跋涉道途間關勞碌總為自己本分事冬底拜辭入關和尚復垂偈付密雲兄齎來云老衲於今不坐關既無住也幸無閒何曾進又何曾出只在尋常天地間余拜讀訖隨韻呈數偈今刻録中不幸春來和尚順世余破關匍匐歸哀悼不已抿龕安制調停叢林事妥曳杖弗辭依舊入關承凝庵居士及諸檀越書至強余出關余力辭至深秋舊病復作幾番垂死延到冬底衆兄弟強余還山余亦恐不能久住於世故順從歸龍池奈沉痾之症夙業牽纏淹留至庚申年方得病瘳意希遍歷諸方隨遇垂手緣足力不能偶識徒踏得山南幽處名磬山荊溪極深谷也余因是有終焉之思矣是年秋便誅茆仲冬後蒙密雲兄等送余越嶺時祁寒中縛茆未就尚無卓錐之地匆匆到來衆皆嘆息此冬洎春大雪綿綿積五十餘日人跡罕到徘徊四顧唯饑禽野獸而已儲盡糧空煙爨欲絶時雖嗟之弗能濟也因卓杖語伴者曰若老僧數盡即埋此山不必更送骸骨入龍池塔他日自然成就伽藍地也迄今屈指已經一十二寒暑藉吳曹諸檀愜力護持卻成叢席每每雲水高流沿溪尋入乞余開示備述往行余固未從不料今日與諸人吐露浪布一場敗闕正眼觀之如空花水月本無生滅去來之相可不見笑大方何足撥齒云耳諸人若要幹辦本分大事豈在尋人蹤跡宜當自勉勿記吾言衆禮謝後序先師語有磬山集散録晚録報恩語録遺録諸編部帙零星刊刻不一問欲彙集成函抱斯志而未遂也嘗憶侍先師於室中時先師謂問云吾語欲流行不難有子任之但不許增損老僧隻字余進云和尚若有語流行某甲便可增損得先師為解頤余不敢負先師久矣歲戊寅蹴居理安勉為從事始於夏成於冬春從頭點定列惟一十五卷計有四百一十二頁工刀較精字畫不爽若道問上座動著先師半箇字腳便入地獄如箭射於此見得方見得先師見得先師方許讀先師語不然問上座未免成簡點去在崇禎十一年佛成道日住武林門人通問謹識
