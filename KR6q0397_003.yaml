一回汗出瓊樓玉殿卻被一莖莫蓋覆諸人還曾一回汗出也未若未得一回汗出切忌顢頇卓拄杖云雪後始知松柏操事難方見丈夫心示衆師云諸人既流入心地法門必須向己躬下真實做工夫參究一回始得不可依依稀稀當有當無如患瘧疾病一般今日提起便心中火急明日放下即緩縱身心惟恐色力不佳病魔纏擾又慮衣食不周貧窮困苦且幹辦些世事調養個四大漫漫學道殊不知恁麼去總然有怕生死底念不覺埋沒塵勞被結習驅使這等根器都是無始以來信位不足如何參得我祖師禪驢年也未有出頭日子在你若果具這大丈夫氣概猛省將來拼此四大也不管貪窮困苦也不管飢寒凍餒也不管病魔纏擾也不管世諦紛紜單單提箇話頭澄澄湛湛切切思思行也參坐也參住也參臥也參不顧得失危亡不知迷悟境界只如此挨拶去歲久月深驀然打失鼻孔恰如虛空粉碎大地平沉漫漫蘇醒將來方有少分相應到這田地急急見人不可耽著須知祖師門下本無有實法繫纍他人若有一法繫纍他人入地獄如箭射故笑巖師翁云聖人之道箇箇完具惟不自究明甘自輕棄且道那裏是自輕棄處須時時簡點不可放過珍重珍重優婆夷衆請開示師云汝等身居富貴中不被富貴之所羅籠信知有這段出世大事乃是屢劫種來善根最是難得須當十二時中猛省提撕如何是我父母未生前本來面目須要治家接應世緣處支賓待客處著衣吃飯處忙間動靜處驅奴使婢處一一體究不可放過直下能見得本來便識得妙明常住真心不生不滅不常不斷無老無少無去無來非古非今非成非壞自然超出苦海今時人落在富貴即被富貴之所籠罩落在貧賤即被貧賤之所困苦不能即世出世故經云一切衆生皆由不知性淨明體用諸妄想此想不真故有輪轉若不勇猛做一番工夫要解脫修行誠未有日子在昔日有箇無著道人二十七八寡居學道曾參叩徑山打硬修行志氣超群見地卓犖以至大徹然後為尼播揚宗教接物利生豈不是出格道人也彼既如是我寧不爾你們若待家園事業成辦然後修行則便耽閣埋沒己靈不知三界空花猶如火宅豈可認定家園事業而為己有耶一息不來就屬後世切莫為長久之計山僧在此開山修造多不過接引之辭又豈可作永遠之念耶汝等若信得及各各須念無常迅速生死事大須自提撕這句話頭以悟為期便是出生死之根本二六時中切不可忽趙州和尚道我在南方三十年除二時粥飯是我雜用心處如此用功無有不發明者努力珍重示衆師云鼓唱宗乘提挈綱要切須是箇人始得憶昔當時僧問巴陵如何是提婆宗陵云銀碗裏盛雪這僧若不解正派源頭如何啓得這箇大口巴陵老人若非出自雲門深窮法海透徹靈源者則不能如是灑灑落落乾乾淨淨拋箇銀碗盛雪一句子直示將來恁麼得非是箇本色上流脫略情塵知見者如何湊泊得去到這裏還知古人落處麼咦不見道道吾舞笏同人會石鞏彎弓作者諳示衆師云德山棒臨濟喝特地無端好施設石鞏箭子湖狗也沒來由呈家醜何故看保寧上堂侍者燒香罷指侍者云侍者已為諸人説法了也然則保寧説法如雷也是借他鼻孔出氣何不當時待侍者未燒香時道箇為諸人説法了也免使後人在侍者邊覓山僧今日無侍者與諸人説還知麼咦男兒自有衝天志莫向古人行處行病起示衆師云剛才過月半又是初一矣老僧病軀不能應時及節與諸人商量佛法若論此事如百斤擔子各各擔著到得地頭方始輕快不得依依稀稀打混過日若是久參先學舉起便知落處晚進初機切須努力諸仁者趁此時將本分事與老僧證據良久顧左右云去罷示衆舉愚庵禪師一日入園見典座割瓜庵問刈得幾箇祖師頭座云三十箇庵云那箇皮下有血座云和尚何得重重相戲庵云好心不得好報師拈云若作佛法商量愚庵好與三十棒若作世諦戲論典座好與三十棒除此二途諸人道將一句來懸鐘小參師云懸起也名喧宇宙遐邇安寧撞著也響應寰區幽冥拯拔恁麼則名從何得聲從何來名不自名聲不自聲聲若自聲不待撞而自鳴名若自名不待鑄而自成既然如是其名也聲也都從檀越信心中流出諸人還知麼咄但將眼聽分明也遍界何曾有覆藏示衆舉世尊將諸聖衆往第六天説大集經敕他方此土人間天上一切獰惡鬼神悉皆集會受佛付囑擁護正法師云大小世尊憐兒不覺醜設有不赴者四天門王飛熱鐵輪追之令集何必既集會已無有不順佛敕者各發弘誓擁護正法以德服人惟有一魔王謂世尊云瞿曇我待一切衆生成佛盡衆生界空無有衆生名字我乃發菩提心山僧若作世尊咄云魔王你而今在衆生界內耶衆生界外耶若在衆生界外不見有一衆生當發菩提心若在衆生界內已發菩提心了也到遮裏看他如何合殺即今諸人還識得遮老魔王落處麼良久云更為諸人頌出遮箇魔王能大力衆生界盡始方修須知逆順承恩德風捲殘雲一色秋小參師云今朝六月十九菩薩應身普救大開圓通法門不落聲色窠臼驀豎起拄杖云大衆遮是色還見麼卓一卓云遮是聲還聞麼若見若聞如何是不落窠臼一句顧視左右云觀音菩薩將錢買糊餅放下手元來是饅頭還知落處麼若不知落處觀音菩薩隱拄杖裏入千峰萬峰去也喝一喝示衆舉天台寒山子預知溈山來國清受戒遂與拾得往松門接溈山才到二人藏路兩邊透出作大蟲吼三聲溈山屹然無對師代云一名是箇老賊寒山云自從靈山一別迄至於今還相記麼溈山無對代云忘卻了也拾得拈起拄杖云老兄喚遮箇作什麼溈山無對代云也知你用得熟寒山云休休不用問他從別後三生做國王來總忘卻也溈山又無對代云老僧住持事煩復頌往往志因貧處得從教古佛要精修三生已落王家也不是溈山怎出頭示衆師云今朝七月一箇事如何説秋風漸漸來切莫耽放逸日月易蹉跎光陰在瞬息若不把本參焉能得竟徹敢問諸人臘月三十日到來作麼生打疊得去顧視左右云噫丈夫不奮沖天志依舊懡㦬過一生示衆舉僧問雲峰如何是心地法門峰云不從人得僧云不從人得時如何峰云此去衡陽不遠妙喜云雲門即不然如何是心地法門不從人得不從人得時如何看腳下楚石云或問天寧如何是心地法門不從人得不從人得時如何早晨有粥齋時有飯師云諸大老恁麼答話美則美矣善則未善若問磬山如何是心地法門不從人得不從人得時如何如人飲水冷暖自知示衆師拈拄杖云今日七月半農夫禾好看你我衲僧家以何為公驗秋風一陳來黃葉兩三片凋殘功德林石人也驚歎既然如是各各須教照顧鼻孔切忌漫將間學解依稀埋沒祖師心擲下拄杖示衆舉僧問五祖如何是佛祖云露胸跣足如何是法云大赦不放如何是僧云釣魚船上謝三郎妙喜云此三轉語一轉具三玄三要四料簡四賓主洞山五位雲門三句百千法門無量妙義若人揀得許你具一隻眼楚石云三玄三要四料簡四賓主洞山五位雲門三句百千法門無量妙義大似頭上安頭天寧今日為你諸人抽卻釘拔卻楔做箇灑灑落落地丈夫兒豈不好何故喫他殘羹餿飯隨他腳後跟轉被他喚作無地頭漢慚惶殺人師云二大老一人高高山頂立一人深深海底行雖然如是還曾踏得五祖老人三句話著也未據磬山看來總是無地頭漢何故從前汗馬無人識秖要重論蓋代功示衆舉密庵傑禪師上堂拈金峰和尚示衆云老僧二十年前有老婆心二十年後無老婆心時有僧問如何是和尚二十年前有老婆心峰云問凡答凡問聖答聖曰如何是二十年後無老婆心峰云問凡不答凡問聖不答聖庵云烏巨當時若見但冷笑兩聲這老漢忽若瞥地自然不墮凡聖窠臼師云某當時若在烏巨位中則把住問那裏有聖凡窠臼見他眼目定動便托開呵呵大笑歸衆這也是山僧路見不平今日衆中還有人知得落處麼若知得落處不妨出衆證據如無一總不離凡聖窠臼在參禹門院入塔小參師云靈源寂寂本無去而無來智體如如現有生而有滅生即不生故來而無來滅即不滅故去而無去來而無來故不來相而來湛若太虛而無際萬象不能逃其形去而無去故不去相而去明如杲日以當空森羅不能遺其照所以亙古今而常存昭然獨脫根塵之外者也既然如是生亦得死亦得少亦得老亦得大亦得小亦得凡亦得聖亦得都盧歸向箇中安享無為之化到這裏收因結果一句作麼生道驀呈拄杖云雲飛不斷青山靜水到無邊滄海間室中垂示師云五更熟睡時撞鐘不聞鐘聲頃寤時鳴鼓便聞鼓聲若先不聞鐘聲後聞鼓聲寤寐不得恆一或聞性有不遍耶鐘聲有不到耶鐘聲若不到同處寤者亦應不得聞聞性若遍寐者亦當得聞何以寤時聞寐時不聞若融會得寤寐一如若融會不得生死關頭如何打脫不可放過諸人簡點看因事開示師云有志學道者必須決擇師承發明心地為要宜當竭力曲盡師法深蓄厚養然後隨緣闡化不拘方所若在學地中師承不擇邪正難分迷流逐隊妄認緣塵大法不明心地何達或者初發心時不知歸向三年兩載從而聞之漸漸慕之憤然發志腰包行腳撥草瞻風趣造林下依棲知識排入上輩固為迫念非求名位只欲幹辦本分一著而已原無薦上之心況有人我見耶然處稠人廣衆之中其間有先出家而名位卑下者有年少而先具戒者有年長而未具戒者不可以尊卑之位忽先後之分況此法門本來平等若識心達本當下與佛祖不別豈可持其先後執著名分妄爭人我徒喪光陰諸人要幹辦大事畢竟行履無有一毫自欺處才不孤行腳之初心矣他日甚有得力決不相賺開示今時人學道做工夫不得㘞地一聲概為工夫不能綿密凡情聖解不得頓忘古人所謂如患瘧疾一般寒了一會又熱一會何曾下正片工夫若是真參實究生死心切一刻不放空挨拶將去日久月深無有不悟底道理只恐當有當無今日期明日今年期來年蹉跎過了一生恁麼蹉跎去直至彌勒下生甘受苦辛何有出頭日子不如言下截斷一切單單只究本分一著果乃親見一回從前學解底都不虛棄若未親見一回總為間學解埋沒祖師心因事茶話師云古人設茶因敘話磬山因話而設茶茶話分明已舉似諸人切莫得周遮雖然且道茶與話是一是二若道是一諸人但得茶不得話若道是二老僧但得話不得茶諸人試道看如何得恰好衆無語師舉茶甌云且吃茶漫漫與你們打葛藤禹門院茶話師云吾於此地本來無福不勞衆兄弟讚歎倘若讚之讚之無益吾於此地本來無過不用衆兄弟毀謗設若毀之毀之不及既讚之無益毀之不及豈非平等法門乎夫佛與衆生平等煩惱與菩提平等西方與東土平等天與地平等我與你平等平等與不平等平等噫白日易遷顏色老黃金難買少年還
