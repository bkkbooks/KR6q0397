body:
  text: 嗣法門人通問等編荊溪磬山語録磬山初創臘八日示衆師云磬山茅屋冷凄凄到者都緣向上機鼻孔盡從今打失赤條條地得無衣作麼生是向上機自代云泥牛吸水武陵溪今辰是我釋迦老子桷底脫落底時節大衆還知麼若知得當初釋迦老子悟得箇什麼來若未知看舉起拂子云釋迦老子在汝等眼睫毛上放大光明照見三千大千世界還見麼若見得徹去睹明星時無二無別其或未然誠謂徒入空門虛生了也各各挽起眉毛盡平生力量挨拶將去不可蹉跎歲月埋沒此光明去也今茲徐居士二十年長齋慕道海內知識一一參叩錯禮山僧為師為伊芟染亦有箇頌子相記脫俗為僧翻掌間轉凡成聖也非難雪山老漢日成道今古明星照遠山久立珍重除夜示衆師云一年容易過大盡在今宵生死無憑據陰陽定不饒大衆團團圍圍住茲磬山阿相伴老僧作何功行莫謂老僧使得你們忙碌碌地無暇做參禪辨道底工夫且道你們終日起來忙間動靜運水搬柴者是誰迎賓待客墾土掘地者是誰穿衣吃飯屙屎放尿者是誰須是於中識得本命元辰不離放尿屙屎不離吃飯穿衣不離掘地墾土不離待客迎賓不離搬柴運水不離動靜忙間若於此識不得本命元辰忙間動靜即被忙間動靜礙運水搬柴即被運水搬柴礙迎賓待客即被迎賓待客礙墾土掘地即被墾土掘地礙穿衣吃飯即被穿衣吃飯礙屙屎放尿即被屙屎放尿礙遮一落索老僧代你們用力不得須要你們件件自家著力始得還曾簡點得也未不然莫説一年除歲容易縱經百年虛度光陰有什麼用處大衆會麼驀卓拄杖云來年更有新條在惱亂春風卒未休歲旦示衆拈香祝聖畢師召衆云本地風光無背面物物拈來始成現大千沙界絶羅籠一句當陽如閃電年新月新日又新步步行來步步新踏著這重關捩子原來即是舊時人所以回天轉地不須愚智功能透古超今不落凡聖階級且如新年頭佛法還有商量也無若道是有水中捉月若道是無色裏膠青恁麼則不涉有無還委悉麼以拄杖劃一劃云打開雲戶看露柱放光輝復頌云雪後一枝梅吐玉豁然天地共陽春太平盡唱無生曲引得巖前石虎吟元宵示衆師云山中正月十五也無村歌社舞都盧本分禪和不打尋常這鼓剔起無相燈光照破人人鼻祖且道燈未明時光在什麼處舉起拂子云明暗兩頭俱脫落一毛端上現全身清明日晚參師云今朝卻是清明節河邊細柳垂枝折捐舟登岸小阿娘跌腳捶胸訴冤屈聲聲哭到松林間叫殺青天全不答誰知生死路悠悠一去更無箇消息何如脫俗出家兒無憂無喜無交涉驀拈拄杖卓一下云唯有這箇不遷變今年去年曾無倦登山涉水賴伊扶風前月下常相見見見見眼裏瞳神耳裏現喝一喝良久云愁人莫向愁人説令得愁人愁殺人示衆師卓拄杖云衆兄弟久處叢林遍參知識還曾撥著這一著子也未若撥著這一著子順逆境緣處自然不被塵勞封鎖生死岸頭時脫然不隨業識牽纏在世出世了無罣礙誠謂之無事道人若未撥著徒自苦辛山山水水千里勞神波波碌碌既為出家兒父母遠離親朋絶往淡泊無為翛然灑樂趁此色力強健猛著精彩日夜研窮究取這一著子十二時中無絲毫異緣畢竟要討箇分曉才得不辜出家之志不負佛祖之恩雖然如是恁麼説話若在了事人前拾如送箇臘月扇子也喝一喝云且截斷葛藤歲旦示衆師云天啓四年正月一春到人間將半月梅花笑雪滿庭香透過時人娘生鼻驀舉拄杖云看惟有這箇原如此也無年也無月也無新舊只平常直直對君親剖悉擲拄杖云雖然如是且道新年頭上一句又作麼生道良久云大家登寶殿祝聖願長春絶糧示衆舉世尊一日敕阿難食時至汝入城持鉢難應諾曰汝既持鉢當依七佛儀式難遂問如何是七佛儀式佛召阿難難應諾佛曰持鉢去師云幸喜幸喜世尊大慈大悲當時若不開這一路洎合餓殺老僧大衆且道靈山會上曾打到這箇境界遣阿難未曾打到這箇境界遣阿難試道看況世尊三界大師福被人天何故只遣阿難入城持鉢千二百衆合作麼生磬山今日則不敢釘釘遣誰去且這一條路誰行得誰行不得可不見義勇為耶記得昔年有箇頌子為諸人舉似托鉢生涯七佛儀瞿曇盡力是提撕阿難當下通消息那用婆心第二機師五十誕辰前一日示衆師云寄迹閻浮五十春不知虛幻受伶俜自從胡亂年來後間看長空放白雲所以道真如性海本無出沒大悲願力示現去來且道既無出沒焉有去來真如性海與大悲願力是同也是異也若道同驀舉起拂子云這是大悲願力如何是真如性海若道異垂下拂子云這是真如性海如何是大悲願力若道不同不異則無老無少無大無小無長無短無有無無不可以形名得不可以智識知如此大衆得得到磬山來與老僧慶誕若約老僧五十年前母難之辰今日猶未生也既未生時慶箇什麼誕説箇什麼法可不隨情逐世了也且道不隨情不逐世一句作麼生道還委悉麼以拂子指庭前菊花云黃菊經霜老青松帶露寒若將時節會依舊是顢頇正誕日小參師拈拄杖云老僧去年四十九曾向人前揚家醜談禪論道作生涯想起從前不唧溜今年幸爾已五十對人一字無可説橫拈拄杖按乾坤那箇丈夫來受屈所以道把住也十方虛空也須喫棒放行也森羅萬象總是齊彰山僧今日也不放行也不把住聊通一線以拄杖插向前繞一匝云與諸人一任七縱八橫去也良久卓拄杖云真金自有真金價終不和沙賣與人啓華嚴禪期示衆師云要踏毗盧頂上行不須向外去追尋回光返照原初體著著拈來不是塵豎拂子云看大衆還見麼十方虛空無邊香水海一一世界中有千丈盧舍那身在此一毛端上現寶王剎轉大法輪打開華藏玄門演出不思議法所以道塵説剎説衆生説熾然説無間歇於此會得迥出三乘高超十地不勞覺城東畔始見文殊樓閣門開方參慈氏脫或未然再打之繞葛藤去也若人欲識佛境界當淨其意如虛空遠離妄想及諸取令心所向皆無礙汝等既到此間妄想不得不離意根不得不淨意根既淨妄想自離妄想既離令心所向自然無礙心既無礙左打一拂云這邊也無礙右打一拂云那邊亦無礙中間打一拂云這裏亦無礙無礙無礙亦無礙今人聞此等説話便道貪瞋癡亦無礙殺盜淫亦無礙妄言綺語亦無礙惡口兩舌亦無礙如此見解撥無因果莽莽蕩蕩他時後日閻羅老子面前打算吃鐵棒有日在莫言不道不見南嶽讓和尚初參曹溪六祖祖云什麼物恁麼來只此一轉語參承六載方始瞥地曰某甲有箇會處祖云何不道云説似一物即不中祖云還假修證不云修證則不無染污即不得祖云即此不染污諸佛之所護念汝既如是吾亦如是善自護持這便是真參實悟真修實踐的樣子汝等既到這裏當摩褌擦褲堅豎脊梁打屏身心體究一回始得古人云臨崖撒手自肯承當絶後再蘇欺君不得正恁麼時直截根源一句作麼生道良久云木馬暗嘶雲影道泥牛橫臥石巖前若能坐斷千差路頃刻歸家不用鞭和聲擲下拂子喝一喝晚參師拈拄杖云達磨一宗看看掃地矣賴有志者盡力扶之何故今時大法未明而為人師者觸著則任意揮張便道大機大用不識是何宗旨學人問著蒲團即將蒲團打問著禪板即將禪板打設若問著虛空你還將虛空打得麼問著山河大地還將山河大地打得麼若將不得可見大機大用不在蒲團禪板上有一等不識好惡者吞卻釣餌播弄一生生死岸頭一毫用不著諸人也須簡點古人乃謂此是風力所轉終歸敗壞不見趙州和尚有箇秀才來問佛不違衆生願是不州云是才云弟子欲就和尚手中乞取拄杖得不州云君子不奪人所好才云某甲非君子州云老僧亦不是佛看他得的人大機大用活鱍鱍地優遊自在老僧晚年來有些性躁也要用棒行喝但遇其人則不得不行不得不用非是貶駁諸方要且扶立宗旨作麼生是宗旨喝一喝卓拄杖云男兒自有衝天志莫向古人行處行復云今晚就水和泥趁爐打鐵也要打草驚蛇還委悉麼以拄杖駕肩繞一匝云楖栗橫擔不顧人直入千峰萬峰去直趨方丈除歲示衆師云爆竹一聲催臘盡寒梅數點帶春來道人林下無餘事心地間間卻似呆所以道欲識佛性義當觀時節因緣時節既至其理自彰且如過去時節已過去未來時節猶未來現在時節而不住況此深山窮谷之中寂寥虛廓本無喧譁雜擾之聲又無朱紫玄黃之色也無笙歌燕舞之作亦無大歡小悅之娛剛剛一種灰頭土面懶散禪和即今歷歷孤明澄心瞪目聽法者莫不是這箇時節若是這箇時節又何用更識便轉得身吐得氣喫得山僧手中痛棒若未轉得身吐得氣喫不得山僧手中痛棒你若向前截斷路頭你若落後又無退身之地你若住著則三十棒到這箇時節還有不惜身命者麼須知句中鏟意意中鏟句意句交馳甚為可畏雖然官不容針私通車馬汝等入堂坐禪已經一月並無有一人到室中通箇消息都盧是一隊無心道人老僧信得汝等過汝等還信得老僧過麼若信得過莫謂無心云是道無心猶隔一重關不見藥山和尚坐禪石頭一日偶見問云汝在這裏作麼云一物不為云不為即間坐也云間坐即為也汝不為不為箇甚麼云諸佛亦不識你看古人一箇間坐尚不可得而況昏沉掉舉妄念紛飛者乎石頭便云從來共住不知名任運相將只麼行自古上賢猶未識造次凡流豈可明你看石頭和尚舌頭拖地入泥入水為人老僧今晚為汝等注破從來共住不知名那裏識得來任運相將只麼行也是客作漢自古上賢猶未識難道造次凡流豈可明不是壓良為賤既注破還知麼若論這一段事人人本有箇箇不無秖為無始以來無明業識煩惱蓋覆不得現前還見麼驀舉起拄杖云先天有物能為主不屬陰陽造化生久立珍重元旦示衆師云今日元來新年頭昨日元來舊年尾新年頭上不見來舊年尾上不見去不來不去常現前箇裏元來無所住無所住處著眼看大千沙界一毫許漫看春風滿面生張公喫酒李公醉更有一般堪羡處千門萬戶瞳瞳睡大家齊唱太平歌哩哩囉兮囉囉哩所以道有條攀條無條攀例大衆祝聖壽以無疆讚皇圖而永固元宵示衆師云一燈才焰萬燈瑩爍破乾坤徹底空山色自今光燦爛桃花依舊笑春風大衆剛才過歲又已半月流光荏苒無暫停息若是手腳未穩切宜努力莫待臨渴掘井追悔無門要做工夫已遲了也會得麼英靈衲子未舉先知機鈍之流不妨薦取以拄杖指燈云看喚作燈則觸不喚作燈即背且道喚作什麼雲門大師道光不透脫有兩般病一切處不明面前有物是一又透得一切法空隱隱地似有箇物相似亦是光不透脫直饒恁麼不恁麼會即聲色而非聲色不恁麼恁麼會即非聲色而非非聲色般若經云若取法相即著我人衆生壽者若取非法相即著我人衆生壽者是故不應取法不應取非法到這裏無你下口處無你入頭處無你插手處無你劄腳處若佇思停機即沒交涉矣還會麼除非上根利器一聞千悟始得不見達磨初祖遙觀震旦人有大根器得得航海而來在梁國不契直造少室端坐面壁九載剛接得箇神光二祖斷臂安心頓悟本來謂之得髓傳至六祖開心地法門然後宗分二派再四傳而派列五宗豈不是燈燈相續瑩徹交輝所以道法流不泯派永接於曹溪燈焰常存光逾明於少室老僧今晚見此世燈引這一落索若是明眼人前一場笑具可不通身輥在葛藤窠裏了也還有剔脫得出者麼良久云少林祕要無多子五派單傳不二門喝一喝示衆舉興教坦和尚初開堂有雪竇化主省宗出問諸佛未出世人人鼻孔撩