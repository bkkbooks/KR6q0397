body:
  text: 嗣法門人通問等編書問與天童密雲和尚客歲過吳門初欲強吾兄還山不得已從命而返春聞受請赴育王遂駐錫天童有光祖窟法化之隆盛矣秋歸金粟特命範徒趨覲不意空返懸懸至今山僻地殊無從訊候近因三峰連刺書來并所刻諸語其間多譏棒喝不知方今拈一條白棒橫行天下者舍吾兄更有誰乎審之總不出他自縛詐降獨施冷刺之句既欲為濟下兒孫何得心行如斯耶所謂師子身中蟲自食獅子肉信然弟復書已付剞劂今寄上幸吾兄諒察詳究其端不然未免旁觀者哂耳與玉峰師弟本分一著人多被靜境埋沒吾弟開闢萬山中雲鋤雨種數年功成豈非兩足尊行業耶努力努力答陳在田居士任者拋磚引玉始知居士具大根器得大辨才所諭一一拈出不二法門誠為難得雖然若見得磬山人未踏磬山路可謂見到而行未到若踏著磬山路未見磬山人可謂行到而見未到必周旋磬山境見徹磬山人始有商量分若道不涉二途無從自悟即落天然外道如所云磬山路絕處理會舌斷處禮拜切莫作此見解何故磬山指路頭於匝地你向那裏窮源磬山借廣舌於溪聲你向何處截斷所以道言前薦取屈辱宗風句後承當埋沒自己不是壓良為賤要在實證實悟而已與王震南居士承居士過訪亟以此道參叩高年難得如此確志所以俾貧道遏捺不住雖議論處無不合意投機但本分一著未能透脫生死關頭恐未穩當故不果貧道之念須是拈箇話頭與居士提持十二時中行住坐臥綿綿密密參究提撕如何是我本來面目不可將心就悟不可翻疑話頭提後得悟也無亦不可疑這話頭也用不著若未悟時而先卜度便是參禪大病也久久執持自有得力處若得打徹急急與貧道通箇消息答曹念茲居士憶昔與門下道左相逢一笑莫逆十五年來病患中日承見愛衲僧分中無以為報敢將生平少有見處與門下共見始洽素心耳門下居富貴而不為富貴沒溺真夙世道種昔云曾做色空工夫今又奚似耶客歲承邀出山見喬梓俱恙心甚不安門下外感似不必慮令郎內傷深為可虞故知藥餌止堪治標欲拔其源必須心地上提持纔能破其病魔堅壘一日曾叩云起明還知妄想起處麼彼云不知既不知單提一箇覺字日久月深自然不背覺合塵去也後半日彼便覺得妄念起處然此一覺已勝進參苓數服矣久之偶夜深漏盡闃爾時山僧忽召彼云起明覺麼彼云覺曰覺從什麼處生云從無覺生曰既從無覺生當再看無覺之覺時彼默然返照不答殊有憬入處山僧隨提云祖師道以不覺故而有始覺以始覺故而有本覺汝今覺得本覺之覺心意泰然如斯會去何愁妄念之生不自了了也時彼云稍有把捉復恐彼不能時時堅守遂於佛前受戒防衛身心而病源既清醫藥亦效可不復憂矣別後聞有玄門秘訣本領工夫此不特衲僧家見為外道即在彼教亦屬罪人不見老子云偽道養形真道養神丹陽子云抱元守一是工夫懶漢如今一也無終日啣盃暢神思醉中卻有那人扶且道如何是那人若這裏見得徹去寧復有秘訣而過此者乎諦觀先聖靡不指照人從心入道除是向上一路石火電光猶為鈍置豈容擬議商量哉門下莫厭葛藤果相信不棄偕令郎時常黽勉莫失正念病中忽見無病本來即世相明實相復何病復何藥復何禪復何玄復何秘密復何淺顯也哉與潘如荄居士二吾人立身天地間學業分岐心志不一者多吾與弟三十年來每每相晤多不過了寒溫世故而已未曾撥著這一著子向西園盤桓始知吾弟少年時有志此道但未能究竟一番別後深為慨惜若是丈夫兒為功名事業蹉跎歲月是把功名事業翻為障道之緣先輩大老咸在功名事業裏作菩提場成就世出世間事若道了卻世間事方可做得出世事此是離世覓菩提如人從東方走欲取西方物打初一步便錯了也不知世事如芭蕉葉剝去一層又一層何嘗有了底日子功名大則世事大功名小則世事小況此事且不在功名內且不在功名外只在人人一念回光返照見得本來面目然後世間事即是出世間事做出世間事仍是世間事一一了當無非在一念中定奪所以云取不得舍不得不可得中只麼得豈虛語哉若信得及便向閒忙動靜喜怒哀樂時提句話頭提來提去忽然提得覿體現前㘞地一聲方始識得不壞世相而明實相者也若如是便在功名富貴中不被功名富貴籠絡在塵勞煩惱中不被塵勞煩惱遮障所作所為利人利己若不如是則觸處動著無非埋沒此段光明又如何做得大丈夫立在一切人頂𩕳上耶先聖云朝聞道夕死可矣今時人自幼之乎者也讀將去不識聞什麼道於自己分中初無交涉吾弟切不可落在此隊裏去莫說佛道不知即儒道亦何曾會得也努力努力人到不惑之年必須卓然有箇腳踏實地處觀乎世間空花水月一無所好亦無不好之念便有出世分既為大丈夫莫說俗諦中四箇字一字也不染著即境緣苦切處亦不被挫折便見學道人磨琢功夫得力不得力一一自家簡點不可放過古人云放過一著落在第二囑囑與吳問卿居士二大悲像已出貧道有一問不知此像出於香耶出於匠耶若出於香何須用匠若出於匠何須用香香匠本無無從自出且道這像從何處得來檀越道將一句來請菩薩去供養來諭云妙相不出於香不出於匠皆藉磬山指點而成據貧道所見若離香匠貧道又指點箇什麼來指點既無三處俱空空即不空緣會而有豈非菩薩所現全身示無生之理耶像既如是法法無生貧道又何嘗動唇舌來居士又何嘗接貧道去菩薩又何嘗留菴中住分別不得不分別亦不得雖然如是若約衲僧分上正未有喫棒分在以此直書上秋水菴主人一笑何如與曹安祖居士久不會晤想門下與幻也老人盤桓日臻玄奧老人年高德宇清徹道行淵深人皆仰如雲日踵門參叩者多得法源底者少徒費老人唇舌耳門下他出須托箇中人相照遇求法者則應之利生為重檀越外護福德更無量耳與吳迪美居士三向上一著君已諦信但得㘞地一聲則便縱橫自在無不自由也工夫切不可當有當無除文章正務料理家庭日用應緣處語默動靜時這一著子不可放過十二時中須教打成一片自無不辦之理所以道佛法無多子久長難得人惟冀努力一秋臥病枯坐柴床默想時序恍然如夢忽遊夢中之夢與居士交臂趺坐白雲閒看流水提究此事笑傲人世覺來惟一笑因思此情此景是償夙逋之因耶抑徵他日之緣耶又不知其夢笑覺耶覺笑夢耶復笑不已正欲書似忽接手翰知君微恙令人懸憶當相忘於夢覺可也惟時自重法門衰替因主法者不嚴栗麥混收邪正難辨止圖門庭熱鬧不顧後學無依貧道痛思正法如懸絲默默流涕微力可能這也居士超群之資當力體究先聖宗旨作將來眼目惜貧道髮白氣衰共出隻手以袪其惑不在貧道之多囑耳答蔣函九居士居士既為此事急切無論在家出家祇要明徹心地了悟本來而已提箇話頭綿綿密密真實參究挨拶將去一點也做作不得一點也取捨不得一點也顢頇不得一點也儱侗不得直須豁然頓悟始得若得豁然頓悟纔喫得山僧痛棒亦何必拘定在家出家山林城市大丈夫無可不可況功名事業寧有妨礙乎擬棄而求不見古人云不離當處常湛然覓則知君不可見答曹起明居士來書云塵市中凡心易動愈趨愈下據山僧原之正所謂真心發露然既知妄念易動即當究其易動之體究之無處則能動之念頓空能動之念頓空所動之境亦寂能所空寂即返照能究之心安在如是得之不必求靜而靜相自然現前矣既靜相現前亦何分城市山林無時無處無靜無不靜也復徐雨公居士手書并偈讀之深慰但恐還在文字邊來不曾真實做這一番工夫若真實做工夫有得手處生死岸頭自然穩當且不要在根根塵塵上作道理會須回光返照徹見父母未生以前自己本來面目方知十方虛空生汝心中如片雲點太虛裏請思之曾到這箇田地麼若到得這箇田地更有一語在他日相見一笑道破答許慧生居士接來書知做工夫竭力既看古人因緣有會處當來覿面印破又復起疑還是腳跟未點地在既然如是且就疑處挨拶去直待㘞地一聲始得將那從前會得底會不得底一時放下如同箇一總不曾學佛法底相似更不思量卜度如斯做去何慮道業不辦復吳亦如居士別來忽兩載接惠書感愧貧道自揣福薄智淺守拙巖壑無以作後來標榜實為法門罪人然靜思之髮白面皺正法懸微不無永嘆每念居士夙植靈根能現身說法化利末世豈屬聲聞小果而已哉竊云聲聞小果永嘉云三乘雖殊同歸出苦之要聲聞雖小見愛之惑已袪其如棄大戀小見愛尚存即小慕大斯則何咎至讀來諭自置如冰云云貧道不覺歡喜據貧道愚見只恐不能自置如冰若得自置如冰則內心不喘內心不喘則外息塵緣外息塵緣則何喧可喧何寂可寂一念無生便同本有若到這田地更覓箇安身立命處了不可得如斯見得始到德山臨濟門下有喫棒分耳箬禪回極道居士切於性命之憂故一一供直幸諒之也寄路元昭居士聞居士急切為道剪髮割鬚夫道不拘僧俗豈在畏影逃形須是一一從自胸中了當外不見有塵相可離內不見有六根可淨中不見有六識可空如是則即世出世無有一毫沾染處無有一毫挂懷處居塵亦得脫俗亦得不然身雖靜而心未淨形欲逃而影愈彰何若就陰而止隨寓而安免得向外尋覓耶不見古人云雲無心而出岫鳥倦飛而知還寄徒印中法門衰替奈無其人苟得其人師資唱和老僧一夏來雖則勉強精神與諸子提持箇事每思汝高高山頂未審日用作何所務也當時臨濟大師半夏上黃檗山見檗看經次濟云我將謂是箇人元來是唵黑荳老和尚住數日乃辭檗檗云汝破夏來何不終夏去濟曰某甲暫來禮拜和尚檗便打趁令去濟行數里疑此事卻回終夏後又辭檗檗云甚處去濟云不是河南便歸河北檗便打濟約住與一掌檗大笑乃喚侍者將百丈先師禪板几案來濟云侍者將火來檗云不然子但將去已後坐斷天下人舌頭去在且道臨濟當時喫三頓痛棒已是徹上徹下何故至此又卻不會這裏汝若透得提個缽袋子去若未透不可坐卻白雲須是再來度夏始得總饒你會得不來正好痛棒何故莫道一觸便了不顧差別門頭若顧差別門頭還有淆訛處他日何堪為人師法也所以我臨濟大師透頂透底師資道合立法著著自有源頭不若今時無根種草自瞎瞎人亂做將去當自揣之紙筆不盡寄普聞禪人古人為本分事不憚千里萬里買草鞋行腳參尋知識拶得心花頓開而後曲盡師法方好隨處住山分化一方豈肯草草埋沒世緣誤己妨人耶汝既見老僧有決烈志自信自證接納四眾修行老僧恐汝不能盡古人法要又不親近師長提持拈一事出一言有漏逗處未免見笑大方累及老僧所以不得已幾番痛拶切不可入時人得少為足一隊裏去當究明佛祖綱宗徹證徹悟然後為人師範亦未遲不然落在焦芽敗種類有何補於法門乎答黃介子居士二久聞居士篤信此道無緣一晤欣慕之懷時切耿耿接手教知居士現身說法摧邪顯正叱小褒圓非深念法門能如是耶貧道智識暗短抱拙巖壑甘作了事漢因衲子輩每每錯慕萬不得已對眾拈出所刻徒污高明耳目誠為鄙陋何堪克紹先覺者哉正所謂埋沒宗乘塗糊後學但只了得先師所囑之念耳末世時流能所心勝非得大居士證成此事合當掃地矣自過湖南作投老計春來臥病萬事灰心我平老衲至按尊翰辱訂秋冬之舉貧道屈指海內知己不能多得惟居士雖未晤面神交久矣居士夙乘願力呵護于時作末法牆塹然法門衰替無越斯時受請應期滿目咸是古風凋喪溷世隨波願居士弗置貧道於此中則挽一時之弊正在居士力也謹復答方克駿居士二接手書知用工如古人牧牛此是第一等傍實下手處時無虛棄深慰深慰不記得當時郭功輔訪白雲端和尚雲問郭牛淳乎郭云淳矣雲叱之郭拱而立遮裏須自著眼雲曰淳乎淳乎南泉大溈無異此也多口阿師雲乃贈一偈曰牛來山中水足草足牛出山去東觸西觸磬山亦有一偈捏著繩頭不放鬆山中城市一般同調純到得無拘束看破持鞭箇牧童且看此偈與古人是同是別道將一句來何如來諭云閱貧道示偈識貧道為人處自茲以往刻骨銘心不知貧道語句乃一時應病之藥豈可為久治之方耶及元白上座言居士七日靜工得箇歡喜處當自入山親證切不得錯認影響為真實此事最忌抱椿搖櫓以當平生耽閣自己直須徹頭徹尾始得莫待後悔也寄許世安居士二別後未審工夫能拶透自家本來否切不得自拈自弄在光影中著腳既是信得及直須親見一回了了無餘方可自利利人若其間有信有不信處便是工夫不綿密生死心不切知居士決不埋沒平生也得惠書知時常惕勵喜慰四頌見處不無宜加更進不然卻成窠臼矣答繆采室居士既知有這一著子豈有知而不造者乎只恐朱紫不分路頭不正便有疑滯今既留意古人語錄不被古人瞞卻得與古人一鼻孔出氣方親見古人作略若見古人作略又何妨於筆舌辨駁哉到這裏寧分得自己大事於古於今不相干涉耶果看到無古無今忘爾忘我處貧道與公相見久矣又何分未覿面未開口一為點破者乎復賀極菴居士三屢接書以此事諄諄若論此事須是具大根器提得起放得下將三教聖人收來一箇鼻孔出氣方纔喫得老僧痛棒擔荷得向上一著若只欲避喧求靜則不濟事矣聞居士中暑腫毒痛苦殊甚不知正當疼痛時作何排遣若痛苦之際與歡娛之時能自並著乃可作入道之徑今時人多打作兩橛不知痛者是誰娛者是誰這裏蹉過更別尋頭路便錯了也況是第二門頭乎若要直截慶快須向歡娛未至處痛苦不來時坐斷要津不通凡聖了了分明作得主把得住從他苦亦得歡亦得不歡不苦亦得纔不被塵勞煩惱根境所奪耳來諭日用中每提業識忙忙語貧道云若是本地風光上見得徹則日用事無別矣豈更有塵勞煩惱遮障喚作業識忙忙者乎既日用不得力須當本分上竭力參究直待㘞地一聲方得日用應緣處了當如本分未透先於應緣處撈摸則便見業識忙忙自相矛盾矣復曹念茲居士屢接書屢以苦相告貧道每每置簡長嘆夫三界苦海貧富貴賤老幼男女皆不能自繇都被塵勞煩惱汩沒無有出頭日子豈獨居士一人而已哉故我大覺聖人運大慈悲開方便門指一條直截徑路要人返本還源云一切有為法如夢幻泡影如露亦如電應作如是觀若識得世間一切法如夢如幻了了分明一一非實即知身心亦幻也功名亦幻也富貴亦幻也煩惱亦幻也便可在塵勞作佛事居火宅為道場豈肯埋沒己靈虛生浪死今尊翁六十九歲已辭世生平學業世業始終受用皆為全福撒手時一些帶不去豈非夢幻境界若於道有相應得力處方用得著來去自繇耳居士年過半百世間功名富貴豈可仍前認著急須體究自家本分一著莫待臨渴掘井人生事業無窮精神有限寧得以有限精神隨無窮世事何況復以煩惱憂愁自致汩沒耶復林皋豫禪人邇來諸方大壞綱宗蓋為師承授受不擇其人只圖衒耀虛名不能救萬分之一嗟嗟佛法下衰以至如斯汝當自勉力體老僧心志更須持守一番學不厭多語不嫌寡不可自是而輕忽一切倘一事失之於前百事不能挽於後矣與蔡鳴鄒封翁門下多生有般若緣一晤如舊高年正宜自重世務無有了期如剝芭蕉葉一般去一層又一層終無盡日少閒入山共商性命之學何如復韓聖開居士讀來諭知居士未有果決處若踏著本地風光意識不行豈有仍落之說耶後云不知誰為快當誰為穩實正在猶豫裏須當坐斷千差向直截根源處拶入自然不走尋常義路行到不疑之地方可隨宜受用動靜一如切忌將古人言教為證據不見道語證不可示人此事如魚飲水冷暖自知耳與唐祈遠居士承惠顧諄諄一眾瞻仰居士夙稟願力普心外護使像季頹綱從茲復振凡庸俗眼豈能窺其妙用聞之而不遠笑耶但箇中人自當點首欣羨耳貧道衰年相遇既晚願居士以本分事究徹根源工夫急切自然成片不可謂減口福為修證古人云大象不遊於兔徑當自珍重復許九環居士居士臥病如毘耶老人誘引一方啟我妙偈真為入不二法門不妨看破龐公參堂已竟未知還信得及否這裏若擬議待過我一笑點破答張大若居士昨惠顧并賜讀易悟由深知居士通身坐在易理恍然有會於動靜之間現於簡易者哉所以貧道問居士四大各歸其源動靜之相了不可得那時在什麼處安身立命居士雖答貧道恰似未愜貧道意若要生死岸頭用得著直須向一畫未舉前薦取踏著本命元辰方纔一動一靜一語一默著著歸根無不了了不然總落古人糟粕裏復慈引蘇公來書云功課不缺刻刻念佛但提不起誰字話只怕信不及果信得及提得這一箇誰字起當下超脫古云直下見性成佛決不相賺正所謂急處一提也這便是破塵網之利刃得淨念之源頭努力努力復司理黃海岸居士久聞有大居士現宰官身隨宜說法起於壽昌博山末後向天童山中觸著拄杖頭西江一派波湧紋生深荷法門牆塹有人矣貧道久棲巖谷甘自一生希入苕濱移茆深隱荒院破剎兼之抱病承居士以東明見招并唐居士再三竭力此旵祖道場靈塔現在貧道何忍坐視寥落但值病中未能周旋托學徒山茨代引一方二百餘年不了公案得居士舉揚此話大行又何待病僧饒舌也與吳迪美居士貧道病軀勉強出山蓋為法門希望接得一箇半箇續佛慧命不料轉轉病深支持不過所以凡相知者久不能通候磬山事唯望公一人可以了貧道沒後事足見昔日佛法中有契合處若論此事不惟荊溪少乃至浙地亦如是也貧道觀公根器第一等決不埋沒於功名富貴中混過一生雖然功名正務不得不了亦須把作一件事做不然亦是被塵勞擔閣病筆不盡法語示印中授徒吾子卓然獨立於陽山之巔拔群峰而上歲序已久操守穩密行致純白於苦寒無極而確志不移古今忘軀為道之士曷以加焉然有其志必期超佛越祖而後已所見所證決要到佛祖不到處如思大住山時志公勉彼出世云目視雲漢作麼思云三世諸佛被我一口吞盡何處更有眾生可度他不是單守這一箇乾蘿蔔頭無所施設無所作為實乃聖凡迷悟三乘學解一齊超脫活脫無依真道人也今人未到這田地緊緊須看古人無義味語種種因緣密密體究看他是箇什麼道理一一俱要透過不被他瞞直至無疑無悟之地七穿八穴拶到古人不到處則所悟既真所行必到所學既實所證要明最親切處更加親切然後甦醒得來掀翻窠臼掃絕蹤由把從前學解的見聞的悟證的一拋拋向那邊更那邊漫漫拈龜毛拂子指東話西繫風點雨捉兔角杖敲空作響摟角推山橫拈倒用都合其宜了非分外有時將一大藏教收向杖頭說權說實有時假千七百則拈露拂柄談妙談玄無文處著文得句時鏟句或說非以奪是即非是而遷或據是以破非即是非而遣不涉思惟熾然作用不動真覺遍界周圓所以攪長河為酥酪變大地作黃金豈奇怪事法爾如然蓋覺性平等所以目前法法無非空劫之寥寥也空劫寥寥即是目前之法法也要以見在機先意超言外與夫飛泉落澗清韻長吟可以激揚般若之真機空谷行風玄音和雅可以提挈綱宗之妙訣汝欲頌耶不撥舌而松風浩然豈非頌也汝欲詩耶未啟唇而雲鳥悠然豈非詩也如是則古人公案方許拈提否則不得造次依稀快須猛著精彩不是信口胡亂必欲直入靈源不是依樣畫描自有別通消息不是抱椿搖櫓要當放浪虛舟思之思之切須仔細繼續佛慧承躅先宗詎是細事當發高遠之志徹底窮源邁古超今發言吐氣蓋天蓋地始不負吾所囑又何患乎晚成也哉示慧林範住東禪衲子只慮道力弗克不患福緣不就福緣就於外道力充於內內外相應其道始行所以老僧時常教人只是操持這一著子這一著子見得真踏得穩無論山林城市隨遇而安隨方以化便不被境緣順逆得失之所拘礙且住持之要以行道為急務又豈可苟逐世緣孤負初志耶佛祖慧命如懸絲宜當自勉示知有本徒掩關古人設關立限先須撥置諸緣放下一切端為本分一著其間根行不等或有發明而養道者或有入手而未得親證者或有發憤而求妙悟者或稍有省發透不過古人公案機緣一一要研窮體究者或厭塵煩而求靜慮為得者雖則不同及至歸源本乎一致不是徒衒虛名而已汝既發此志須教心地中打點潔潔淨淨無有纖毫住著處已上所說徹底掀翻不可身居靜室意逐外緣徒自勞神染污性地況關中日期有限過了一日便少一日時時須自簡點刻刻把本提撕箇中若有絲毫染著即起生死心不得解脫於佛祖言教便打不徹矣溈山老人云理雖頓悟須除現業流識此是真實修證工夫不可莽莽蕩蕩作聰明知見解會以了平生今時人學道十箇有五雙初無世緣念起只要幹辦生死特入叢林參尋知識或一言之下撥動機關便為得手日久月深漸漸疏怠隨逐世緣道力不能勝於業力清濁不分權宜不達忽忽光陰混混度日依然埋沒無有出頭日子真可憐憫汝既操守潔白須到古人不到處方可了當若有纖毫滯擬即落今事門頭便不穩當也咄金剛寶劍當頭截莫管人間是與非示林皋豫禪人鼻祖西來不立文字直指人心初無委曲六傳而至曹溪法門隆盛虎驟龍驤宗分兩派青原南嶽嶽出馬大師原出石頭老然後再傳繁茂遍滿寰區故立五宗乃為的要各出手眼相續綿綿或痛快或嚴密或承順或投機或普應總不越初祖單傳之旨各展玄猷而三玄三要五位君臣一鏃三關父慈子敬三界唯心隨人所入悟徹根源門庭雖異理終一揆豈料今日去聖時遙雖從其派不善先宗妄自穿鑿將古人旨趣扭捏論是論非分彼分此出自己見誤賺後裔皆輕狂莽鹵不念佛祖之道只是逞己逞能全憑口舌利辯打哄過時以圖鬧熱門庭作無端之狀雖有智者力不能挽正是魔強法弱之際可歎可嗟豫禪人始參雲門次見博山再禮金粟自末稍頭來入磬山相依三番寒暑扣己所參老僧一一皆拈本分鉗錘透脫從上知見不是尋常途泛之流而衒虛頭竊取名譽者也素願深山窮谷盤結草庵以待天緣接得一箇半箇而了生平繇是乞老僧法語用助其志云耳示林玹琇侍者既為大僧當行大事立志要高願力要深膽氣要大心行要細心行若細念念入微見到一念未生之前則不被境緣奪去而用麤心浮氣之所動作也膽氣若大始可擔荷潑天門戶他日普化群品能以無畏說法也願力若深百千法門學而不厭縱遇諸魔障難於中不動毫端了了分明一一順受勇猛精進也立志若高則無速求見聞知解塞自悟門不到徹頭徹尾大休大歇田地決不肯應點時流埋沒自己也若四種成就豈是泛常小根小莖秪圖熱鬧門庭不揣道力未充德業未辦見地不徹學問不廣背己逐物徒衒虛名而已哉琇侍者幼習儒已婚年十九捐妻徑造磬山禮老僧為師祝髮受具扣己所參古今因緣多有透露處莫不繇其夙因也雖然老僧愈不肯放過伊加其鞭策無他蓋欲爾成其大樹為異日人之所望也一日將紙跪于前求法語老僧信筆直書如斯忉怛未免見笑大方憐兒不覺醜在示天倪上座達磨少林面壁曹溪獵隊潛藏待其時行則行而後播揚單傳之道非泛泛然也今之好為人師者多韜光匿跡者少以致法門靡薄古風凋喪歎息空山良可哀矣茲天倪上座出自雲門久參黃檗凡海內知識無不請益十數年來隱居姑蘇不露爪牙不美唇舌不求名聞不涉外緣耽耽一頭陀行可為真正衲子每每造余室所扣機緣皆從上尊宿末後句老僧擊開關要已傾心吐服舒紙乞法語余固辭曰吾言之不足取信於天下不若無言也況上座如斯力行亦何待吾言取信耶天倪再拜曰某揣福薄敢爾妄求但有住山之志耳余故此示以見老成他日接納方來紹佛慧種實未可量也示石林禪人百千法門同歸方寸方寸得了頭頭爾法法爾念念爾物物爾目前無有一絲毫間隔處若未了得處處沾著物物有障念念有乖法法有執便有凡聖見便有愚智分便有迷有悟纖毫打不透皆被聲塵色相上轉卻了也石林禪人從法濟事老僧度夏過磬山一載工夫雖綿密不懈未能得大休歇乞法語策進若論此事要假他人著力則不濟事矣大丈夫須是一刀兩斷始得示周侍者住大寂庵乾坤之內宇宙之間中有一寶秘在形山古人恁麼道今人放過者多體解者亦不少周侍者隨老漢有年矣晨夕殷勤執勞幹辦事事皆善唯此一著獨未能了今離左右引徒住山當自卓立遵佛遺訓達祖源頭扣己所參切切思之圓頂方袍豈是容易即此大寂場中見得徹放得下無邊佛事從此頓興可作一方領袖慎終如始不孤檀越之恩發明已有不負師長之誨莫學流俗阿師一住院子徒為受用虛消信施埋沒家珍也須是猛著精采竭力一番不然他時後日噬臍無限矣示啟知庫余衰年矣凡見學者誠心辦道忘身為法愛如手足提其綱要發其器能只欲彼造道淵微深厚蓄養做箇本分衲僧他日支持法門不致寥落以是三十年來相見雖多可意者僅得一二豈非得人之難耶或有見道靈利行門未確或有行門懇苦見道機遲終不能得中道之理所以法門靡靡愈薄殆不可救矣全賴老誠扶叢林之大體振末法之頹綱不可厭繁冗趨寂寞不可棄有為墮偏枯方是端人正士之用心也努力努力示嵩典座昔日藥山和尚問雲巖甚處來巖云百丈來山云百丈有何言句巖云有時示眾云我有一句子百味具足山云鹹即鹹味淡即淡味不鹹不淡是常味作麼生是百味具足底句巖無對山笑云爭奈目前生死何巖云目前無生死山云二十年在百丈俗氣也不除汝今為典座必知其味不鹹不淡是什麼味若代得一轉語言下即生死永斷如未透得直須做一番死工夫始得不是依依稀稀當有當無鹹也不管淡也不管只管亂做去打發得便罷老僧遮裏決不輕放過了誤汝以誤後人示唐祈遠居士本分一著不在外求求之轉遠信得及直下薦取不容擬議所以古人云向上一著千聖不傳學者勞形如猿捕影這裏如未委悉必須提取話頭如何是我父母未生前本來面目行也提住也提坐也提臥也提提得不提而自提疑情純熟㘞地一聲徹見自家本來面目到此之際方好來喫老僧痛棒示方克駿居士人處苦海中不發勇猛志斷不能出得生死流既知有此事豈可悠悠緩縱倘生死臨頭何有老少從他至親骨肉不能挽回空自躑足捶胸如斯看來當趁此時色力強健決要話頭上討箇分曉打徹根源穩穩當當那時來去自繇不妨慶快平生矣若工夫不得綿密無他皆繇生死心不切故果生死心切則在功名富貴之中不被功名富貴之所埋沒在人我是非之際不被人我是非之所牢籠譬如摩尼寶珠落於淤泥塵穢終不變色雖經塵劫本質光耀也只要洗滌得乾乾淨淨無有一毫染污處無有一毫虧損處工夫拶到這裏不覺㘞地一聲那時便識得自家寶藏不從外來記取記取示孫子和居士寄跡儒業潛心般若非大根器則不能並行既有力量入此門來提箇話頭則不管忙閒動靜處行住坐臥時嘿嘿提撕提得這句話頭純熟十二時中不提自提方纔話頭得力日深月久凝然湛寂連這話頭無所著處外不見有山河大地內不見有五蘊身心純是一片疑情那時橫又橫不得豎又豎不得便是好消息也切忌被他人惑打失了宜加勇猛難行要行難忍要忍如是捱將去驀然漆桶底脫爆地一聲方是出頭處也今時有等魔家眷屬只要鼓弄人家男女見人略具些些英氣便道是法器也有甚工夫可做我有秘要令他即日可辦不怕作地獄業自賺猶可更賺他人佛出世來救伊不得切須仔細自具法眼正見圓明邪正自辨生死事大至祝至祝示賢道人賢者既為生死事大實志修行看破身心虛幻不著浮榮真為難得須要先知大體然後發大智慧得大受用修證工夫不離日用在世出世無有一毫留滯始得且道如何是大體大體者乃自己妙明常住真心即心即佛心外無佛佛外無心心即佛佛即心無有絲毫隔礙無有絲毫做作若有絲毫隔礙即不見佛若有絲毫做作便是邪魔外道種子大道即在目前十二時中頭頭上明物物上現不可棄本逐末背明投暗著相尋求求之轉失一切事務到來一一簡點了了分明亦不可起厭煩心若有厭煩心起多一重魔障不能發大智慧得大自在受用也經云心佛眾生三無差別只因眾生妄想攀緣處處執著故不能證得隨類受苦輪轉生死無有窮盡所以如來出世欲令眾生開佛知見識取自家本來面目非從外得若云外得即是外道知見超凡入聖只在爾我一念之間迴光返照若得一念清淨即根根塵塵清淨根根塵塵清淨即一世界清淨一世界清淨即諸世界清淨諸世界清淨即無邊世界清淨無邊世界清淨即不可說世界清淨不可說世界清淨就此清淨境界亦莫作清淨理會即火宅安居便是極樂世界豈可分別是男是女作東作西便十二時中驅奴使婢接物應緣終日治家乃至穿衣喫飯無不清淨方纔佛法現前打成一片真實受用爭奈時人日用不知埋沒家寶不得光明透露反欲向外求覓不知愈求愈遠真可憐憫賢者既慕老僧皈依三寶須是一一從我教誨決不相賺切忌尋常生煩惱懼怕世事煩惱若生便落煩惱魔亦不可生懈怠若起懈怠心便落散亂魔亦不可落空見莽莽蕩蕩所以祖師云離世覓菩提恰如求兔角我此法門從上佛祖遞相傳授不是邪魔外道胡說亂說見神見鬼令人盲修瞎煉雖是善因而招惡果已上說話因見賢者至誠相信不覺忉怛一一體究如親覿面祝祝示如道人今時學道人不肯體究本來面目只在門頭戶腦處承當日用境緣上為是殊不知這日用底事須教明徹本體纔得相應若本體不明單取目前為是者正認識神為自己也既認識神為自己生死之念何時得空苦樂之因何時得脫所以要究明本來面目穩當到無疑惑地始得且道如何是我本來面目也須是你自肯休歇到一念不生前後際斷親見一回然後漫漫甦醒將來一動一靜一語一默無不了然無不自在得無諸礙自然頭頭爾法法爾不然都是承虛接響有什麼用處示妙如道人祖師心印狀似鐵牛之機去則印住住則印破豈有實法累人耶所以教人持話頭參禪發明人人本有之性不向外求亦不著六根門頭播弄光影直須極盡今時如汝所言知知無所知覺覺無所覺直饒見到恁麼田地了得能覺能知尚未了了能覺能知在到此須自徹悟始得不可怕落空怕落空一念即是生死根本一總空卻能所頓忘纖緣淨盡纔知三十六年原不曾生百年後原不曾滅生滅既滅寂滅現前然後謾謾甦醒將來二六時中決不可放過這一著若放過這一著即落在第二頭也又恐妄認識神為自性昧其靈覺之真體須當穩密行持念念正念事事真誠了了常知湛湛圓寂方可說行亦禪坐亦禪語默動靜體安然也雖然如是明眼人前休說夢話咄
